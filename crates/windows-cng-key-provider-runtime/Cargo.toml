[package]
name = "ergaxiom-windows-cng-key-provider-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = []
provisioning = []

[dependencies]
base64.workspace = true
ergaxiom-windows-production-signer-runtime = { path = "../windows-production-signer-runtime" }
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography"
] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
