[package]
name = "ergaxiom-windows-production-trust-state-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
ergaxiom-proof-kernel = { path = "../proof-kernel" }
ergaxiom-windows-production-key-governance-runtime = { path = "../windows-production-key-governance-runtime" }
ergaxiom-windows-production-signer-protocol-runtime = { path = "../windows-production-signer-protocol-runtime" }
ergaxiom-windows-production-signer-runtime = { path = "../windows-production-signer-runtime" }
ergaxiom-windows-production-signer-service-runtime = { path = "../windows-production-signer-service-runtime" }
ergaxiom-windows-signer-service-identity-runtime = { path = "../windows-signer-service-identity-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem"
] }

[dev-dependencies]
p256.workspace = true
rand_core.workspace = true

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
