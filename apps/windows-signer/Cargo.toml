[package]
name = "ergaxiom-windows-signer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
ergaxiom-key-governance-runtime = { path = "../../crates/key-governance-runtime" }
ergaxiom-proof-kernel = { path = "../../crates/proof-kernel" }
ergaxiom-windows-signer-protocol-runtime = { path = "../../crates/windows-signer-protocol-runtime" }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
ergaxiom-attestation-issuance-runtime = { path = "../../crates/attestation-issuance-runtime" }
ergaxiom-attestation-runtime = { path = "../../crates/attestation-runtime" }
ergaxiom-capability-issuance-runtime = { path = "../../crates/capability-issuance-runtime" }
ergaxiom-capability-runtime = { path = "../../crates/capability-runtime" }
ergaxiom-contract-runtime = { path = "../../crates/contract-runtime" }
ergaxiom-governed-verification-runtime = { path = "../../crates/governed-verification-runtime" }
ergaxiom-operator-plan-runtime = { path = "../../crates/operator-plan-runtime" }
ergaxiom-windows-signer-client-runtime = { path = "../../crates/windows-signer-client-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory"
] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
