name: Launch PR 61 review repair

on:
  pull_request:
    paths:
      - ".github/workflows/address-pr61-review-launcher.yml"
      - ".github/workflows/address-pr61-review.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Extract and apply the verified repair patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/address-pr61-review.yml").read_text(encoding="utf-8")
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          script = textwrap.dedent(workflow[start:end])
          helper_start = script.index("def replace_once")
          helper_end = script.index("\ndef regex_once", helper_start)
          tolerant_helper = '''def _shift_snippet(value: str, width: int, after_first_only: bool) -> str:
              lines = value.splitlines(keepends=True)
              shifted = []
              for index, line in enumerate(lines):
                  if after_first_only and index == 0:
                      shifted.append(line)
                  elif line.startswith(" " * width):
                      shifted.append(line[width:])
                  else:
                      shifted.append(line)
              return "".join(shifted)

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              variants = [(old, new)]
              for width in (4, 8, 12, 16):
                  variants.append((
                      _shift_snippet(old, width, True),
                      _shift_snippet(new, width, True),
                  ))
                  variants.append((
                      _shift_snippet(old, width, False),
                      _shift_snippet(new, width, False),
                  ))
              seen = set()
              for candidate_old, candidate_new in variants:
                  if candidate_old in seen:
                      continue
                  seen.add(candidate_old)
                  count = value.count(candidate_old)
                  if count == 1:
                      write(path, value.replace(candidate_old, candidate_new, 1))
                      return
                  if count > 1:
                      raise SystemExit(
                          f"ambiguous match in {path}, found {count}: {candidate_old[:120]!r}"
                      )
              raise SystemExit(f"expected one match in {path}, found 0: {old[:120]!r}")
          '''
          script = script[:helper_start] + textwrap.dedent(tolerant_helper) + script[helper_end:]
          script = script.replace(
              "                recovery.verify(governance_policy, trusted_now_epoch_s)?;\n"
              "            Some(recovery)\n",
              "                recovery.verify(governance_policy, trusted_now_epoch_s)?;\n"
              "                Some(recovery)\n",
              1,
          )
          script = script.replace(
              "                recovery.verify_persisted(governance_policy)?;\n"
              "            if recovery.body.deployment_id != checkpoint.deployment_id\n"
              "                || recovery.body.replacement_state_digest != checkpoint.state_digest\n"
              "                || recovery.body.recovery_sequence != checkpoint.last_recovery_sequence\n"
              "            {\n"
              "                return Err(ProductionTrustStoreError::RecoveryFileStateMismatch);\n"
              "            }\n"
              "            Some(recovery)\n",
              "                recovery.verify_persisted(governance_policy)?;\n"
              "                if recovery.body.deployment_id != checkpoint.deployment_id\n"
              "                    || recovery.body.replacement_state_digest != checkpoint.state_digest\n"
              "                    || recovery.body.recovery_sequence != checkpoint.last_recovery_sequence\n"
              "                {\n"
              "                    return Err(ProductionTrustStoreError::RecoveryFileStateMismatch);\n"
              "                }\n"
              "                Some(recovery)\n",
              1,
          )
          Path("/tmp/address_pr61_review.py").write_text(script, encoding="utf-8")
          PY
          set +e
          python /tmp/address_pr61_review.py 2>&1 | tee pr61-repair-diagnostics.log
          status=${PIPESTATUS[0]}
          echo "$status" > pr61-repair-diagnostics.status
          exit 0
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr61-repair-diagnostics
          retention-days: 7
          if-no-files-found: error
          path: |
            pr61-repair-diagnostics.log
            pr61-repair-diagnostics.status
            /tmp/address_pr61_review.py
      - name: Fail when patch application failed
        shell: bash
        run: test "$(cat pr61-repair-diagnostics.status)" = "0"
      - name: Canonicalize workspace
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Run repaired boundary tests and capture diagnostics
        shell: bash
        run: |
          set +e
          {
            cargo test -p ergaxiom-windows-production-trust-state-runtime --all-features
            cargo test -p ergaxiom-windows-production-signer-transport-runtime --all-features
            cargo test -p ergaxiom-windows-production-signer-host-runtime --all-features
            cargo test -p ergaxiom-capability-issuance-runtime --all-features
            cargo test -p ergaxiom-attestation-issuance-runtime --all-features
          } 2>&1 | tee pr61-test-diagnostics.log
          status=${PIPESTATUS[0]}
          echo "$status" > pr61-test-diagnostics.status
          exit 0
      - name: Upload repaired boundary test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr61-test-diagnostics
          retention-days: 7
          if-no-files-found: error
          path: |
            pr61-test-diagnostics.log
            pr61-test-diagnostics.status
      - name: Fail when repaired boundary tests failed
        shell: bash
        run: test "$(cat pr61-test-diagnostics.status)" = "0"
      - name: Lint repaired boundaries
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-trust-state-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            --all-targets --all-features -- -D warnings
      - name: Commit verified repairs and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/address-pr61-review.yml
          rm .github/workflows/address-pr61-review-launcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address production signer review findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
