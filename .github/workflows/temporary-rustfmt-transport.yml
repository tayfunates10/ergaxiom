name: Temporary rustfmt transport artifact

on:
  pull_request:
    paths:
      - "crates/windows-production-signer-transport-runtime/**"
      - ".github/workflows/temporary-rustfmt-transport.yml"

permissions:
  contents: read

jobs:
  format-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Format workspace
        run: cargo fmt --all
      - name: Check Windows transport target
        shell: bash
        run: |
          set +e
          cargo check \
            --target x86_64-pc-windows-msvc \
            -p ergaxiom-windows-production-signer-transport-runtime \
            --all-targets 2>&1 | tee transport-compile.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload formatted transport sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-production-signer-transport
          if-no-files-found: error
          retention-days: 1
          path: |
            transport-compile.log
            crates/windows-production-signer-transport-runtime/Cargo.toml
            crates/windows-production-signer-transport-runtime/src/lib.rs
            crates/windows-production-signer-transport-runtime/src/windows.rs
            crates/windows-production-signer-transport-runtime/tests/transport.rs
