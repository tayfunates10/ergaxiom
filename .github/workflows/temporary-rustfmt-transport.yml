name: One-shot bounded pipe repair

on:
  push:
    branches:
      - agent/tpm-cng-signer-service-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'tayfunates10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply fixed transport correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          windows = Path('crates/windows-production-signer-transport-runtime/src/windows.rs')
          source = windows.read_text()
          old = '''use windows_sys::Win32::System::Threading::{
              CancelSynchronousIo, CreateEventW, GetCurrentProcess, GetCurrentThread, SetEvent,
              WaitForSingleObject,
          };'''
          new = '''use windows_sys::Win32::System::IO::CancelSynchronousIo;
          use windows_sys::Win32::System::Threading::{
              CreateEventW, GetCurrentProcess, GetCurrentThread, SetEvent, WaitForSingleObject,
          };'''
          if old not in source:
              raise SystemExit('expected CancelSynchronousIo import not found')
          windows.write_text(source.replace(old, new, 1))

          tests = Path('crates/windows-production-signer-transport-runtime/tests/transport.rs')
          source = tests.read_text()
          marker = '''#[cfg(windows)]
          #[test]
          fn idle_connected_client_is_disconnected_after_bounded_read_deadline()'''
          start = source.find(marker)
          if start < 0:
              raise SystemExit('expected transport test marker not found')
          replacement = r'''#[cfg(windows)]
          #[test]
          fn idle_connected_client_is_disconnected_after_bounded_read_deadline()
          -> Result<(), Box<dyn std::error::Error>> {
              use std::time::{Duration, Instant};

              let contract = NamedPipeSecurityContract::production("S-1-1-0")?;
              let mut server = ProductionSignerPipeServer::bind(contract.clone())?;
              let client = spawn_raw_client(None, Duration::from_millis(500));

              let mut connection = server.accept()?;
              let started = Instant::now();
              let result: Result<TestRequest, ProductionSignerTransportError> =
                  connection.read_json_with_timeout(1024, 100);
              assert!(matches!(
                  result,
                  Err(ProductionSignerTransportError::IoTimedOut)
              ));
              assert!(started.elapsed() < Duration::from_secs(2));
              drop(connection);
              join_raw_client(client)?;

              let replacement = ProductionSignerPipeServer::bind(contract)?;
              drop(replacement);
              Ok(())
          }

          #[cfg(windows)]
          #[test]
          fn malformed_complete_message_is_rejected_without_waiting_for_deadline()
          -> Result<(), Box<dyn std::error::Error>> {
              use std::time::{Duration, Instant};

              let contract = NamedPipeSecurityContract::production("S-1-1-0")?;
              let mut server = ProductionSignerPipeServer::bind(contract.clone())?;
              let client = spawn_raw_client(Some(b"{".to_vec()), Duration::from_millis(250));

              let mut connection = server.accept()?;
              let started = Instant::now();
              let result: Result<TestRequest, ProductionSignerTransportError> =
                  connection.read_json_with_timeout(1024, 1_000);
              assert!(matches!(result, Err(ProductionSignerTransportError::Json(_))));
              assert!(started.elapsed() < Duration::from_millis(500));
              drop(connection);
              join_raw_client(client)?;

              let replacement = ProductionSignerPipeServer::bind(contract)?;
              drop(replacement);
              Ok(())
          }

          #[cfg(windows)]
          #[test]
          fn connection_drop_does_not_wait_for_nonreading_client()
          -> Result<(), Box<dyn std::error::Error>> {
              use std::time::{Duration, Instant};

              let contract = NamedPipeSecurityContract::production("S-1-1-0")?;
              let mut server = ProductionSignerPipeServer::bind(contract.clone())?;
              let request = serde_json::to_vec(&TestRequest {
                  value: "request".to_owned(),
              })?;
              let client = spawn_raw_client(Some(request), Duration::from_millis(1_500));

              let mut connection = server.accept()?;
              let request: TestRequest = connection.read_json_with_timeout(1024, 1_000)?;
              assert_eq!(request.value, "request");
              connection.write_json_with_timeout(
                  &TestResponse {
                      value: "response".to_owned(),
                  },
                  1024,
                  1_000,
              )?;
              let started = Instant::now();
              drop(connection);
              assert!(started.elapsed() < Duration::from_millis(500));
              join_raw_client(client)?;

              let replacement = ProductionSignerPipeServer::bind(contract)?;
              drop(replacement);
              Ok(())
          }

          #[cfg(windows)]
          fn spawn_raw_client(
              message: Option<Vec<u8>>,
              hold_open: std::time::Duration,
          ) -> std::thread::JoinHandle<Result<(), String>> {
              use std::ptr::{null, null_mut};

              use ergaxiom_windows_signer_service_identity_runtime::PRODUCTION_PIPE_NAME;
              use windows_sys::Win32::Foundation::{CloseHandle, INVALID_HANDLE_VALUE};
              use windows_sys::Win32::Storage::FileSystem::{CreateFileW, WriteFile};
              use windows_sys::Win32::System::Pipes::WaitNamedPipeW;

              const GENERIC_READ: u32 = 0x8000_0000;
              const GENERIC_WRITE: u32 = 0x4000_0000;
              const OPEN_EXISTING: u32 = 3;
              const FILE_ATTRIBUTE_NORMAL: u32 = 0x0000_0080;

              std::thread::spawn(move || -> Result<(), String> {
                  let pipe_name: Vec<u16> =
                      PRODUCTION_PIPE_NAME.encode_utf16().chain(Some(0)).collect();
                  // SAFETY: pipe_name is a live NUL-terminated fixed local pipe name and the
                  // wait is bounded for this real Windows regression.
                  if unsafe { WaitNamedPipeW(pipe_name.as_ptr(), 5_000) } == 0 {
                      return Err(std::io::Error::last_os_error().to_string());
                  }
                  // SAFETY: all pointers and flags follow the documented local named-pipe open
                  // contract and no handle inheritance is requested.
                  let handle = unsafe {
                      CreateFileW(
                          pipe_name.as_ptr(),
                          GENERIC_READ | GENERIC_WRITE,
                          0,
                          null(),
                          OPEN_EXISTING,
                          FILE_ATTRIBUTE_NORMAL,
                          null_mut(),
                      )
                  };
                  if handle == INVALID_HANDLE_VALUE {
                      return Err(std::io::Error::last_os_error().to_string());
                  }
                  if let Some(message) = message {
                      let mut written = 0_u32;
                      // SAFETY: handle is live and message is readable for its exact length.
                      if unsafe {
                          WriteFile(
                              handle,
                              message.as_ptr().cast(),
                              message.len() as u32,
                              &mut written,
                              null_mut(),
                          )
                      } == 0
                          || written != message.len() as u32
                      {
                          let error = std::io::Error::last_os_error().to_string();
                          // SAFETY: handle is the one owned live client handle created above.
                          unsafe {
                              let _ = CloseHandle(handle);
                          }
                          return Err(error);
                      }
                  }
                  std::thread::sleep(hold_open);
                  // SAFETY: handle is the one owned live client handle created above.
                  unsafe {
                      let _ = CloseHandle(handle);
                  }
                  Ok(())
              })
          }

          #[cfg(windows)]
          fn join_raw_client(
              client: std::thread::JoinHandle<Result<(), String>>,
          ) -> Result<(), Box<dyn std::error::Error>> {
              let result = client
                  .join()
                  .map_err(|_| std::io::Error::other("raw client thread panicked"))?;
              result.map_err(std::io::Error::other)?;
              Ok(())
          }
          '''
          tests.write_text(source[:start] + replacement)
          PY
      - name: Format and check Windows transport target
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check \
            --target x86_64-pc-windows-msvc \
            -p ergaxiom-windows-production-signer-transport-runtime \
            --all-targets
      - name: Commit verified one-shot repair and remove workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-rustfmt-transport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-transport-runtime .github/workflows/temporary-rustfmt-transport.yml
          git commit -m "Harden bounded production signer pipe I/O"
          git push origin HEAD:agent/tpm-cng-signer-service-v1
