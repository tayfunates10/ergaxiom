name: One-shot indirect PDF resource fix

on:
  push:
    branches:
      - agent/print-ready-poster-preflight-certified-path-v1
    paths:
      - ".github/workflows/one-shot-indirect-pdf-resources-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/print-ready-poster-preflight-certified-path-v1
          fetch-depth: 0

      - name: Resolve direct and indirect page resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pdf_path = Path('crates/print-ready-poster-preflight-certified-path-runtime/src/pdf.rs')
          text = pdf_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'use lopdf::{Dictionary, Document, Object};\n',
                  'use lopdf::{Dictionary, Document, Object, ObjectId};\n',
              ),
              (
                  '    let (resources, _) = document.get_page_resources(page_id)?;\n'
                  '    let vector_only = resources.is_none_or(|resources| resources.get(b"XObject").is_err());\n'
                  '    let fonts_outlined = resources.is_none_or(|resources| resources.get(b"Font").is_err());\n',
                  '    let resources = page_resource_dictionaries(&document, page_id)?;\n'
                  '    let vector_only = resources\n'
                  '        .iter()\n'
                  '        .all(|resources| resources.get(b"XObject").is_err());\n'
                  '    let fonts_outlined = resources\n'
                  '        .iter()\n'
                  '        .all(|resources| resources.get(b"Font").is_err());\n',
              ),
              (
                  '    let resources_safe =\n'
                  '        resources_transparency_safe(&document, resources, &used_graphics_states, &allowed)?;\n'
                  '    let groups_safe = document_transparency_groups_safe(&document, &allowed)?;\n'
                  '    eprintln!(\n'
                  '        "print PDF transparency diagnostics: malformed_gs={malformed_graphics_state_operator} resources_safe={resources_safe} groups_safe={groups_safe} used_gs={used_graphics_states:?} resources={resources:?}"\n'
                  '    );\n'
                  '    let transparency_absent = !malformed_graphics_state_operator && resources_safe && groups_safe;\n',
                  '    let transparency_absent = !malformed_graphics_state_operator\n'
                  '        && resources_transparency_safe(\n'
                  '            &document,\n'
                  '            &resources,\n'
                  '            &used_graphics_states,\n'
                  '            &allowed,\n'
                  '        )?\n'
                  '        && document_transparency_groups_safe(&document, &allowed)?;\n',
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('indirect resource source profile did not match')

          start = text.index('fn resources_transparency_safe(')
          end = text.index('\nfn document_transparency_groups_safe(', start)
          replacement = '''fn page_resource_dictionaries(
              document: &Document,
              page_id: ObjectId,
          ) -> Result<Vec<&Dictionary>, PrintPdfError> {
              let (direct_resources, resource_ids) = document.get_page_resources(page_id)?;
              let mut resources = Vec::new();
              if let Some(direct_resources) = direct_resources {
                  resources.push(direct_resources);
              }
              for resource_id in resource_ids {
                  resources.push(document.get_dictionary(resource_id)?);
              }
              Ok(resources)
          }

          fn resources_transparency_safe(
              document: &Document,
              resources: &[&Dictionary],
              used_graphics_states: &BTreeSet<String>,
              allowed_color_spaces: &BTreeSet<&str>,
          ) -> Result<bool, PrintPdfError> {
              if resources.is_empty() {
                  return Ok(used_graphics_states.is_empty());
              }
              let mut declared_names = BTreeSet::new();
              for resources in resources {
                  for key in [b"Pattern".as_slice(), b"Shading".as_slice()] {
                      if let Ok(resource_object) = resources.get(key) {
                          let resource_dictionary = resolved_dictionary(document, resource_object)?;
                          if resource_dictionary.iter().next().is_some() {
                              return Ok(false);
                          }
                      }
                  }
                  let Ok(ext_gstate_object) = resources.get(b"ExtGState") else {
                      continue;
                  };
                  let ext_gstates = resolved_dictionary(document, ext_gstate_object)?;
                  for (name, state_object) in ext_gstates.iter() {
                      let name = String::from_utf8_lossy(name).into_owned();
                      declared_names.insert(name);
                      let state = resolved_dictionary(document, state_object)?;
                      if !opaque_graphics_state(state) {
                          return Ok(false);
                      }
                  }
              }
              if !used_graphics_states.is_subset(&declared_names) {
                  return Ok(false);
              }
              for object in document.objects.values() {
                  let Some(dictionary) = object_dictionary(object) else {
                      continue;
                  };
                  if let Ok(group_object) = dictionary.get(b"Group") {
                      let group = resolved_dictionary(document, group_object)?;
                      if !safe_transparency_group(group, allowed_color_spaces) {
                          return Ok(false);
                      }
                  }
              }
              Ok(true)
          }
          '''
          text = text[:start] + replacement + text[end:]
          pdf_path.write_text(text, encoding='utf-8')

          test_path = Path('crates/print-ready-poster-preflight-certified-path-runtime/tests/path.rs')
          tests = test_path.read_text(encoding='utf-8')
          old = (
              '        b"0.1 0.2 0.3 rg 0 0 100 100 re f".to_vec(),\n'
              '    ));\n'
              '    let resources_id = document.add_object(dictionary! {});\n'
          )
          new = (
              '        b"0.1 0.2 0.3 rg /a0 gs 0 0 100 100 re f".to_vec(),\n'
              '    ));\n'
              '    let resources_id = document.add_object(dictionary! {\n'
              '        "ExtGState" => dictionary! {\n'
              '            "a0" => dictionary! {\n'
              '                "CA" => 1,\n'
              '                "ca" => 1,\n'
              '            },\n'
              '        },\n'
              '    });\n'
          )
          if old in tests:
              tests = tests.replace(old, new, 1)
          elif new not in tests:
              raise SystemExit('minimal PDF resource fixture did not match')

          old = (
              '            "Resources" => resources_id,\n'
              '            "MediaBox" => vec![0.into(), 0.into(), 612.into(), 792.into()],\n'
          )
          new = (
              '            "Resources" => resources_id,\n'
              '            "Group" => dictionary! {\n'
              '                "Type" => "Group",\n'
              '                "S" => "Transparency",\n'
              '                "I" => true,\n'
              '                "CS" => "DeviceRGB",\n'
              '            },\n'
              '            "MediaBox" => vec![0.into(), 0.into(), 612.into(), 792.into()],\n'
          )
          if old in tests:
              tests = tests.replace(old, new, 1)
          elif new not in tests:
              raise SystemExit('minimal PDF page fixture did not match')
          test_path.write_text(tests, encoding='utf-8')
          PY

          cargo fmt --all
          git config user.name "ergaxiom-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/print-ready-poster-preflight-certified-path-runtime/src/pdf.rs \
            crates/print-ready-poster-preflight-certified-path-runtime/tests/path.rs
          git diff --cached --check
          git commit -m "Resolve indirect PDF resource dictionaries"
          git push origin HEAD:agent/print-ready-poster-preflight-certified-path-v1
