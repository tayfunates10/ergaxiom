name: Temporary PNG Rust 1.85 repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-png-rust185-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rust-1-85-png-validator-let-chains

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Apply Rust 1.85 compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("crates/png-artifact-validator-runtime/src/lib.rs")
          source = source_path.read_text()

          old_bit_depth = "\n".join([
              "    if let Some(expected) = policy.expected_bit_depth",
              "        && report.bit_depth != expected",
              "    {",
              "        violations.push(PngPolicyViolation::BitDepthMismatch {",
              "            expected,",
              "            actual: report.bit_depth,",
              "        });",
              "    }",
              "",
          ])
          new_bit_depth = "\n".join([
              "    match policy.expected_bit_depth {",
              "        Some(expected) if report.bit_depth != expected => {",
              "            violations.push(PngPolicyViolation::BitDepthMismatch {",
              "                expected,",
              "                actual: report.bit_depth,",
              "            });",
              "        }",
              "        _ => {}",
              "    }",
              "",
          ])
          if old_bit_depth not in source:
              raise SystemExit("expected bit-depth let-chain not found")
          source = source.replace(old_bit_depth, new_bit_depth, 1)

          old_icc = "\n".join([
              "    if let PngProfileRequirement::IccProfile { profile_name } = &policy.profile_requirement",
              "        && profile_name.trim().is_empty()",
              "    {",
              "        return Err(PngArtifactError::EmptyIccProfileName);",
              "    }",
              "",
          ])
          new_icc = "\n".join([
              "    match &policy.profile_requirement {",
              "        PngProfileRequirement::IccProfile { profile_name } if profile_name.trim().is_empty() => {",
              "            return Err(PngArtifactError::EmptyIccProfileName);",
              "        }",
              "        _ => {}",
              "    }",
              "",
          ])
          if old_icc not in source:
              raise SystemExit("expected ICC let-chain not found")
          source = source.replace(old_icc, new_icc, 1)
          source_path.write_text(source)
          PY

      - name: Format workspace
        run: cargo +1.85.0 fmt --all

      - name: Verify formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Strict PNG validator Clippy
        run: cargo +1.85.0 clippy --locked -p ergaxiom-png-artifact-validator-runtime --all-targets -- -D warnings

      - name: PNG validator tests
        run: cargo +1.85.0 test --locked -p ergaxiom-png-artifact-validator-runtime

      - name: Commit validated Rust source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/png-artifact-validator-runtime/src/lib.rs
          git diff --cached --check
          git commit -m "fix: keep PNG validator compatible with Rust 1.85"
          git push origin HEAD:fix/rust-1-85-png-validator-let-chains
