name: Retry Tauri live signer proof

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/architecture/50-tauri-live-signer-proof.md"
      - ".github/workflows/retry-tauri-live-service-proof.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tauri-live-service-proof-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Apply live proof source transformation
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/sync-tauri-live-service-proof.yml').read_text()
          start_marker = '      - name: Wire live proof startup boundary\n        shell: python\n        run: |\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index('\n      - name: Refresh desktop lockfile', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'wire-live-proof', 'exec'), {})

          api = Path('apps/desktop/src/api.ts')
          api_text = api.read_text()
          if 'live_service_identity_verified: false' not in api_text:
              pattern = r'(\s+pipe_clients_initialized: false,\n)(\s+production_issuance_enabled: false,)'
              replacement = (
                  r'\1'
                  '      live_service_identity_verified: false,\n'
                  '      service_restart_detected: false,\n'
                  '      recovery_required: false,\n'
                  '      last_identity_proof_epoch_s: null,\n'
                  r'\2'
              )
              api_text, count = re.subn(pattern, replacement, api_text, count=1)
              if count != 1:
                  raise SystemExit('production status fallback marker missing')
              api.write_text(api_text)

      - name: Refresh desktop lockfile
        shell: pwsh
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Validate frontend boundary
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows Tauri live proof boundary
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets production_startup::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated live proof boundary
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/production_startup.rs apps/desktop/src-tauri/src/lib.rs apps/desktop/src/api.ts apps/desktop/src/types.ts docs/architecture/50-tauri-live-signer-proof.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Authenticate live production signer during Tauri startup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/tauri-live-service-proof-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
