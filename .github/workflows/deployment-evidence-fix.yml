name: Apply deployment evidence diagnostics

on:
  push:
    branches:
      - agent/tpm-cng-signer-service-v1

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/windows-production-installation-evidence-runtime/src/lib.rs")
          text = path.read_text()
          old = '''use ergaxiom_windows_production_signer_host_runtime::{
    LoadedProductionSignerHostConfig, PRODUCTION_SIGNER_ERROR_CONTROL,
    PRODUCTION_SIGNER_MAX_CONFIG_BYTES, PRODUCTION_SIGNER_PRESHUTDOWN_TIMEOUT_MS,
    PRODUCTION_SIGNER_REQUIRED_PRIVILEGE, PRODUCTION_SIGNER_RESTART_DELAYS_MS,
    PRODUCTION_SIGNER_SERVICE_ACCOUNT, PRODUCTION_SIGNER_SERVICE_NAME,
    PRODUCTION_SIGNER_SERVICE_SID_TYPE, PRODUCTION_SIGNER_SERVICE_TYPE,
    PRODUCTION_SIGNER_START_MODE, ProductionSignerHostError, ProductionSignerHostResponse,
    ProductionSignerServiceManifest,
};
'''
          new = '''use ergaxiom_windows_production_signer_host_runtime::{
    PRODUCTION_SIGNER_ERROR_CONTROL, PRODUCTION_SIGNER_MAX_CONFIG_BYTES,
    PRODUCTION_SIGNER_PRESHUTDOWN_TIMEOUT_MS, PRODUCTION_SIGNER_REQUIRED_PRIVILEGE,
    PRODUCTION_SIGNER_RESTART_DELAYS_MS, PRODUCTION_SIGNER_SERVICE_ACCOUNT,
    PRODUCTION_SIGNER_SERVICE_NAME, PRODUCTION_SIGNER_SERVICE_SID_TYPE,
    PRODUCTION_SIGNER_SERVICE_TYPE, PRODUCTION_SIGNER_START_MODE, ProductionSignerHostError,
    ProductionSignerServiceManifest,
};
#[cfg(windows)]
use ergaxiom_windows_production_signer_host_runtime::{
    LoadedProductionSignerHostConfig, ProductionSignerHostResponse,
};
'''
          if old not in text:
              raise SystemExit("installation import marker missing")
          path.write_text(text.replace(old, new, 1))

          path = Path("crates/windows-production-deployment-evidence-runtime/src/lib.rs")
          text = path.read_text()
          text = text.replace(
              '        self.receipt.validate_seal()?;\n        policy.validate_cryptographic_separation(trust_governance_policy, accepted)?;\n',
              '        self.receipt.verify_against_accepted(accepted)?;\n        policy.validate_cryptographic_separation(trust_governance_policy, accepted)?;\n',
              1,
          )
          marker = 'impl SignedProductionSignerRecoveryEvidence {'
          before, after = text.split(marker, 1)
          after = after.replace(
              '        self.receipt.validate_seal()?;\n        policy.validate_cryptographic_separation(trust_governance_policy, accepted)?;\n',
              '        self.receipt.verify_against_accepted(accepted)?;\n        policy.validate_cryptographic_separation(trust_governance_policy, accepted)?;\n',
              1,
          )
          text = before + marker + after
          old = '''fn decode_fixed<const N: usize>(value: &str) -> Result<[u8; N], base64::DecodeError> {
    let bytes = URL_SAFE_NO_PAD.decode(value)?;
    bytes
        .try_into()
        .map_err(|_| base64::DecodeError::InvalidLength(bytes.len()))
}
'''
          new = '''fn decode_fixed<const N: usize>(value: &str) -> Result<[u8; N], base64::DecodeError> {
    let bytes = URL_SAFE_NO_PAD.decode(value)?;
    let length = bytes.len();
    bytes
        .try_into()
        .map_err(|_| base64::DecodeError::InvalidLength(length))
}
'''
          if old not in text:
              raise SystemExit("deployment decode marker missing")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit exact fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-installation-evidence-runtime crates/windows-production-deployment-evidence-runtime
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix portable deployment evidence diagnostics"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi
