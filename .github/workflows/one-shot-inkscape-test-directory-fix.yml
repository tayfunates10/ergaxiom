name: One-shot Inkscape test-directory fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-inkscape-test-directory-fix.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-inkscape-test-directory-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      BRANCH_NAME: agent/key-governance-release-evidence-v1
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add collision-proof test directories and commit atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/graphic-inkscape-certified-delivery-runtime/tests/certified_inkscape_delivery.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "use std::path::{Path, PathBuf};\nuse std::time::{SystemTime, UNIX_EPOCH};",
              "use std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::time::{SystemTime, UNIX_EPOCH};",
              1,
          )
          text = text.replace(
              "const NOW: u64 = 20_000;\n\nstruct Context",
              "const NOW: u64 = 20_000;\nstatic NEXT_TEST_DIRECTORY_ID: AtomicU64 = AtomicU64::new(1);\n\nstruct Context",
              1,
          )
          text = text.replace(
              "        let nonce = SystemTime::now().duration_since(UNIX_EPOCH)?.as_nanos();\n        let path = std::env::temp_dir().join(format!(\n            \"ergaxiom-certified-inkscape-{name}-{}-{nonce}\",\n            std::process::id()\n        ));",
              "        let nonce = SystemTime::now().duration_since(UNIX_EPOCH)?.as_nanos();\n        let unique_id = NEXT_TEST_DIRECTORY_ID.fetch_add(1, Ordering::Relaxed);\n        let path = std::env::temp_dir().join(format!(\n            \"ergaxiom-certified-inkscape-{name}-{}-{unique_id}-{nonce}\",\n            std::process::id()\n        ));",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          for attempt in $(seq 1 20); do
            cargo test -p ergaxiom-graphic-inkscape-certified-delivery-runtime --test certified_inkscape_delivery
          done
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH_NAME"]
          expected_head = os.environ["EXPECTED_HEAD"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}"

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ergaxiom-test-directory-finalizer",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  raise SystemExit(error.read().decode("utf-8", errors="replace")) from error
              return json.loads(body) if body else {}

          ref = request("GET", f"/git/ref/heads/{branch}")
          actual_head = ref["object"]["sha"]
          if actual_head != expected_head:
              raise SystemExit(
                  f"branch moved during flake fix: expected {expected_head}, actual {actual_head}"
              )
          commit = request("GET", f"/git/commits/{actual_head}")
          file_name = "crates/graphic-inkscape-certified-delivery-runtime/tests/certified_inkscape_delivery.rs"
          encoded = base64.b64encode(Path(file_name).read_bytes()).decode("ascii")
          blob = request("POST", "/git/blobs", {"content": encoded, "encoding": "base64"})
          tree = request(
              "POST",
              "/git/trees",
              {
                  "base_tree": commit["tree"]["sha"],
                  "tree": [
                      {"path": file_name, "mode": "100644", "type": "blob", "sha": blob["sha"]},
                      {
                          "path": ".github/workflows/one-shot-inkscape-test-directory-fix.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": None,
                      },
                  ],
              },
          )
          new_commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Make Inkscape test directories collision-proof",
                  "tree": tree["sha"],
                  "parents": [actual_head],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{branch}",
              {"sha": new_commit["sha"], "force": False},
          )
          print(new_commit["sha"])
          PY
