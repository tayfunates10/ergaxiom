name: One-shot capability lock refresh

on:
  push:
    branches:
      - agent/purpose-locked-capability-issuance-v1
    paths:
      - ".github/workflows/one-shot-capability-lock-refresh.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-capability-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out capability issuance branch
        uses: actions/checkout@v4
        with:
          ref: agent/purpose-locked-capability-issuance-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Refresh lockfile and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-capability-lock-refresh.yml
          git add Cargo.lock crates/governed-verification-runtime
          git commit -m "Refresh signer-bound capability lockfile"
          git push origin HEAD:agent/purpose-locked-capability-issuance-v1
