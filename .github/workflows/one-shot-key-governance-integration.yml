          key_runtime.write_text(text.replace(marker, method + marker, 1), encoding="utf-8")

          capability = Path("crates/capability-runtime/src/authorizer.rs")
          text = capability.read_text(encoding="utf-8")
          text = text.replace(
              "use ed25519_dalek::{Signature, VerifyingKey};",
              "use ed25519_dalek::Signature;",
