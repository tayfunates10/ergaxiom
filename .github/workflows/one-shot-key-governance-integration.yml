name: One-shot key governance integration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-key-governance-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/key-governance-release-evidence-v1
          fetch-depth: 0

      - name: Integrate governed registries into capability and attestation verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "Cargo.toml",
              '  "crates/intent-contract-compiler-runtime",\n',
              '  "crates/intent-contract-compiler-runtime",\n  "crates/key-governance-runtime",\n',
          )
          replace_once(
              "crates/capability-runtime/Cargo.toml",
              'ergaxiom-contract-runtime = { path = "../contract-runtime" }\n',
              'ergaxiom-contract-runtime = { path = "../contract-runtime" }\nergaxiom-key-governance-runtime = { path = "../key-governance-runtime" }\n',
          )
          replace_once(
              "crates/attestation-runtime/Cargo.toml",
              'ergaxiom-evidence-runtime = { path = "../evidence-runtime" }\n',
              'ergaxiom-evidence-runtime = { path = "../evidence-runtime" }\nergaxiom-key-governance-runtime = { path = "../key-governance-runtime" }\n',
          )

          key_runtime = Path("crates/key-governance-runtime/src/lib.rs")
          text = key_runtime.read_text(encoding="utf-8")
          text = text.replace(
              "use ed25519_dalek::VerifyingKey;",
              "use ed25519_dalek::{Signature, VerifyingKey};",
              1,
          )
          text = text.replace(
              '    #[error("governed key has been revoked")]\n    KeyRevoked,\n',
              '    #[error("governed key has been revoked")]\n    KeyRevoked,\n    #[error("governed Ed25519 signature verification failed")]\n    SignatureVerificationFailed,\n',
              1,
          )
          marker = "    fn insert_ed25519_internal(\n"
          method = '''    pub fn verify_ed25519_signature(
        &self,
        role: IssuerRole,
        issuer_id: &str,
        key_id: &str,
        signed_at_epoch_s: u64,
        message: &[u8],
        signature: &Signature,
    ) -> Result<(), KeyGovernanceError> {
        let key = self.resolve_ed25519(role, issuer_id, key_id, signed_at_epoch_s)?;
        key.verify_strict(message, signature)
            .map_err(|_| KeyGovernanceError::SignatureVerificationFailed)
    }

'''
          if text.count(marker) != 1:
