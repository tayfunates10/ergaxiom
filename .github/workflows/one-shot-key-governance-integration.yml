          use std::error::Error;

          use ed25519_dalek::{Signer, SigningKey};
          use ergaxiom_capability_runtime::{CapabilityError, TrustedKeyRegistry};
          use ergaxiom_key_governance_runtime::KeyGovernanceError;

          #[test]
          fn revoked_capability_key_cannot_verify_signatures() -> Result<(), Box<dyn Error>> {
              let signing_key = SigningKey::from_bytes(&[31_u8; 32]);
              let message = b"capability-governance-attack-fixture";
              let signature = signing_key.sign(message);
              let mut registry = TrustedKeyRegistry::default();
              registry.insert_ed25519(
                  "capability.local",
                  "capability.v1",
                  signing_key.verifying_key().to_bytes(),
              )?;
              registry.verify_ed25519_signature(
                  "capability.local",
                  "capability.v1",
                  100,
                  message,
                  &signature,
              )?;
              registry.revoke_ed25519(
                  "capability.local",
                  "capability.v1",
                  101,
                  &"c".repeat(64),
              )?;
              assert!(matches!(
                  registry.verify_ed25519_signature(
                      "capability.local",
                      "capability.v1",
                      100,
                      message,
                      &signature,
                  ),
                  Err(CapabilityError::KeyGovernance(
                      KeyGovernanceError::KeyRevoked
                  ))
              ));
              Ok(())
          }
