pub struct TrustedKeyRegistry {
    governance: GovernedKeyRegistry,
}

impl TrustedKeyRegistry {
    #[must_use]
    pub const fn from_governed(governance: GovernedKeyRegistry) -> Self {
        Self { governance }
    }

    pub fn insert_ed25519(
        &mut self,
        issuer_id: impl Into<String>,
        key_id: impl Into<String>,
        public_key: [u8; 32],
    ) -> Result<(), CapabilityError> {
        self.governance
            .insert_ed25519(
                IssuerRole::Capability,
                issuer_id,
                key_id,
                public_key,
                0,
                u64::MAX,
            )
            .map(|_| ())
            .map_err(map_capability_key_error)
    }

    #[allow(clippy::too_many_arguments)]
    pub fn rotate_ed25519_guarded(
        &mut self,
        expected_revision: u64,
        expected_registry_digest: &str,
        issuer_id: &str,
        current_key_id: &str,
        new_key_id: &str,
        new_public_key: [u8; 32],
        activation_at_epoch_s: u64,
        current_retirement_at_epoch_s: u64,
        new_not_after_epoch_s: u64,
    ) -> Result<KeyMutationReceipt, CapabilityError> {
        self.governance
            .rotate_ed25519_guarded(
                expected_revision,
                expected_registry_digest,
                IssuerRole::Capability,
                issuer_id,
                current_key_id,
                new_key_id,
                new_public_key,
                activation_at_epoch_s,
                current_retirement_at_epoch_s,
                new_not_after_epoch_s,
            )
            .map_err(map_capability_key_error)
    }

    pub fn revoke_ed25519(
        &mut self,
        issuer_id: &str,
        key_id: &str,
        revoked_at_epoch_s: u64,
        revocation_reason_digest: &str,
    ) -> Result<KeyMutationReceipt, CapabilityError> {
        let revision = self.governance.revision();
        let digest = self.governance.registry_digest()?;
        self.governance
            .revoke_ed25519_guarded(
                revision,
                &digest,
                IssuerRole::Capability,
                issuer_id,
                key_id,
                revoked_at_epoch_s,
                revocation_reason_digest,
            )
            .map_err(map_capability_key_error)
    }

    pub fn registry_digest(&self) -> Result<String, CapabilityError> {
        Ok(self.governance.registry_digest()?)
    }

    pub fn verify_ed25519_signature(
        &self,
        issuer_id: &str,
        key_id: &str,
        signed_at_epoch_s: u64,
        message: &[u8],
        signature: &Signature,
    ) -> Result<(), CapabilityError> {
        self.governance
            .verify_ed25519_signature(
                IssuerRole::Capability,
                issuer_id,
                key_id,
                signed_at_epoch_s,
                message,
                signature,
            )
            .map_err(map_capability_key_error)
    }
}

fn map_capability_key_error(error: KeyGovernanceError) -> CapabilityError {
    match error {
        KeyGovernanceError::InvalidPublicKey => CapabilityError::InvalidTrustedKey,
        KeyGovernanceError::UnknownKey {
            issuer_id, key_id, ..
        }
        | KeyGovernanceError::RoleMismatch {
            issuer_id, key_id, ..
        } => CapabilityError::UnknownTrustedKey { issuer_id, key_id },
        other => CapabilityError::KeyGovernance(other),
    }
}
