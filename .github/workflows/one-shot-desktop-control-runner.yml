name: One-shot desktop control implementation runner

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-desktop-control-runner.yml"

permissions:
  contents: write

jobs:
  run-embedded-implementation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-digest-bound-control-v1
          fetch-depth: 0

      - name: Extract and execute complete embedded implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-shot-desktop-control-backend.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:]]
          if not body:
              raise SystemExit('embedded implementation body not found')
          Path('/tmp/desktop-control-implementation.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/desktop-control-implementation.sh
