name: Backend production issuance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/backend-issuance-runtime/**"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-production-governed-issuance-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/45-desktop-production-issuance-orchestration.md"
      - ".github/workflows/backend-production-issuance.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/backend-issuance-runtime/**"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-production-governed-issuance-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/45-desktop-production-issuance-orchestration.md"
      - ".github/workflows/backend-production-issuance.yml"

permissions:
  contents: read

jobs:
  governed-backend-issuance:
    name: Verify governed backend issuance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint governed backend issuance
        run: >-
          cargo clippy
          -p ergaxiom-backend-issuance-runtime
          --all-targets
          --all-features
          --
          -D warnings

      - name: Run governed backend issuance attacks
        shell: bash
        run: |
          set +e
          cargo test \
            -p ergaxiom-backend-issuance-runtime \
            --all-features -- --nocapture 2>&1 | tee backend-production-issuance-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload backend issuance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-issuance-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: backend-production-issuance-tests.log
