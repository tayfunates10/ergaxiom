name: Issue 75 Final Source Repair

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply source repair
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "issue75: run final source repair" ]; then
            echo "No repair requested."
            exit 0
          fi
          echo '' | base64 -d > /tmp/issue75_patch.py
          python /tmp/issue75_patch.py
          cargo +1.85.0 fmt --all
          cargo +1.85.0 check -p ergaxiom-production-execution-runtime --all-targets
          cargo +1.85.0 check -p ergaxiom-production-execution-authority-runtime --all-targets
          cargo +1.85.0 check -p ergaxiom-graphic-production-evidence-runtime --all-targets
          rm .github/workflows/issue75-final-source-repair.yml
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "issue75: close receipt and rollback recovery bindings"
          git push origin HEAD:codex/issue-75
