name: Issue 75 Source Repair

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'issue75-run-source-repair-v5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Apply deterministic source repairs
        run: python .github/scripts/issue75_source_repair.py
      - name: Format
        run: cargo +1.85.0 fmt --all
      - name: Clippy production execution store
        run: cargo +1.85.0 clippy -p ergaxiom-production-execution-runtime --all-targets -- -D warnings
      - name: Clippy persistent production authority
        run: cargo +1.85.0 clippy -p ergaxiom-production-execution-authority-runtime --all-targets -- -D warnings
      - name: Clippy production evidence
        run: cargo +1.85.0 clippy -p ergaxiom-graphic-production-evidence-runtime --all-targets -- -D warnings
      - name: Runtime tests
        run: cargo +1.85.0 test -p ergaxiom-production-execution-runtime
      - name: Authority tests
        run: cargo +1.85.0 test -p ergaxiom-production-execution-authority-runtime
      - name: Production evidence tests
        run: cargo +1.85.0 test -p ergaxiom-graphic-production-evidence-runtime
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/issue75_source_repair.py
          rm .github/workflows/issue75-final-source-repair.yml
          git config user.name Tayfun
          git config user.email tayfuna766@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'issue75: fix strict production verification gates'
          git push origin HEAD:codex/issue-75
