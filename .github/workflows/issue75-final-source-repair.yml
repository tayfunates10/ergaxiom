name: Issue 75 Source Repair

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'issue75-run-source-repair-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Repair Issue 75 source and strict clippy blocker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('crates/production-execution-runtime/src/lib.rs')
          text = runtime.read_text()
          old = "    #[error(transparent)]\n    Lease(#[from] ProductionSignerIdentityProofError),\n"
          new = old + "    #[error(transparent)]\n    DesktopShell(#[from] DesktopShellError),\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('production verification error anchor missing')
              runtime.write_text(text.replace(old, new, 1))

          governance = Path('crates/key-governance-runtime/src/lib.rs')
          text = governance.read_text()
          old = '''                public_key_hex: record
                    .verifying_key
                    .to_bytes()
                    .iter()
                    .map(|byte| format!("{byte:02x}"))
                    .collect(),
'''
          new = '''                public_key_hex: record.verifying_key.to_bytes().iter().fold(
                    String::with_capacity(64),
                    |mut output, byte| {
                        use std::fmt::Write as _;
                        write!(&mut output, "{byte:02x}")
                            .expect("writing hexadecimal bytes to String cannot fail");
                        output
                    },
                ),
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('key governance hex formatting anchor missing')
              governance.write_text(text.replace(old, new, 1))
          PY
          cargo +1.85.0 fmt --all
          cargo +1.85.0 clippy -p ergaxiom-production-execution-runtime --all-targets -- -D warnings
          cargo +1.85.0 clippy -p ergaxiom-production-execution-authority-runtime --all-targets -- -D warnings
          cargo +1.85.0 clippy -p ergaxiom-graphic-production-evidence-runtime --all-targets -- -D warnings
          cargo +1.85.0 test -p ergaxiom-production-execution-runtime
          cargo +1.85.0 test -p ergaxiom-production-execution-authority-runtime
          cargo +1.85.0 test -p ergaxiom-graphic-production-evidence-runtime
          rm .github/workflows/issue75-final-source-repair.yml
          git config user.name Tayfun
          git config user.email tayfuna766@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'issue75: fix strict production verification gates'
          git push origin HEAD:codex/issue-75
