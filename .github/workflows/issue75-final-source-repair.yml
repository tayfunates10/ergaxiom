name: Issue 75 Source Repair

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'issue75-run-source-repair-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Repair verification error conversion
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('crates/production-execution-runtime/src/lib.rs'); s=p.read_text(); old='    #[error(transparent)]\\n    Lease(#[from] ProductionSignerIdentityProofError),\\n'; new=old+'    #[error(transparent)]\\n    DesktopShell(#[from] DesktopShellError),\\n'; assert new in s or old in s; p.write_text(s if new in s else s.replace(old,new,1))"
          cargo +1.85.0 fmt --all
          cargo +1.85.0 clippy -p ergaxiom-production-execution-runtime --all-targets -- -D warnings
          cargo +1.85.0 clippy -p ergaxiom-production-execution-authority-runtime --all-targets -- -D warnings
          cargo +1.85.0 clippy -p ergaxiom-graphic-production-evidence-runtime --all-targets -- -D warnings
          cargo +1.85.0 test -p ergaxiom-production-execution-runtime
          cargo +1.85.0 test -p ergaxiom-production-execution-authority-runtime
          cargo +1.85.0 test -p ergaxiom-graphic-production-evidence-runtime
          rm .github/workflows/issue75-final-source-repair.yml
          git config user.name Tayfun
          git config user.email tayfuna766@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'issue75: fix production verification conversion'
          git push origin HEAD:codex/issue-75
