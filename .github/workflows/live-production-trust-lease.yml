name: Live production trust lease

on:
  pull_request:
    paths:
      - "crates/windows-production-trust-state-runtime/**"
      - "docs/architecture/51-live-production-trust-lease.md"
      - ".github/workflows/live-production-trust-lease.yml"
  push:
    branches:
      - main
    paths:
      - "crates/windows-production-trust-state-runtime/**"
      - "docs/architecture/51-live-production-trust-lease.md"
      - ".github/workflows/live-production-trust-lease.yml"

permissions:
  contents: read

jobs:
  trust-lease:
    name: Verify live production trust lease (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint trust lease
        run: cargo clippy -p ergaxiom-windows-production-trust-state-runtime --all-targets --all-features -- -D warnings

      - name: Run trust lease attacks
        run: cargo test -p ergaxiom-windows-production-trust-state-runtime --test deployed_service -- --nocapture
