name: Windows release evidence
on:
  pull_request:
    paths: ["apps/desktop/**", "apps/windows-production-signer-service/**", "Cargo.lock", "crates/**", "tools/release/**", "tools/windows/**", "docs/windows-signed-release.md", ".github/workflows/windows-signed-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Reject source identity substitution
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Release evidence attack tests
        run: python -m unittest tools.release.test_generate_release_evidence tools.release.test_finalize_windows_release_evidence tools.release.test_windows_release_attack_matrix tools.windows.test_controlled_trust_gate
      - name: Compile canonical production-chain verifier
        run: cargo check --locked -p ergaxiom-production-execution-runtime --bin verify_production_release_chain
      - name: Validate release JSON and locked dependency graph
        run: |
          python -m json.tool tools/release/windows_release_policy.json >/dev/null
          python -m json.tool apps/desktop/src-tauri/tauri.release.conf.json >/dev/null
          python -m json.tool apps/desktop/src-tauri/tauri.ci-installer.conf.json >/dev/null
          python -m json.tool apps/desktop/src-tauri/tauri.ci-previous-installer.conf.json >/dev/null
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Frontend regression
        working-directory: apps/desktop
        run: npm ci && npm test && npm run build
      - name: Rust format
        run: cargo fmt --all -- --check

  unsigned-candidate-is-blocked:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject source identity substitution
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual-ne$env:SOURCE_COMMIT){throw "Checked out $actual but expected $env:SOURCE_COMMIT"}
      - name: Parse PowerShell release runners and prove missing certificate fails closed
        shell: pwsh
        run: |
          foreach($script in Get-ChildItem tools/release -Filter '*.ps1') {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw "PowerShell parse failure in $($script.Name): $($errors[0].Message)"}
          }
          $dummy=Join-Path $env:RUNNER_TEMP 'unsigned-dummy.exe';Set-Content $dummy 'not-a-real-pe' -NoNewline
          try {
            ./tools/release/sign_windows_release.ps1 -PolicyPath tools/release/windows_release_policy.json -Artifact @($dummy)
            throw 'Unresolved certificate policy unexpectedly reached signing'
          } catch {
            if($_.Exception.Message -notmatch 'SIGNING_IDENTITY_POLICY_UNRESOLVED'){throw}
          }
      - name: Build exact PE inputs and NSIS installer
        shell: pwsh
        run: |
          npm --prefix apps/desktop ci
          if($LASTEXITCODE-ne0){throw 'NPM_CI_FAILED'}
          npm --prefix apps/desktop run tauri -- build --no-bundle
          if($LASTEXITCODE-ne0){throw 'DESKTOP_BUILD_FAILED'}
          cargo build --release --locked -p ergaxiom-windows-production-signer-service
          if($LASTEXITCODE-ne0){throw 'SIGNER_SERVICE_BUILD_FAILED'}
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/release-resources | Out-Null
          Copy-Item target/release/ergaxiom-windows-production-signer-service.exe apps/desktop/src-tauri/release-resources/ergaxiom-windows-production-signer-service.exe
          npm --prefix apps/desktop run tauri -- bundle --config src-tauri/tauri.ci-installer.conf.json
          if($LASTEXITCODE-ne0){throw 'NSIS_BUNDLE_FAILED'}
      - name: Produce unsigned Authenticode evidence and final fail-closed decision
        shell: pwsh
        run: |
          $installer=@(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if($installer.Count-ne1){throw 'Expected exactly one NSIS installer'}
          $candidate=Join-Path $env:RUNNER_TEMP 'unsigned-candidate'
          New-Item -ItemType Directory -Force $candidate | Out-Null
          $desktopCopy=Join-Path $candidate 'ergaxiom-desktop.exe'
          $serviceCopy=Join-Path $candidate 'ergaxiom-windows-production-signer-service.exe'
          $installerCopy=Join-Path $candidate $installer[0].Name
          [IO.File]::Copy((Resolve-Path 'apps/desktop/src-tauri/target/release/ergaxiom-desktop.exe').Path,$desktopCopy,$false)
          [IO.File]::Copy((Resolve-Path 'apps/desktop/src-tauri/release-resources/ergaxiom-windows-production-signer-service.exe').Path,$serviceCopy,$false)
          [IO.File]::Copy($installer[0].FullName,$installerCopy,$false)
          $rustc=(rustc --version).Trim();$node=(node --version).Trim();$npm=(npm --version).Trim()
          python tools/release/generate_release_evidence.py --repo-root . --artifact $desktopCopy --artifact $serviceCopy --artifact $installerCopy --source-commit $env:SOURCE_COMMIT --rustc-version $rustc --node-version $node --npm-version $npm --output-dir $env:RUNNER_TEMP/base
          if($LASTEXITCODE-ne0){throw 'UNSIGNED_BASE_EVIDENCE_FAILED'}
          ./tools/release/verify_windows_signatures.ps1 -Mode test -PolicyPath tools/release/windows_release_policy.json -Artifact @($desktopCopy,$serviceCopy,$installerCopy) -EvidenceOut $env:RUNNER_TEMP/signatures.json
          if($LASTEXITCODE-ne0){throw 'UNSIGNED_SIGNATURE_EVIDENCE_FAILED'}
          python tools/release/finalize_windows_release_evidence.py --base-manifest $env:RUNNER_TEMP/base/ergaxiom-release-manifest.json --policy tools/release/windows_release_policy.json --signature-evidence $env:RUNNER_TEMP/signatures.json --output $env:RUNNER_TEMP/final.json
          if($LASTEXITCODE-ne0){throw 'UNSIGNED_FINALIZER_FAILED'}
          $f=Get-Content $env:RUNNER_TEMP/final.json -Raw|ConvertFrom-Json
          if($f.release_eligible-ne$false){throw 'Unsigned/test candidate became production eligible'}
          foreach($b in @('SIGNING_IDENTITY_POLICY_UNRESOLVED','AUTHENTICODE_NOT_VERIFIED','INSTALLER_LIFECYCLE_NOT_VERIFIED','PRODUCTION_CHAIN_EVIDENCE_NOT_VERIFIED','HARDWARE_OPERATIONAL_EVIDENCE_NOT_VERIFIED','DISTRIBUTION_LICENSE_NOT_APPROVED')){if($b-notin$f.blocking_reasons){throw "Missing blocker $b"}}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence-NOT-PRODUCTION
          path: |
            ${{ runner.temp }}/base/**
            ${{ runner.temp }}/signatures.json
            ${{ runner.temp }}/final.json
          retention-days: 14

  installer-lifecycle-test:
    name: NSIS install upgrade downgrade interruption recovery uninstall
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject source identity substitution
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual-ne$env:SOURCE_COMMIT){throw "Checked out $actual but expected $env:SOURCE_COMMIT"}
      - name: Build desktop and production signer-service inputs
        shell: pwsh
        run: |
          npm --prefix apps/desktop ci
          if($LASTEXITCODE-ne0){throw 'NPM_CI_FAILED'}
          npm --prefix apps/desktop run tauri -- build --no-bundle
          if($LASTEXITCODE-ne0){throw 'DESKTOP_BUILD_FAILED'}
          cargo build --release --locked -p ergaxiom-windows-production-signer-service
          if($LASTEXITCODE-ne0){throw 'SIGNER_SERVICE_BUILD_FAILED'}
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/release-resources | Out-Null
          Copy-Item target/release/ergaxiom-windows-production-signer-service.exe apps/desktop/src-tauri/release-resources/ergaxiom-windows-production-signer-service.exe
      - name: Bundle previous and current test-only NSIS installers
        shell: pwsh
        run: |
          npm --prefix apps/desktop run tauri -- bundle --config src-tauri/tauri.ci-previous-installer.conf.json
          if($LASTEXITCODE-ne0){throw 'PREVIOUS_NSIS_BUNDLE_FAILED'}
          $previous=@(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*0.0.9*-setup.exe')
          if($previous.Count-ne1){throw "Expected exactly one 0.0.9 installer, got $($previous.Count)"}
          Copy-Item $previous[0].FullName "$env:RUNNER_TEMP\previous-setup.exe"
          npm --prefix apps/desktop run tauri -- bundle --config src-tauri/tauri.ci-installer.conf.json
          if($LASTEXITCODE-ne0){throw 'CURRENT_NSIS_BUNDLE_FAILED'}
          $current=@(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*0.1.0*-setup.exe')
          if($current.Count-ne1){throw "Expected exactly one 0.1.0 installer, got $($current.Count)"}
          Copy-Item $current[0].FullName "$env:RUNNER_TEMP\current-setup.exe"
      - name: Execute lifecycle and attack matrix on the real installers
        shell: pwsh
        run: |
          ./tools/release/test_windows_installer_lifecycle.ps1 -PolicyPath tools/release/windows_release_policy.json -PreviousInstaller "$env:RUNNER_TEMP\previous-setup.exe" -CurrentInstaller "$env:RUNNER_TEMP\current-setup.exe" -SourceCommit "$env:SOURCE_COMMIT" -EvidenceOut "$env:RUNNER_TEMP\installer-lifecycle-test.json"
          $e=Get-Content "$env:RUNNER_TEMP\installer-lifecycle-test.json" -Raw|ConvertFrom-Json
          if($e.test_mode-ne$true){throw 'Hosted lifecycle evidence must remain test-only'}
          foreach($phase in @('clean_install','upgrade','downgrade_rejected','interrupted_upgrade_preserved_state','recovery_install','uninstall','production_state_preserved')){if($e.phases.$phase-ne$true){throw "Lifecycle phase failed: $phase"}}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-lifecycle-TEST-ONLY
          path: ${{ runner.temp }}/installer-lifecycle-test.json
          if-no-files-found: error
          retention-days: 14

  production-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Real certificate and license must be owner-pinned
        shell: pwsh
        run: |
          $p=Get-Content tools/release/windows_release_policy.json -Raw|ConvertFrom-Json
          if($p.signing.identity_status-ne'OWNER_APPROVED_PINNED' -or [string]::IsNullOrWhiteSpace([string]$p.signing.expected_subject) -or [string]::IsNullOrWhiteSpace([string]$p.signing.expected_certificate_sha256)){throw 'PRODUCTION BLOCKED: real code-signing identity pin is unresolved'}
          if($p.license.owner_decision_status-ne'APPROVED' -or [string]::IsNullOrWhiteSpace([string]$p.license.spdx_expression)){throw 'PRODUCTION BLOCKED: distribution license is unresolved'}
          Write-Host 'Repository-controlled production-chain verifier is integrated; external signed candidate, lifecycle and physical trust evidence are still required.'
