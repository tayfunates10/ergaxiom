name: One-shot production backend issuance validation

on:
  push:
    branches:
      - agent/desktop-production-issuance-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-production-issuance-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Export production backend module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/backend-issuance-runtime/src/lib.rs')
          source = path.read_text()
          marker = '#![forbid(unsafe_code)]\n'
          addition = '\nmod production;\npub use production::*;\n'
          if 'mod production;' not in source:
              if marker not in source:
                  raise SystemExit('backend issuance crate header not found')
              source = source.replace(marker, marker + addition, 1)
          path.write_text(source)
          PY
      - name: Format lint and test production backend issuance
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy \
            -p ergaxiom-backend-issuance-runtime \
            --all-targets --all-features -- -D warnings
          cargo test \
            -p ergaxiom-backend-issuance-runtime \
            --all-features -- --nocapture
      - name: Commit verified production issuance slice
        shell: bash
        run: |
          rm .github/workflows/temporary-validate-backend-production-issuance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/backend-issuance-runtime .github/workflows/temporary-validate-backend-production-issuance.yml
          git commit -m "Authorize governed production backend issuance"
          git push origin HEAD:agent/desktop-production-issuance-v1
