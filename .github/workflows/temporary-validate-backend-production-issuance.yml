name: Temporary production backend issuance validation

on:
  pull_request:
    paths:
      - "crates/backend-issuance-runtime/**"
      - "Cargo.lock"
      - ".github/workflows/temporary-validate-backend-production-issuance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Export and format production backend module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/backend-issuance-runtime/src/lib.rs')
          source = path.read_text()
          marker = '#![forbid(unsafe_code)]\n'
          addition = '\nmod production;\npub use production::*;\n'
          if 'mod production;' not in source:
              if marker not in source:
                  raise SystemExit('backend issuance crate header not found')
              source = source.replace(marker, marker + addition, 1)
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Run production backend validation
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > backend-format.log 2>&1
          format_status=$?
          cargo clippy \
            -p ergaxiom-backend-issuance-runtime \
            --all-targets --all-features -- -D warnings > backend-clippy.log 2>&1
          clippy_status=$?
          cargo test \
            -p ergaxiom-backend-issuance-runtime \
            --all-features -- --nocapture > backend-tests.log 2>&1
          test_status=$?
          printf '%s\n' "$format_status" "$clippy_status" "$test_status" > backend-status.txt
          exit 0
      - name: Upload formatted sources and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-issuance-validation
          if-no-files-found: error
          retention-days: 1
          path: |
            Cargo.lock
            crates/backend-issuance-runtime/Cargo.toml
            crates/backend-issuance-runtime/src/lib.rs
            crates/backend-issuance-runtime/src/production.rs
            crates/backend-issuance-runtime/tests/production_authorization.rs
            backend-format.log
            backend-clippy.log
            backend-tests.log
            backend-status.txt
      - name: Fail on validation mismatch
        shell: bash
        run: |
          readarray -t statuses < backend-status.txt
          if [[ "${statuses[0]}" != "0" || "${statuses[1]}" != "0" || "${statuses[2]}" != "0" ]]; then
            exit 1
          fi
