name: Windows DPAPI isolated signer

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-signer/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/governed-verification-runtime/**"
      - "crates/windows-signer-client-runtime/**"
      - "crates/windows-signer-protocol-runtime/**"
      - "crates/key-governance-runtime/**"
      - "crates/proof-kernel/**"
      - "docs/architecture/37-windows-dpapi-isolated-signer.md"
      - "docs/architecture/38-purpose-locked-capability-issuance.md"
      - "docs/status.md"
      - ".github/workflows/windows-dpapi-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-signer/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/governed-verification-runtime/**"
      - "crates/windows-signer-client-runtime/**"
      - "crates/windows-signer-protocol-runtime/**"
      - "crates/key-governance-runtime/**"
      - "crates/proof-kernel/**"
      - "docs/architecture/37-windows-dpapi-isolated-signer.md"
      - "docs/architecture/38-purpose-locked-capability-issuance.md"
      - "docs/status.md"
      - ".github/workflows/windows-dpapi-signer.yml"

permissions:
  contents: read

jobs:
  protocol:
    name: Verify signer protocol and client boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint platform-neutral signer boundaries
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-signer-protocol-runtime \
            -p ergaxiom-windows-signer-client-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-governed-verification-runtime \
            -p ergaxiom-windows-signer \
            --all-targets --all-features -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/signer-clippy-linux.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/signer-clippy-linux.status"
          exit 0

      - name: Upload Linux signer Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signer-clippy-linux-diagnostics
          path: ${{ runner.temp }}/signer-clippy-linux.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on Linux signer lint mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/signer-clippy-linux.status")" = "0"

      - name: Run platform-neutral signer attack tests
        run: >-
          cargo test
          -p ergaxiom-windows-signer-protocol-runtime
          -p ergaxiom-windows-signer-client-runtime
          -p ergaxiom-capability-issuance-runtime
          -p ergaxiom-capability-runtime
          -p ergaxiom-governed-verification-runtime
          -p ergaxiom-windows-signer

  windows-dpapi:
    name: Exercise real DPAPI and isolated signer process
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint Windows signer and protocol
        shell: pwsh
        run: |
          cargo clippy `
            -p ergaxiom-windows-signer-protocol-runtime `
            -p ergaxiom-windows-signer-client-runtime `
            -p ergaxiom-capability-issuance-runtime `
            -p ergaxiom-capability-runtime `
            -p ergaxiom-governed-verification-runtime `
            -p ergaxiom-windows-signer `
            --all-targets --all-features -- -D warnings `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\signer-clippy-windows.log"
          "$LASTEXITCODE" | Set-Content "$env:RUNNER_TEMP\signer-clippy-windows.status"
          exit 0

      - name: Upload Windows signer Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signer-clippy-windows-diagnostics
          path: ${{ runner.temp }}/signer-clippy-windows.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on Windows signer lint mismatch
        shell: pwsh
        run: |
          $status = (Get-Content "$env:RUNNER_TEMP\signer-clippy-windows.status").Trim()
          if ($status -ne "0") { exit [int]$status }

      - name: Run real DPAPI and process isolation tests
        run: >-
          cargo test
          -p ergaxiom-windows-signer-protocol-runtime
          -p ergaxiom-windows-signer-client-runtime
          -p ergaxiom-capability-issuance-runtime
          -p ergaxiom-capability-runtime
          -p ergaxiom-governed-verification-runtime
          -p ergaxiom-windows-signer
          --all-features

      - name: Compile isolated signer executable
        run: cargo build -p ergaxiom-windows-signer --release

      - name: Upload unsigned isolated signer diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-windows-signer-unsigned-diagnostic
          path: target/release/ergaxiom-windows-signer.exe
          if-no-files-found: error
          retention-days: 14
