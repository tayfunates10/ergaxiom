name: Fix PR 61 Windows test visibility

on:
  pull_request:
    paths:
      - ".github/workflows/fix-pr61-windows-test.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair Windows-only test visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          windows_path = Path("crates/windows-production-signer-host-runtime/src/windows.rs")
          windows = windows_path.read_text(encoding="utf-8")
          old = "fn is_recoverable_connection_error(error: &ProductionSignerHostError) -> bool {"
          new = "pub(crate) fn is_recoverable_connection_error(error: &ProductionSignerHostError) -> bool {"
          if windows.count(old) != 1:
              raise SystemExit("expected one recoverable connection helper")
          windows_path.write_text(windows.replace(old, new, 1), encoding="utf-8")

          tests_path = Path("crates/windows-production-signer-host-runtime/src/tests.rs")
          tests = tests_path.read_text(encoding="utf-8")
          old = "is_recoverable_connection_error("
          new = "crate::windows::is_recoverable_connection_error("
          if tests.count(old) != 2:
              raise SystemExit("expected two recoverable connection test calls")
          tests_path.write_text(tests.replace(old, new), encoding="utf-8")
          PY
          cargo fmt --all
      - name: Verify Windows production signer boundary
        shell: bash
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            --all-targets --all-features -- -D warnings
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/windows-production-signer-host-runtime/src/windows.rs \
            crates/windows-production-signer-host-runtime/src/tests.rs
          git commit -m "Fix Windows connection-isolation regression test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
