name: One-shot governance format and lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-governance-format-lock.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-governance-format-lock
  cancel-in-progress: true

jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fixed implementation head
        uses: actions/checkout@v4
        with:
          ref: agent/key-governance-release-evidence-v1
          fetch-depth: 0

      - name: Format sources and update workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/key-governance-runtime crates/governed-verification-runtime
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format governed verification and update lockfile"
          git push origin HEAD:agent/key-governance-release-evidence-v1
