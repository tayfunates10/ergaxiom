name: One-shot governance formatted source export

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-governance-format-lock.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-governance-formatted-source-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fixed implementation head
        uses: actions/checkout@v4
        with:
          ref: agent/key-governance-release-evidence-v1

      - name: Format sources and update workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          mkdir -p "$RUNNER_TEMP/formatted/crates/key-governance-runtime/src"
          mkdir -p "$RUNNER_TEMP/formatted/crates/key-governance-runtime/tests"
          mkdir -p "$RUNNER_TEMP/formatted/crates/governed-verification-runtime/src"
          mkdir -p "$RUNNER_TEMP/formatted/crates/governed-verification-runtime/tests"
          cp Cargo.lock "$RUNNER_TEMP/formatted/Cargo.lock"
          cp crates/key-governance-runtime/src/lib.rs "$RUNNER_TEMP/formatted/crates/key-governance-runtime/src/lib.rs"
          cp crates/key-governance-runtime/tests/governance.rs "$RUNNER_TEMP/formatted/crates/key-governance-runtime/tests/governance.rs"
          cp crates/governed-verification-runtime/src/lib.rs "$RUNNER_TEMP/formatted/crates/governed-verification-runtime/src/lib.rs"
          cp crates/governed-verification-runtime/tests/governed.rs "$RUNNER_TEMP/formatted/crates/governed-verification-runtime/tests/governed.rs"

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: governed-formatted-sources
          path: ${{ runner.temp }}/formatted/**
          if-no-files-found: error
          retention-days: 3
