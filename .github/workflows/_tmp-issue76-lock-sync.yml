name: Temporary Issue 76 Rust 1.85 lock sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-issue76-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/ai3-issue76-persistent-user-jobs
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy

      - name: Regenerate workspace and Tauri lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 generate-lockfile
          cargo +1.85.0 generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify locked Rust 1.85 graphs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 metadata --locked --format-version 1 > /dev/null
          cargo +1.85.0 metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo +1.85.0 tree --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime > "$RUNNER_TEMP/root-tree.txt"
          cargo +1.85.0 tree --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -p ergaxiom-print-ready-poster-preflight-certified-path-runtime > "$RUNNER_TEMP/tauri-tree.txt"
          grep -q 'lopdf v0.42.0' "$RUNNER_TEMP/root-tree.txt"
          grep -q 'lopdf v0.42.0' "$RUNNER_TEMP/tauri-tree.txt"
          if grep -Eq '(^|[[:space:]├└│])time v0\.3\.' "$RUNNER_TEMP/root-tree.txt"; then
            cat "$RUNNER_TEMP/root-tree.txt"
            echo "unexpected time dependency in root print-preflight graph" >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]├└│])time v0\.3\.' "$RUNNER_TEMP/tauri-tree.txt"; then
            cat "$RUNNER_TEMP/tauri-tree.txt"
            echo "unexpected time dependency in Tauri print-preflight graph" >&2
            exit 1
          fi

      - name: Verify platform-independent Issue 76 runtimes on Rust 1.85
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 check --locked -p ergaxiom-desktop-user-job-runtime --all-targets
          cargo +1.85.0 check --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime --all-targets

      - name: Commit synchronized lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock
          git diff --cached --check
          git diff --cached --quiet && { echo "lockfiles already synchronized"; exit 0; }
          git commit -m "fix: synchronize Issue #76 Rust 1.85 lockfiles"
          git push origin HEAD:codex/ai3-issue76-persistent-user-jobs
