name: Temporary secure lopdf Rust 1.85 vendor repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-lopdf-secure-msrv-lock.yml"

permissions:
  contents: write

jobs:
  repair-vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rust-1-85-lopdf-compat
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Fetch and vendor exact security-patched lopdf 0.42.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          rm -rf vendor/lopdf-0.42.0
          mkdir -p vendor

          python - <<'PY' > /tmp/lopdf.expected.sha256
          import re
          import subprocess

          lock = subprocess.check_output(["git", "show", "origin/main:Cargo.lock"], text=True)
          for block in lock.split("[[package]]"):
              if re.search(r'\nname = "lopdf"\n', "\n" + block) and 'version = "0.42.0"' in block:
                  match = re.search(r'checksum = "([0-9a-f]{64})"', block)
                  if not match:
                      raise SystemExit("main lopdf 0.42.0 lock entry has no checksum")
                  print(match.group(1))
                  break
          else:
              raise SystemExit("main does not contain the expected lopdf 0.42.0 lock entry")
          PY

          python - <<'PY'
          from pathlib import Path
          manifest = Path("crates/print-ready-poster-preflight-certified-path-runtime/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          old_dep = 'lopdf = { version = "=0.43.0", default-features = false }'
          new_dep = 'lopdf = { version = "=0.42.0", default-features = false }'
          if old_dep not in text:
              raise SystemExit("expected temporary lopdf 0.43 dependency not found")
          manifest.write_text(text.replace(old_dep, new_dep, 1), encoding="utf-8")
          PY

          cargo +1.85.0 update -p lopdf --precise 0.42.0
          cargo +1.85.0 fetch --locked

          crate_file="$(find "$CARGO_HOME/registry/cache" -type f -name 'lopdf-0.42.0.crate' -print -quit)"
          source_dir="$(find "$CARGO_HOME/registry/src" -type d -name 'lopdf-0.42.0' -print -quit)"
          test -n "$crate_file" || { echo "Cargo cache did not contain lopdf-0.42.0.crate" >&2; exit 1; }
          test -n "$source_dir" || { echo "Cargo registry source did not contain lopdf-0.42.0" >&2; exit 1; }

          actual="$(sha256sum "$crate_file" | awk '{print $1}')"
          expected="$(cat /tmp/lopdf.expected.sha256)"
          test "$actual" = "$expected" || {
            echo "lopdf crate checksum mismatch: expected=$expected actual=$actual" >&2
            exit 1
          }

          cp -a "$source_dir" vendor/lopdf-0.42.0

          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("vendor/lopdf-0.42.0/src/object.rs")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?P<indent>[ \t]*)if let Ok\(base_encoding\) = dict\.get\(b"BaseEncoding"\)\s*'
              r'&& let Ok\(name\) = base_encoding\.as_name\(\)\s*'
              r'\{\s*base = Some\(self\.base_encoding\(doc, name\)\?\);\s*\}',
              re.MULTILINE,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit("expected lopdf 0.42.0 BaseEncoding let-chain not found")
          indent = match.group("indent")
          replacement = (
              f'{indent}if let Ok(base_encoding) = dict.get(b"BaseEncoding") {{\n'
              f'{indent}    if let Ok(name) = base_encoding.as_name() {{\n'
              f'{indent}        base = Some(self.base_encoding(doc, name)?);\n'
              f'{indent}    }}\n'
              f'{indent}}}'
          )
          patched, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one BaseEncoding syntax patch, got {count}")
          path.write_text(patched, encoding="utf-8")

          manifest = Path("crates/print-ready-poster-preflight-certified-path-runtime/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          registry_dep = 'lopdf = { version = "=0.42.0", default-features = false }'
          path_dep = 'lopdf = { path = "../../vendor/lopdf-0.42.0", default-features = false }'
          if registry_dep not in text:
              raise SystemExit("expected temporary registry lopdf 0.42 dependency not found")
          manifest.write_text(text.replace(registry_dep, path_dep, 1), encoding="utf-8")

          root_manifest = Path("Cargo.toml")
          root_text = root_manifest.read_text(encoding="utf-8")
          exclude_line = 'exclude = ["vendor/lopdf-0.42.0"]\n'
          if exclude_line not in root_text:
              marker = ']\nresolver = "2"\n'
              if marker not in root_text:
                  raise SystemExit("root workspace resolver marker not found")
              root_manifest.write_text(root_text.replace(marker, ']\n' + exclude_line + 'resolver = "2"\n', 1), encoding="utf-8")

          Path("vendor/lopdf-0.42.0/ERGAXIOM_PATCH.md").write_text(
              "# Ergaxiom lopdf 0.42.0 MSRV patch\n\n"
              "Source: crates.io `lopdf` 0.42.0 fetched through Cargo and SHA-256 verified against Ergaxiom `main`'s Cargo.lock.\n\n"
              "Security: this is the 0.42.0 release containing the bounded PDF array/dictionary nesting fix for RUSTSEC-2026-0187. "
              "The parser depth logic is retained unchanged.\n\n"
              "Compatibility patch: upstream declares Rust 1.85 but one `BaseEncoding` `let`-chain uses syntax unavailable on Rust 1.85. "
              "Ergaxiom rewrites exactly that expression to semantically equivalent nested `if let` statements.\n\n"
              "Dependency surface: Ergaxiom disables lopdf default features, so optional `time`, `chrono`, `jiff`, and `rayon` are not pulled into this runtime.\n",
              encoding="utf-8",
          )
          PY

          grep -q 'MAX_NESTING_DEPTH' vendor/lopdf-0.42.0/src/parser/mod.rs
          grep -q 'if depth == 0' vendor/lopdf-0.42.0/src/parser/mod.rs
          grep -q 'rust-version = "1.85"' vendor/lopdf-0.42.0/Cargo.toml

      - name: Resolve minimal patched lock graph
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 metadata --format-version 1 > /dev/null
          cargo +1.85.0 tree --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime > /tmp/print-tree.txt
          grep 'lopdf v0.42.0' /tmp/print-tree.txt
          if grep -Eq '(^|[[:space:]├└│])time v0\.3\.' /tmp/print-tree.txt; then
            cat /tmp/print-tree.txt
            echo "optional time dependency leaked into the print-preflight graph" >&2
            exit 1
          fi

      - name: Verify Rust 1.85 locked graph
        run: cargo +1.85.0 check --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime --all-targets

      - name: Strict Clippy on Rust 1.85
        run: cargo +1.85.0 clippy --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime --all-targets --all-features -- -D warnings

      - name: Deterministic print-preflight tests on Rust 1.85
        run: cargo +1.85.0 test --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime

      - name: Commit verified vendor and lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock \
            crates/print-ready-poster-preflight-certified-path-runtime/Cargo.toml \
            vendor/lopdf-0.42.0
          git diff --cached --check
          git diff --cached --quiet && { echo "verified vendor repair produced no changes"; exit 1; }
          git commit -m "fix: vendor security-patched lopdf 0.42 for Rust 1.85"
          git push origin HEAD:fix/rust-1-85-lopdf-compat
