              '''    #[error("production trust recovery file digest does not match")]
              RecoveryFileDigestMismatch,
          ''',
              '''    #[error("production trust recovery file digest does not match")]
              RecoveryFileDigestMismatch,
              #[error("production trust recovery file does not match the accepted checkpoint")]
              RecoveryFileStateMismatch,
          ''',
          )

          # Host uses the exact same response type and isolates per-connection transport failures.
          host = "crates/windows-production-signer-host-runtime/src/lib.rs"
          replace_once(
              host,
              '''use ergaxiom_windows_production_signer_transport_runtime::{
                  AuthenticatedPipeConnection, ProductionSignerTransportError,
              };
          ''',
              '''pub use ergaxiom_windows_production_signer_transport_runtime::{
                  PRODUCTION_SIGNER_HOST_RESPONSE_SCHEMA, ProductionSignerHostResponse,
              };
              use ergaxiom_windows_production_signer_transport_runtime::{
                  AuthenticatedPipeConnection, ProductionSignerTransportError,
              };
          ''',
          )
          replace_once(
              host,
              'pub const PRODUCTION_SIGNER_HOST_RESPONSE_SCHEMA: &str = "0.1.0";\n',
              "",
          )
          regex_once(
              host,
              r'''\n#\[derive\(Debug, Clone, PartialEq, Eq, Serialize, Deserialize\)\]\n#\[serde\(tag = "status", rename_all = "SCREAMING_SNAKE_CASE"\)\]\npub enum ProductionSignerHostResponse \{.*?\n\}\n\nimpl ProductionSignerHostResponse \{.*?\n\}\n\n#\[cfg\(windows\)\]\n''',
              "\n#[cfg(windows)]\n",
          )
          replace_once(
              host,
              '''    #[error("production signer host response schema is unsupported")]
              UnsupportedResponseSchema,
          ''',
              "",
          )
          replace_once(
              host,
              '''    #[error("production signer host response digest does not match")]
              ResponseDigestMismatch,
          ''',
              "",
          )

          windows_host = "crates/windows-production-signer-host-runtime/src/windows.rs"
          replace_once(
              windows_host,
              '''        host.serve_connection(&mut connection, trusted_now_epoch_s()?)?;
                  }
          ''',
              '''        let result = host.serve_connection(&mut connection, trusted_now_epoch_s()?);
                  match result {
                      Ok(()) => {}
                      Err(error) if is_recoverable_connection_error(&error) => continue,
                      Err(error) => return Err(error),
                  }
              }
          ''',
          )
          replace_once(
              windows_host,
              "fn configure_service(service: &ServiceHandle) -> Result<(), ProductionSignerHostError> {\n",
              '''fn is_recoverable_connection_error(error: &ProductionSignerHostError) -> bool {
                  matches!(error, ProductionSignerHostError::Transport(_))
              }

              fn configure_service(service: &ServiceHandle) -> Result<(), ProductionSignerHostError> {
          ''',
          )

          host_tests = "crates/windows-production-signer-host-runtime/src/tests.rs"
          replace_once(
              host_tests,
              "Err(ProductionSignerHostError::ResponseDigestMismatch)\n",
              "Err(ProductionSignerTransportError::HostResponseDigestMismatch)\n",
          )
          replace_once(
              host_tests,
              "#[cfg(not(windows))]\n#[test]\nfn scm_operations_are_unavailable_off_windows()",
              '''#[test]
              fn rejected_host_response_uses_the_client_wire_contract() -> Result<(), Box<dyn Error>> {
                  let response = ProductionSignerHostResponse::rejected(
                      Some("request-1".to_owned()),
                      "SIGNING_REJECTED",
                  )?;
                  let bytes = serde_json::to_vec(&response)?;
                  assert!(matches!(
                      ProductionSignerPipeClient.decode_host_response(&bytes, "request-1"),
                      Err(ProductionSignerTransportError::HostRejected { code, .. })
                          if code == "SIGNING_REJECTED"
                  ));
                  Ok(())
              }

              #[test]
              fn transport_failures_are_scoped_to_one_connection() {
                  assert!(is_recoverable_connection_error(
                      &ProductionSignerHostError::Transport(
                          ProductionSignerTransportError::MessageSizeInvalid,
                      ),
                  ));
                  assert!(!is_recoverable_connection_error(
                      &ProductionSignerHostError::ServiceHardeningWeakened,
                  ));
              }

              #[cfg(not(windows))]
              #[test]
              fn scm_operations_are_unavailable_off_windows()''',
          )

          # Regression: accepted state expiry blocks signing before backend use.
          deployed_tests = "crates/windows-production-trust-state-runtime/tests/deployed_service.rs"
          replace_once(
              deployed_tests,
              '''    DeployedProductionSignerError, OfflineBootstrapExpectation, ProductionSignerDeploymentPolicy,
                  ProductionTrustStateActivator, ProductionTrustStateBody, ProductionTrustStateEnvelope,
          ''',
              '''    DeployedProductionSignerError, OfflineBootstrapExpectation, ProductionSignerDeploymentPolicy,
                  ProductionTrustStateActivator, ProductionTrustStateBody, ProductionTrustStateEnvelope,
                  ProductionTrustStateError,
          ''',
          )
          replace_once(
              deployed_tests,
              "#[test]\nfn backend_generation_substitution_fails_before_service_start()",
              '''#[test]
              fn deployed_service_rejects_requests_after_accepted_state_expires()
              -> Result<(), Box<dyn Error>> {
                  let fixture = Fixture::build(GenerationBackend::production()?)?;
                  let selected_generation = fixture.selected_generation.clone();
                  let mut deployed = TrustBoundProductionSignerService::new(
                      fixture.service,
                      fixture.accepted,
