name: Address PR 61 review findings

on:
  push:
    branches:
      - agent/tpm-cng-signer-service-v1
    paths:
      - ".github/workflows/address-pr61-review.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply review fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:120]!r}")
              write(path, value.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              value = read(path)
              updated, count = re.subn(pattern, replacement, value, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one regex match in {path}, found {count}: {pattern[:120]!r}")
              write(path, updated)

          # The canonicalization workflow must validate the PR head and never mutate a branch.
          write(
              ".github/workflows/deployment-evidence-canonicalize-tests.yml",
              '''name: Canonicalize deployment evidence tests

          on:
            pull_request:
              paths:
                - "Cargo.toml"
                - "Cargo.lock"
                - "crates/windows-production-deployment-evidence-runtime/**"
                - "crates/windows-production-installation-evidence-runtime/**"
                - "crates/windows-sys-registry-shim/**"
                - ".github/workflows/deployment-evidence-canonicalize-tests.yml"

          permissions:
            contents: read

          jobs:
            canonicalize:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt
                - name: Check canonical Rust formatting
                  run: cargo fmt --all -- --check
                - name: Check canonical lockfile
                  shell: bash
                  run: |
                    cargo generate-lockfile
                    git diff --exit-code -- Cargo.lock
          '''.replace("          ", "")
          )

          # Put the host response wire contract in the transport crate used by both client and host.
          replace_once(
              "crates/windows-production-signer-transport-runtime/Cargo.toml",
              "[dependencies]\n",
              "[dependencies]\nergaxiom-proof-kernel = { path = \"../proof-kernel\" }\n",
          )
          replace_once(
              "crates/windows-production-signer-transport-runtime/Cargo.toml",
              'ergaxiom-windows-production-signer-service-runtime = { path = "../windows-production-signer-service-runtime" }\n',
              'ergaxiom-windows-production-signer-service-runtime = { path = "../windows-production-signer-service-runtime" }\nergaxiom-windows-production-trust-state-runtime = { path = "../windows-production-trust-state-runtime" }\n',
          )

          transport = "crates/windows-production-signer-transport-runtime/src/lib.rs"
          replace_once(
              transport,
              "use ergaxiom_windows_production_signer_protocol_runtime::ProductionSignerRequest;\n",
              "use ergaxiom_proof_kernel::{HashingError, canonical_json_sha256};\nuse ergaxiom_windows_production_signer_protocol_runtime::{\n    ProductionSignerRequest, ProductionSignerResponse,\n};\n",
          )
          replace_once(
              transport,
              "use ergaxiom_windows_production_signer_service_runtime::AuthorizedProductionSignerPackage;\n",
              "use ergaxiom_windows_production_signer_service_runtime::AuthorizedProductionSignerPackage;\nuse ergaxiom_windows_production_trust_state_runtime::{\n    DeployedAuthorizedProductionSignerPackage, DeployedProductionSignerError,\n};\n",
          )
          replace_once(
              transport,
              "use serde::{Serialize, de::DeserializeOwned};\n",
              "use serde::{Deserialize, Serialize, de::DeserializeOwned};\nuse serde_json::Value;\n",
          )
          replace_once(
              transport,
              "pub const PIPE_IO_TIMEOUT_MS: u32 = 5_000;\n",
              "pub const PIPE_IO_TIMEOUT_MS: u32 = 5_000;\npub const PRODUCTION_SIGNER_HOST_RESPONSE_SCHEMA: &str = \"0.1.0\";\n",
          )

          response_block = r'''
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "status", rename_all = "SCREAMING_SNAKE_CASE")]
          pub enum ProductionSignerHostResponse {
              Success {
                  schema_version: String,
                  package: Box<DeployedAuthorizedProductionSignerPackage>,
                  response_digest: String,
              },
              Rejected {
                  schema_version: String,
                  request_id: Option<String>,
                  code: String,
                  response_digest: String,
              },
          }

          impl ProductionSignerHostResponse {
              pub fn success(
                  package: DeployedAuthorizedProductionSignerPackage,
              ) -> Result<Self, ProductionSignerTransportError> {
                  package.validate_seal()?;
                  let mut response = Self::Success {
                      schema_version: PRODUCTION_SIGNER_HOST_RESPONSE_SCHEMA.to_owned(),
                      package: Box::new(package),
                      response_digest: String::new(),
                  };
                  response.set_digest()?;
                  Ok(response)
              }

              pub fn rejected(
                  request_id: Option<String>,
                  code: impl Into<String>,
              ) -> Result<Self, ProductionSignerTransportError> {
                  let mut response = Self::Rejected {
                      schema_version: PRODUCTION_SIGNER_HOST_RESPONSE_SCHEMA.to_owned(),
                      request_id,
                      code: code.into(),
                      response_digest: String::new(),
                  };
                  response.set_digest()?;
                  Ok(response)
              }

              pub fn validate_seal(&self) -> Result<(), ProductionSignerTransportError> {
                  let (schema_version, response_digest) = match self {
                      Self::Success {
                          schema_version,
                          response_digest,
                          ..
                      }
                      | Self::Rejected {
                          schema_version,
                          response_digest,
                          ..
                      } => (schema_version, response_digest),
                  };
                  if schema_version != PRODUCTION_SIGNER_HOST_RESPONSE_SCHEMA {
                      return Err(ProductionSignerTransportError::UnsupportedHostResponseSchema);
                  }
                  if response_digest != &self.expected_digest()? {
                      return Err(ProductionSignerTransportError::HostResponseDigestMismatch);
                  }
                  Ok(())
              }

              pub fn into_deployed_package(
                  self,
                  expected_request_id: &str,
              ) -> Result<DeployedAuthorizedProductionSignerPackage, ProductionSignerTransportError> {
                  self.validate_seal()?;
                  match self {
                      Self::Success { package, .. } => {
                          package.validate_seal()?;
                          let actual_request_id = match &package.signer_package.signer_response {
                              ProductionSignerResponse::Success { request_id, .. } => {
                                  Some(request_id.as_str())
                              }
                              ProductionSignerResponse::Error { request_id, .. } => {
                                  request_id.as_deref()
                              }
                          };
                          if actual_request_id != Some(expected_request_id) {
                              return Err(
                                  ProductionSignerTransportError::HostResponseRequestIdMismatch,
                              );
                          }
                          Ok(*package)
                      }
                      Self::Rejected {
                          request_id, code, ..
                      } => {
                          if request_id
                              .as_deref()
                              .is_some_and(|request_id| request_id != expected_request_id)
                          {
                              return Err(
                                  ProductionSignerTransportError::HostResponseRequestIdMismatch,
                              );
                          }
                          Err(ProductionSignerTransportError::HostRejected { request_id, code })
                      }
                  }
              }

              fn set_digest(&mut self) -> Result<(), ProductionSignerTransportError> {
                  let digest = self.expected_digest()?;
                  match self {
                      Self::Success {
                          response_digest, ..
                      }
                      | Self::Rejected {
                          response_digest, ..
                      } => *response_digest = digest,
                  }
                  self.validate_seal()
              }

              fn expected_digest(&self) -> Result<String, ProductionSignerTransportError> {
                  let mut value = serde_json::to_value(self)?;
                  let object = value
                      .as_object_mut()
                      .ok_or(ProductionSignerTransportError::InvalidHostResponseObject)?;
                  object.insert("response_digest".to_owned(), Value::String(String::new()));
                  Ok(canonical_json_sha256(&value)?)
              }
          }

          '''.replace("          ", "")
          replace_once(
              transport,
              "#[derive(Debug, Clone, Copy, Default)]\npub struct ProductionSignerPipeClient;\n",
              response_block + "#[derive(Debug, Clone, Copy, Default)]\npub struct ProductionSignerPipeClient;\n",
          )
          replace_once(
              transport,
              '''    pub fn invoke(
                  &self,
                  request: &ProductionSignerRequest,
              ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerTransportError> {
                  self.exchange(request, 64 * 1024, 128 * 1024)
              }
          ''',
              '''    pub fn invoke(
                  &self,
                  request: &ProductionSignerRequest,
              ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerTransportError> {
                  let deployed = self.invoke_deployed(request)?;
                  deployed.validate_seal()?;
                  Ok(deployed.signer_package)
              }

              pub fn invoke_deployed(
                  &self,
                  request: &ProductionSignerRequest,
              ) -> Result<DeployedAuthorizedProductionSignerPackage, ProductionSignerTransportError> {
                  let response: ProductionSignerHostResponse =
                      self.exchange(request, 64 * 1024, 128 * 1024)?;
                  response.into_deployed_package(&request.request_id)
              }

              pub fn decode_host_response(
                  &self,
                  bytes: &[u8],
                  expected_request_id: &str,
              ) -> Result<DeployedAuthorizedProductionSignerPackage, ProductionSignerTransportError> {
                  let response: ProductionSignerHostResponse = serde_json::from_slice(bytes)?;
                  response.into_deployed_package(expected_request_id)
              }
          ''',
          )
          replace_once(
              transport,
              '''    #[error("production signer named-pipe message is incomplete")]
              IncompleteMessage,
              #[error("production signer named-pipe JSON failed: {0}")]
              Json(#[from] serde_json::Error),
          ''',
              '''    #[error("production signer named-pipe message is incomplete")]
              IncompleteMessage,
              #[error("production signer host response schema is unsupported")]
              UnsupportedHostResponseSchema,
              #[error("production signer host response digest does not match")]
              HostResponseDigestMismatch,
              #[error("production signer host response request identity does not match")]
              HostResponseRequestIdMismatch,
              #[error("production signer host response canonical object is invalid")]
              InvalidHostResponseObject,
              #[error("production signer host rejected request {request_id:?} with code {code}")]
              HostRejected {
                  request_id: Option<String>,
                  code: String,
              },
              #[error("production signer named-pipe JSON failed: {0}")]
              Json(#[from] serde_json::Error),
              #[error(transparent)]
              Hashing(#[from] HashingError),
              #[error(transparent)]
              Deployed(#[from] DeployedProductionSignerError),
          ''',
          )

          # Deployed packages gain a public integrity check and the service rechecks state time per request.
          service = "crates/windows-production-trust-state-runtime/src/service.rs"
          replace_once(
              service,
              '''use ergaxiom_windows_production_signer_protocol_runtime::{
                  ProductionSignerEnvelope, ProductionSignerRequest,
              };
          ''',
              '''use ergaxiom_windows_production_signer_protocol_runtime::{
                  ProductionSignerEnvelope, ProductionSignerRequest, ProductionSignerResponse,
              };
          ''',
          )
          replace_once(
              service,
              '''        package.package_digest = package.expected_digest()?;
                  Ok(package)
              }

              pub fn verify_deployed(
          ''',
              '''        package.package_digest = package.expected_digest()?;
                  package.validate_seal()?;
                  Ok(package)
              }

              pub fn validate_seal(&self) -> Result<(), DeployedProductionSignerError> {
                  if self.schema_version != DEPLOYED_PRODUCTION_SIGNER_PACKAGE_SCHEMA {
                      return Err(DeployedProductionSignerError::UnsupportedDeployedPackageSchema);
                  }
                  self.trust_state.validate_seal()?;
                  self.signer_service_identity.validate_seal()?;
                  if self.key_generation == 0 {
                      return Err(DeployedProductionSignerError::KeyGenerationMismatch);
                  }
                  let ProductionSignerResponse::Success { result, .. } =
                      &self.signer_package.signer_response
                  else {
                      return Err(
                          DeployedProductionSignerError::SignedTrustStateBindingMismatch,
                      );
                  };
                  if result
                      .envelope
                      .binding
                      .trust_state_binding_digest
                      .as_deref()
                      != Some(self.trust_state.binding_digest.as_str())
                  {
                      return Err(
                          DeployedProductionSignerError::SignedTrustStateBindingMismatch,
                      );
                  }
                  if self.package_digest != self.expected_digest()? {
                      return Err(DeployedProductionSignerError::DeployedPackageDigestMismatch);
                  }
                  Ok(())
              }

              pub fn verify_deployed(
          ''',
          )
          replace_once(
              service,
              '''        if self.schema_version != DEPLOYED_PRODUCTION_SIGNER_PACKAGE_SCHEMA {
                      return Err(DeployedProductionSignerError::UnsupportedDeployedPackageSchema);
                  }
                  self.trust_state.validate_seal()?;
                  self.signer_service_identity.validate_seal()?;
                  deployment_policy.validate_seal()?;
          ''',
              '''        self.validate_seal()?;
                  deployment_policy.validate_seal()?;
          ''',
          )
          replace_once(
              service,
              '''    ) -> Result<DeployedAuthorizedProductionSignerPackage, DeployedProductionSignerError> {
                  if !self.deployment_policy.permits(&request.identity) {
          ''',
              '''    ) -> Result<DeployedAuthorizedProductionSignerPackage, DeployedProductionSignerError> {
                  let body = self.accepted.body();
                  if trusted_now_epoch_s < body.not_before_epoch_s
                      || trusted_now_epoch_s >= body.not_after_epoch_s
                  {
                      return Err(DeployedProductionSignerError::TrustState(
                          ProductionTrustStateError::TrustStateOutsideValidityWindow,
                      ));
                  }
                  if !self.deployment_policy.permits(&request.identity) {
          ''',
          )

          # Recovery expiry authorizes initiating recovery; it must not invalidate persisted state later.
          model = "crates/windows-production-trust-state-runtime/src/model.rs"
          regex_once(
              model,
              r'''    pub fn verify\(\n        &self,\n        governance_policy: &TrustGovernancePolicy,\n        trusted_now_epoch_s: u64,\n    \) -> Result<\(\), ProductionTrustStateError> \{\n        if self\.schema_version != PRODUCTION_TRUST_RECOVERY_ENVELOPE_SCHEMA \{.*?\n        Ok\(\(\)\)\n    \}\n''',
              '''    pub fn verify(
                  &self,
                  governance_policy: &TrustGovernancePolicy,
                  trusted_now_epoch_s: u64,
              ) -> Result<(), ProductionTrustStateError> {
                  self.verify_internal(governance_policy, trusted_now_epoch_s, true)
              }

              pub fn verify_persisted(
                  &self,
                  governance_policy: &TrustGovernancePolicy,
              ) -> Result<(), ProductionTrustStateError> {
                  self.verify_internal(
                      governance_policy,
                      self.body.expires_at_epoch_s.saturating_sub(1),
                      false,
                  )
              }

              fn verify_internal(
                  &self,
                  governance_policy: &TrustGovernancePolicy,
                  verification_epoch_s: u64,
                  enforce_expiry: bool,
              ) -> Result<(), ProductionTrustStateError> {
                  if self.schema_version != PRODUCTION_TRUST_RECOVERY_ENVELOPE_SCHEMA {
                      return Err(ProductionTrustStateError::UnsupportedRecoveryEnvelopeSchema);
                  }
                  self.body.validate_shape()?;
                  governance_policy.validate_seal()?;
                  if self.governance_policy_digest != governance_policy.policy_digest {
                      return Err(ProductionTrustStateError::GovernancePolicyDigestMismatch);
                  }
                  if enforce_expiry && verification_epoch_s >= self.body.expires_at_epoch_s {
                      return Err(ProductionTrustStateError::RecoveryExpired);
                  }
                  governance_policy.verify_signatures(
                      TRUST_RECOVERY_SIGNATURE_DOMAIN,
                      &self.body.body_digest,
                      verification_epoch_s,
                      &self.signatures,
                  )?;
                  if self.envelope_digest != self.expected_digest()? {
                      return Err(ProductionTrustStateError::RecoveryEnvelopeDigestMismatch);
                  }
                  Ok(())
              }
          ''',
          )

          store = "crates/windows-production-trust-state-runtime/src/store.rs"
          replace_once(
              store,
              '''                recovery.verify(governance_policy, trusted_now_epoch_s)?;
                      Some(recovery)
          ''',
              '''                recovery.verify_persisted(governance_policy)?;
                      if recovery.body.deployment_id != checkpoint.deployment_id
                          || recovery.body.replacement_state_digest != checkpoint.state_digest
                          || recovery.body.recovery_sequence != checkpoint.last_recovery_sequence
                      {
                          return Err(ProductionTrustStoreError::RecoveryFileStateMismatch);
                      }
                      Some(recovery)
          ''',
          )
          replace_once(
