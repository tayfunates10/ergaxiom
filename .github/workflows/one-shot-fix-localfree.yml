name: One-shot fix Windows LocalFree import

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-fix-localfree.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-fix-windows-localfree
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out signer branch
        uses: actions/checkout@v4
        with:
          ref: agent/dpapi-isolated-windows-signer-v1
          fetch-depth: 0

      - name: Move LocalFree import to Win32 Foundation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/windows-signer/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = "    use windows_sys::Win32::System::Memory::LocalFree;"
          new = "    use windows_sys::Win32::Foundation::LocalFree;"
          if old not in text:
              raise SystemExit("LocalFree import line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-localfree.yml
          git add apps/windows-signer crates/windows-signer-client-runtime
          git commit -m "Fix Windows signer FFI imports"
          git push origin HEAD:agent/dpapi-isolated-windows-signer-v1
