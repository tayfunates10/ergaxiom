name: Issue 75 Lock And Toolchain Export

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: read

jobs:
  export:
    if: github.event.head_commit.message == 'issue75-export-lock-toolchain-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Apply deterministic source and workflow sync
        run: python .github/scripts/issue75_lock_toolchain_sync.py
      - name: Regenerate desktop lockfile with pinned Rust
        run: cargo +1.85.0 generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Verify key governance strict clippy
        run: cargo +1.85.0 clippy --locked -p ergaxiom-key-governance-runtime --all-targets -- -D warnings
      - name: Verify desktop lockfile is closed
        run: cargo +1.85.0 metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: issue75-lock-toolchain-sync
          if-no-files-found: error
          path: |
            crates/key-governance-runtime/src/lib.rs
            .github/workflows/production-execution-chain.yml
            apps/desktop/src-tauri/Cargo.lock
