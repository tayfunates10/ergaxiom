name: Issue 75 Non Workflow Sync

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'issue75-commit-lock-and-key-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Apply key-governance source repair
        run: python .github/scripts/issue75_lock_toolchain_sync.py
      - name: Regenerate desktop lockfile with pinned Rust
        run: cargo +1.85.0 generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Verify key governance strict clippy
        run: cargo +1.85.0 clippy --locked -p ergaxiom-key-governance-runtime --all-targets -- -D warnings
      - name: Verify desktop lockfile is closed
        run: cargo +1.85.0 metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null
      - name: Commit only non-workflow verified files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Tayfun
          git config user.email tayfuna766@gmail.com
          git add crates/key-governance-runtime/src/lib.rs apps/desktop/src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m 'issue75: sync pinned desktop lock and key encoding'
          git push origin HEAD:codex/issue-75
