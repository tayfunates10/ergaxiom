name: Validate live production lease source

on:
  pull_request:
    paths:
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/inspect-live-production-lease.yml"
      - ".github/workflows/sync-live-production-trust-lease.yml"
      - ".github/workflows/retry-live-production-trust-lease.yml"
  push:
    branches:
      - agent/live-production-trust-lease-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-production-trust-lease-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply trust lease source transformation
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/sync-live-production-trust-lease.yml').read_text()
          start_marker = '      - name: Implement verified trust lease\n        shell: python\n        run: |\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index('\n      - name: Validate trust lease', start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          failing = '\n'.join([
              "if old_key not in test:",
              "    raise SystemExit('generation key marker missing')",
              "test = test.replace(old_key, new_key, 1)",
          ])
          repaired = '\n'.join([
              "if old_key not in test:",
              "    match_start = test.index('        match generation {', test.index('fn key_for_generation'))",
              "    match_end = test.index('        }', match_start) + len('        }')",
              "    old_key = test[match_start:match_end]",
              "test = test.replace(old_key, new_key, 1)",
              "test = test.replace(",
              "    'fn key_for_generation(\\n        &self,\\n        generation: u64,',",
              "    'fn key_for_generation(\\n        &self,\\n        policy: &ProductionKeyPolicy,\\n        generation: u64,',",
              "    1,",
              ")",
              "test = test.replace(",
              "    'self.key_for_generation(generation)?',",
              "    'self.key_for_generation(policy, generation)?',",
              ")",
          ])
          if failing not in script:
              raise SystemExit('generation repair source marker missing')
          script = script.replace(failing, repaired, 1)
          exec(compile(script, 'implement-live-trust-lease', 'exec'), {})

      - name: Validate trust lease
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p ergaxiom-windows-production-trust-state-runtime --all-targets --all-features -- -D warnings
          cargo test -p ergaxiom-windows-production-trust-state-runtime --test deployed_service -- --nocapture

      - name: Commit validated trust lease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-trust-state-runtime/src/identity_proof.rs \
            crates/windows-production-trust-state-runtime/tests/deployed_service.rs \
            .github/workflows/live-production-trust-lease.yml \
            docs/architecture/51-live-production-trust-lease.md
          git diff --cached --quiet && exit 0
          git commit -m "Build fresh production signer trust leases"
          git push origin HEAD:agent/live-production-trust-lease-v1
