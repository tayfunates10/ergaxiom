name: Inspect live production lease inputs

on:
  push:
    branches:
      - agent/live-production-trust-lease-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant source and tests
        shell: bash
        run: |
          set -euo pipefail
          echo '=== trust-state files ==='
          find crates/windows-production-trust-state-runtime -maxdepth 3 -type f | sort
          echo '=== identity proof references ==='
          grep -RIn "DeployedProductionSignerIdentityProof\|ProductionSignerIdentityChallenge\|prove_identity" crates apps/desktop/src-tauri/src | head -n 300 || true
          echo '=== capability draft helpers ==='
          grep -RIn "fn capability_draft\|CapabilityTokenDraft" crates/backend-issuance-runtime apps/desktop/src-tauri/src | head -n 300 || true
          echo '=== trust snapshot helpers ==='
          grep -RIn "GovernedProductionSignerTrustSnapshot\|ProductionSignerTrustSnapshot" crates | head -n 300 || true
