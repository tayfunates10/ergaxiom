name: Key governance and release evidence

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/key-governance-runtime/**"
      - "crates/governed-verification-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/attestation-runtime/**"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/src-tauri/**"
      - "professions/**"
      - "examples/work-contracts/**"
      - "schemas/**"
      - "tools/validate_foundation.py"
      - "tools/validate_schema_catalog.py"
      - "tools/scaffold_profession.py"
      - "tools/release/**"
      - "tools/windows/controlled_trust_gate.py"
      - "docs/architecture/36-key-governance-and-release-evidence.md"
      - "docs/release-readiness.md"
      - "docs/status.md"
      - "docs/roadmap.md"
      - ".github/workflows/key-governance-release-evidence.yml"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/key-governance-runtime/**"
      - "crates/governed-verification-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/attestation-runtime/**"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/src-tauri/**"
      - "professions/**"
      - "examples/work-contracts/**"
      - "schemas/**"
      - "tools/validate_foundation.py"
      - "tools/validate_schema_catalog.py"
      - "tools/scaffold_profession.py"
      - "tools/release/**"
      - "tools/windows/controlled_trust_gate.py"
      - "docs/architecture/36-key-governance-and-release-evidence.md"
      - "docs/release-readiness.md"
      - "docs/status.md"
      - "docs/roadmap.md"
      - ".github/workflows/key-governance-release-evidence.yml"

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  rustsec:
    name: Reject vulnerable Rust dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reject stale or inconsistent Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Audit Cargo.lock against the RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  governance:
    name: Verify governed issuer roles rotation and revocation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint governed verification runtimes
        run: >-
          cargo clippy
          -p ergaxiom-key-governance-runtime
          -p ergaxiom-governed-verification-runtime
          -p ergaxiom-capability-runtime
          -p ergaxiom-attestation-runtime
          --all-targets --all-features -- -D warnings

      - name: Run governance and verifier attack tests
        run: >-
          cargo test
          -p ergaxiom-key-governance-runtime
          -p ergaxiom-governed-verification-runtime
          -p ergaxiom-capability-runtime
          -p ergaxiom-attestation-runtime

  deterministic-evidence:
    name: Reproduce SPDX manifest and checksums
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject source identity substitution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Reject whitespace errors in the exact change set
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_COMMIT:-}" ]; then
            git cat-file -e "${BASE_COMMIT}^{commit}"
            git diff --check "$BASE_COMMIT...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate foundation and Python tooling
        run: |
          python tools/validate_schema_catalog.py
          python tools/validate_foundation.py
          python -m unittest \
            tools.test_validate_foundation \
            tools.test_scaffold_profession \
            tools.release.test_generate_release_evidence \
            tools.release.test_bind_controlled_trust_gate
          python -m compileall -q tools

      - name: Generate identical evidence twice
        shell: bash
        run: |
          set -euo pipefail
          printf 'ergaxiom deterministic unsigned candidate\n' > "$RUNNER_TEMP/ergaxiom-desktop.exe"
          python tools/release/generate_release_evidence.py \
            --repo-root . \
            --artifact "$RUNNER_TEMP/ergaxiom-desktop.exe" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir "$RUNNER_TEMP/evidence-a"
          python tools/release/bind_controlled_trust_gate.py \
            --manifest "$RUNNER_TEMP/evidence-a/ergaxiom-release-manifest.json" \
            --output "$RUNNER_TEMP/evidence-a/ergaxiom-release-manifest.json" \
            --checksums "$RUNNER_TEMP/evidence-a/SHA256SUMS"
          python tools/release/generate_release_evidence.py \
            --repo-root . \
            --artifact "$RUNNER_TEMP/ergaxiom-desktop.exe" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir "$RUNNER_TEMP/evidence-b"
          python tools/release/bind_controlled_trust_gate.py \
            --manifest "$RUNNER_TEMP/evidence-b/ergaxiom-release-manifest.json" \
            --output "$RUNNER_TEMP/evidence-b/ergaxiom-release-manifest.json" \
            --checksums "$RUNNER_TEMP/evidence-b/SHA256SUMS"
          diff -ru "$RUNNER_TEMP/evidence-a" "$RUNNER_TEMP/evidence-b"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "evidence-a" / "ergaxiom-release-manifest.json")
              .read_text(encoding="utf-8")
          )
          if manifest["source"]["commit"] != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("release manifest source commit does not match exact checkout")
          if manifest["release_eligible"] is not False:
              raise SystemExit("unsigned candidate was incorrectly marked release eligible")
          hardware = manifest.get("hardware_operational", {})
          if hardware.get("status") != "UNKNOWN" or hardware.get("eligible") is not False:
              raise SystemExit("hosted evidence incorrectly proved the hardware-operational gate")
          if "CONTROLLED_WINDOWS_HARDWARE_OPERATIONAL_GATE_NOT_PROVEN" not in manifest["blocking_reasons"]:
              raise SystemExit("hardware-operational release blocker is missing")
          PY

      - name: Upload deterministic release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-deterministic-release-evidence
          path: ${{ runner.temp }}/evidence-a/**
          if-no-files-found: error
          retention-days: 14

  windows-candidate:
    name: Build unsigned Windows candidate and bind release evidence
    runs-on: windows-2025
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Reject source identity substitution
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "$env:SOURCE_COMMIT") {
            throw "Checked out $actual but release evidence is labeled $env:SOURCE_COMMIT"
          }

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reject stale or inconsistent Cargo.lock
        run: cargo metadata --locked --format-version 1 > $null

      - name: Install pinned desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Reject high-severity desktop dependency vulnerabilities
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Run desktop trust-boundary tests
        working-directory: apps/desktop
        run: npm test

      - name: Build desktop renderer
        working-directory: apps/desktop
        run: npm run build

      - name: Compile Windows candidate without signing or bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle

      - name: Isolate byte-identical Windows release candidate
        shell: pwsh
        run: |
          $builtCandidate = "apps/desktop/src-tauri/target/release/ergaxiom-desktop.exe"
          $releaseCandidate = Join-Path $env:RUNNER_TEMP "ergaxiom-desktop.exe"
          Copy-Item -LiteralPath $builtCandidate -Destination $releaseCandidate -Force
          $builtHash = (Get-FileHash -LiteralPath $builtCandidate -Algorithm SHA256).Hash
          $releaseHash = (Get-FileHash -LiteralPath $releaseCandidate -Algorithm SHA256).Hash
          if ($builtHash -ne $releaseHash) {
            throw "Isolated release candidate copy changed bytes"
          }

      - name: Generate fail-closed candidate evidence
        shell: pwsh
        run: |
          $rustcVersion = (rustc --version).Trim()
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          $releaseCandidate = Join-Path $env:RUNNER_TEMP "ergaxiom-desktop.exe"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "release-evidence"
          python tools/release/generate_release_evidence.py `
            --repo-root . `
            --artifact "$releaseCandidate" `
            --source-commit "$env:SOURCE_COMMIT" `
            --rustc-version "$rustcVersion" `
            --node-version "$nodeVersion" `
            --npm-version "$npmVersion" `
            --output-dir "$evidenceRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release/bind_controlled_trust_gate.py `
            --manifest "$evidenceRoot\ergaxiom-release-manifest.json" `
            --output "$evidenceRoot\ergaxiom-release-manifest.json" `
            --checksums "$evidenceRoot\SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content "$evidenceRoot\ergaxiom-release-manifest.json" | ConvertFrom-Json
          if ($manifest.source.commit -ne "$env:SOURCE_COMMIT") {
            throw "Release manifest source commit does not match exact checkout"
          }
          if ($manifest.release_eligible -ne $false) {
            throw "Unsigned Windows candidate was incorrectly marked release eligible"
          }
          if ($manifest.hardware_operational.status -ne "UNKNOWN" -or $manifest.hardware_operational.eligible -ne $false) {
            throw "Hosted Windows candidate was incorrectly marked hardware-operational eligible"
          }
          if ($manifest.blocking_reasons -notcontains "CONTROLLED_WINDOWS_HARDWARE_OPERATIONAL_GATE_NOT_PROVEN") {
            throw "Controlled Windows hardware-operational blocker is missing"
          }

      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-windows-unsigned-governed-candidate
          path: ${{ runner.temp }}/ergaxiom-desktop.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-windows-release-evidence
          path: ${{ runner.temp }}/release-evidence/**
          if-no-files-found: error
          retention-days: 14
