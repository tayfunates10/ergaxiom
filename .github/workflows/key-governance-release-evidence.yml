name: Key governance and release evidence

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/key-governance-runtime/**"
      - "crates/governed-verification-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/attestation-runtime/**"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/src-tauri/**"
      - "professions/**"
      - "examples/work-contracts/**"
      - "schemas/**"
      - "tools/validate_foundation.py"
      - "tools/validate_schema_catalog.py"
      - "tools/scaffold_profession.py"
      - "tools/release/**"
      - "docs/architecture/36-key-governance-and-release-evidence.md"
      - "docs/release-readiness.md"
      - "docs/status.md"
      - "docs/roadmap.md"
      - ".github/workflows/key-governance-release-evidence.yml"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/key-governance-runtime/**"
      - "crates/governed-verification-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/attestation-runtime/**"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/src-tauri/**"
      - "professions/**"
      - "examples/work-contracts/**"
      - "schemas/**"
      - "tools/validate_foundation.py"
      - "tools/validate_schema_catalog.py"
      - "tools/scaffold_profession.py"
      - "tools/release/**"
      - "docs/architecture/36-key-governance-and-release-evidence.md"
      - "docs/release-readiness.md"
      - "docs/status.md"
      - "docs/roadmap.md"
      - ".github/workflows/key-governance-release-evidence.yml"

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  rustsec:
    name: Reject vulnerable Rust dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reject stale or inconsistent Cargo.lock
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Audit Cargo.lock against the RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  governance:
    name: Verify governed issuer roles rotation and revocation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint governed verification runtimes
        run: >-
          cargo clippy
          -p ergaxiom-key-governance-runtime
          -p ergaxiom-governed-verification-runtime
          -p ergaxiom-capability-runtime
          -p ergaxiom-attestation-runtime
          --all-targets --all-features -- -D warnings

      - name: Run governance and verifier attack tests
        run: >-
          cargo test
          -p ergaxiom-key-governance-runtime
          -p ergaxiom-governed-verification-runtime
          -p ergaxiom-capability-runtime
          -p ergaxiom-attestation-runtime

  deterministic-evidence:
    name: Reproduce SPDX manifest and checksums
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Reject source identity substitution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release evidence unit tests
        run: python -m unittest tools/release/test_generate_release_evidence.py

      - name: Generate identical evidence twice
        shell: bash
        run: |
          set -euo pipefail
          printf 'ergaxiom deterministic unsigned candidate\n' > "$RUNNER_TEMP/ergaxiom-desktop.exe"
          python tools/release/generate_release_evidence.py \
            --repo-root . \
            --artifact "$RUNNER_TEMP/ergaxiom-desktop.exe" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir "$RUNNER_TEMP/evidence-a"
          python tools/release/generate_release_evidence.py \
            --repo-root . \
            --artifact "$RUNNER_TEMP/ergaxiom-desktop.exe" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir "$RUNNER_TEMP/evidence-b"
          diff -ru "$RUNNER_TEMP/evidence-a" "$RUNNER_TEMP/evidence-b"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "evidence-a" / "ergaxiom-release-manifest.json")
              .read_text(encoding="utf-8")
          )
          if manifest["source"]["commit"] != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("release manifest source commit does not match exact checkout")
          if manifest["release_eligible"] is not False:
              raise SystemExit("unsigned candidate was incorrectly marked release eligible")
          PY

      - name: Upload deterministic release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-deterministic-release-evidence
          path: ${{ runner.temp }}/evidence-a/**
          if-no-files-found: error
          retention-days: 14

  windows-candidate:
    name: Build unsigned Windows candidate and bind release evidence
    runs-on: windows-2025
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Reject source identity substitution
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "$env:SOURCE_COMMIT") {
            throw "Checked out $actual but release evidence is labeled $env:SOURCE_COMMIT"
          }

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reject stale or inconsistent Cargo.lock
        run: cargo metadata --locked --format-version 1 --no-deps > $null

      - name: Install pinned desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Reject high-severity desktop dependency vulnerabilities
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Compile Windows candidate without signing or bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle

      - name: Generate fail-closed candidate evidence
        shell: pwsh
        run: |
          $rustcVersion = (rustc --version).Trim()
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          python tools/release/generate_release_evidence.py `
            --repo-root . `
            --artifact apps/desktop/src-tauri/target/release/ergaxiom-desktop.exe `
            --source-commit "$env:SOURCE_COMMIT" `
            --rustc-version "$rustcVersion" `
            --node-version "$nodeVersion" `
            --npm-version "$npmVersion" `
            --output-dir "$env:RUNNER_TEMP\release-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content "$env:RUNNER_TEMP\release-evidence\ergaxiom-release-manifest.json" | ConvertFrom-Json
          if ($manifest.source.commit -ne "$env:SOURCE_COMMIT") {
            throw "Release manifest source commit does not match exact checkout"
          }
          if ($manifest.release_eligible -ne $false) {
            throw "Unsigned Windows candidate was incorrectly marked release eligible"
          }

      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-windows-unsigned-governed-candidate
          path: apps/desktop/src-tauri/target/release/ergaxiom-desktop.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ergaxiom-windows-release-evidence
          path: ${{ runner.temp }}/release-evidence/**
          if-no-files-found: error
          retention-days: 14

  ai1-lock-repair:
    name: Materialize RustSec-safe Cargo.lock
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/release-readiness-profession-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve only the security-patched dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p quick-xml --precise 0.41.0
          cargo update -p lopdf --precise 0.42.0
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --check -- Cargo.lock

      - name: Commit resolver output to this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "ergaxiom-ai1-lock-repair"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update Cargo.lock for RustSec fixes"
          git push origin HEAD:${GITHUB_HEAD_REF}
