name: One-shot governance diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-governance-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/key-governance-release-evidence-v1

      - name: Capture governed runtime diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --all
          printf '%s\n' "$?" > "$RUNNER_TEMP/governance-format.status"
          cargo check -p ergaxiom-key-governance-runtime -p ergaxiom-governed-verification-runtime --all-targets > "$RUNNER_TEMP/governance-check.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/governance-check.status"
          cargo test -p ergaxiom-key-governance-runtime -p ergaxiom-governed-verification-runtime -p ergaxiom-capability-runtime -p ergaxiom-attestation-runtime > "$RUNNER_TEMP/governance-test.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/governance-test.status"
          cargo clippy -p ergaxiom-key-governance-runtime -p ergaxiom-governed-verification-runtime -p ergaxiom-capability-runtime -p ergaxiom-attestation-runtime --all-targets --all-features -- -D warnings > "$RUNNER_TEMP/governance-clippy.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/governance-clippy.status"
          python -m unittest tools/release/test_generate_release_evidence.py > "$RUNNER_TEMP/governance-python.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/governance-python.status"
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: governed-runtime-diagnostics
          path: ${{ runner.temp }}/governance-*
          if-no-files-found: error
          retention-days: 3
