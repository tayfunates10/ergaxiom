name: One-shot print transparency diagnostics

on:
  push:
    branches:
      - agent/print-ready-poster-preflight-certified-path-v1
    paths:
      - ".github/workflows/one-shot-print-transparency-diagnostics.yml"

permissions:
  contents: write

jobs:
  apply-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/print-ready-poster-preflight-certified-path-v1
          fetch-depth: 0

      - name: Add bounded diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/print-ready-poster-preflight-certified-path-runtime/src/pdf.rs')
          text = path.read_text(encoding='utf-8')
          old = (
              '    let transparency_absent = !malformed_graphics_state_operator\n'
              '        && resources_transparency_safe(&document, resources, &used_graphics_states, &allowed)?\n'
              '        && document_transparency_groups_safe(&document, &allowed)?;\n'
          )
          new = (
              '    let resources_safe =\n'
              '        resources_transparency_safe(&document, resources, &used_graphics_states, &allowed)?;\n'
              '    let groups_safe = document_transparency_groups_safe(&document, &allowed)?;\n'
              '    eprintln!(\n'
              '        "print PDF transparency diagnostics: malformed_gs={malformed_graphics_state_operator} resources_safe={resources_safe} groups_safe={groups_safe} used_gs={used_graphics_states:?} resources={resources:?}"\n'
              '    );\n'
              '    let transparency_absent =\n'
              '        !malformed_graphics_state_operator && resources_safe && groups_safe;\n'
          )
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('transparency diagnostic insertion point did not match')
          PY

          cargo fmt --all
          if git diff --quiet -- crates/print-ready-poster-preflight-certified-path-runtime/src/pdf.rs; then
            echo "Transparency diagnostics already applied"
            exit 0
          fi

          git config user.name "ergaxiom-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add crates/print-ready-poster-preflight-certified-path-runtime/src/pdf.rs
          git diff --cached --check
          git commit -m "Diagnose print PDF transparency subchecks"
          git push origin HEAD:agent/print-ready-poster-preflight-certified-path-v1
