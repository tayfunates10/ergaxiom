name: Tauri production startup

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/backend-issuance-runtime/**"
      - "crates/windows-production-signer-host-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "docs/architecture/47-tauri-production-startup-boundary.md"
      - ".github/workflows/tauri-production-startup.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "crates/backend-issuance-runtime/**"
      - "crates/windows-production-signer-host-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "docs/architecture/47-tauri-production-startup-boundary.md"
      - ".github/workflows/tauri-production-startup.yml"

permissions:
  contents: write

jobs:
  repair-rust185-inkscape-source:
    name: One-shot Rust 1.85 Inkscape source repair
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rust-1-85-inkscape-let-chains
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Rewrite unsupported let chains without changing semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/inkscape-adapter-runtime/src/operators.rs')
          text = path.read_text()

          start_old = '''                if let Some(expected_parent) = parent_id
                    && element_id(&start, reader.decoder())?.as_deref() == Some(expected_parent)
                {
                    target_count += 1;
                    if target_count > 1 {
                        return Err(InkscapeAdapterError::DuplicateElementId(
                            expected_parent.to_owned(),
                        )
                        .into());
                    }
                    target_depth = Some(current_depth);
                }
'''
          start_new = '''                if let Some(expected_parent) = parent_id {
                    if element_id(&start, reader.decoder())?.as_deref() == Some(expected_parent) {
                        target_count += 1;
                        if target_count > 1 {
                            return Err(InkscapeAdapterError::DuplicateElementId(
                                expected_parent.to_owned(),
                            )
                            .into());
                        }
                        target_depth = Some(current_depth);
                    }
                }
'''

          empty_old = '''                if let Some(expected_parent) = parent_id
                    && element_id(&empty, reader.decoder())?.as_deref() == Some(expected_parent)
                {
                    return Err(ProofBoundOperatorError::InvalidLayer(
                        expected_parent.to_owned(),
                    ));
                }
'''
          empty_new = '''                if let Some(expected_parent) = parent_id {
                    if element_id(&empty, reader.decoder())?.as_deref() == Some(expected_parent) {
                        return Err(ProofBoundOperatorError::InvalidLayer(
                            expected_parent.to_owned(),
                        ));
                    }
                }
'''

          attrs_old = '''                if let Some(id) = id
                    && let Some(attribute_changes) = changes.get(&id)
                {
'''
          attrs_new = '''                if let Some(id) = id {
                    if let Some(attribute_changes) = changes.get(&id) {
'''
          attrs_else_old = '''                    write_tag(&mut writer, &name, &updated, false)?;
                } else {
                    writer
                        .write_event(Event::Start(start.into_owned()))
                        .map_err(|error| InkscapeAdapterError::Xml(error.to_string()))?;
                }
'''
          attrs_else_new = '''                    write_tag(&mut writer, &name, &updated, false)?;
                    } else {
                        writer
                            .write_event(Event::Start(start.into_owned()))
                            .map_err(|error| InkscapeAdapterError::Xml(error.to_string()))?;
                    }
                } else {
                    writer
                        .write_event(Event::Start(start.into_owned()))
                        .map_err(|error| InkscapeAdapterError::Xml(error.to_string()))?;
                }
'''
          empty_attrs_else_old = '''                    write_tag(&mut writer, &name, &updated, true)?;
                } else {
                    writer
                        .write_event(Event::Empty(empty.into_owned()))
                        .map_err(|error| InkscapeAdapterError::Xml(error.to_string()))?;
                }
'''
          empty_attrs_else_new = '''                    write_tag(&mut writer, &name, &updated, true)?;
                    } else {
                        writer
                            .write_event(Event::Empty(empty.into_owned()))
                            .map_err(|error| InkscapeAdapterError::Xml(error.to_string()))?;
                    }
                } else {
                    writer
                        .write_event(Event::Empty(empty.into_owned()))
                        .map_err(|error| InkscapeAdapterError::Xml(error.to_string()))?;
                }
'''

          replacements = [
              (start_old, start_new, 1),
              (empty_old, empty_new, 1),
              (attrs_old, attrs_new, 2),
              (attrs_else_old, attrs_else_new, 1),
              (empty_attrs_else_old, empty_attrs_else_new, 1),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'expected {expected} exact matches, found {actual}')
              text = text.replace(old, new, expected)

          path.write_text(text)
          PY
          cargo +1.85.0 fmt --package ergaxiom-inkscape-adapter-runtime
          test "$(git diff --name-only)" = "crates/inkscape-adapter-runtime/src/operators.rs"
          git diff --check
      - name: Commit exact source repair
        shell: bash
        run: |
          git config user.name "ergaxiom-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add crates/inkscape-adapter-runtime/src/operators.rs
          git commit -m "fix: keep Inkscape operators compatible with Rust 1.85"
          git push origin HEAD:fix/rust-1-85-inkscape-let-chains

  startup-boundary:
    name: Verify Tauri production startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Check Tauri formatting
        run: cargo +1.85.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint production startup boundary
        shell: bash
        run: |
          set -o pipefail
          cargo +1.85.0 clippy \
            --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-targets \
            --all-features \
            -- \
            -D warnings 2>&1 | tee "$RUNNER_TEMP/tauri-production-startup-clippy.log"

      - name: Upload startup lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-production-startup-clippy-${{ matrix.os }}
          path: ${{ runner.temp }}/tauri-production-startup-clippy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run production startup attacks
        shell: bash
        run: |
          set -o pipefail
          cargo +1.85.0 test \
            --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-targets \
            production_startup::tests \
            -- \
            --nocapture 2>&1 | tee "$RUNNER_TEMP/tauri-production-startup-tests.log"

      - name: Upload startup test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-production-startup-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/tauri-production-startup-tests.log
          if-no-files-found: warn
          retention-days: 7
