name: Tauri production startup

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/backend-issuance-runtime/**"
      - "crates/windows-production-signer-host-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "docs/architecture/47-tauri-production-startup-boundary.md"
      - ".github/workflows/tauri-production-startup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Refresh Tauri lockfile
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-production-capability-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh and validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets production_startup::tests -- --nocapture

      - name: Commit validated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Tauri lockfile for persistent Capability authority"
          git push origin HEAD:agent/persistent-production-capability-v1

  startup-boundary:
    name: Verify Tauri production startup (${{ matrix.os }})
    needs: refresh-lockfile
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-production-capability-v1

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint production startup boundary
        shell: bash
        run: |
          set -o pipefail
          cargo clippy \
            --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-targets \
            --all-features \
            -- \
            -D warnings 2>&1 | tee "$RUNNER_TEMP/tauri-production-startup-clippy.log"

      - name: Upload startup lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-production-startup-clippy-${{ matrix.os }}
          path: ${{ runner.temp }}/tauri-production-startup-clippy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run production startup attacks
        shell: bash
        run: |
          set -o pipefail
          cargo test \
            --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-targets \
            production_startup::tests \
            -- \
            --nocapture 2>&1 | tee "$RUNNER_TEMP/tauri-production-startup-tests.log"

      - name: Upload startup test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-production-startup-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/tauri-production-startup-tests.log
          if-no-files-found: warn
          retention-days: 7
