name: Sync Tauri production ACL gate

on:
  push:
    branches:
      - agent/tauri-production-acl-gate-v1
  pull_request:
    paths:
      - "crates/windows-production-signer-host-runtime/**"
      - "apps/desktop/**"
      - "docs/architecture/48-tauri-production-acl-gate.md"
      - ".github/workflows/sync-tauri-production-acl-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tauri-production-acl-gate-v1
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply ACL startup gate
        shell: python
        run: |
          from pathlib import Path

          lib = Path("crates/windows-production-signer-host-runtime/src/lib.rs")
          text = lib.read_text()
          if "mod protected_path;" not in text:
              text = text.replace(
                  "#[cfg(test)]\nmod tests;\n",
                  "#[cfg(test)]\nmod tests;\nmod protected_path;\n",
                  1,
              )
          if "validate_administrator_controlled_directory" not in text:
              text = text.replace(
                  "use thiserror::Error;\n",
                  "use thiserror::Error;\n\npub use protected_path::{\n    validate_administrator_controlled_directory, validate_administrator_controlled_file,\n};\n",
                  1,
              )
          marker = '''    #[error("production signer service SCM operation failed: {0}")]
              WindowsService(#[source] std::io::Error),'''
          replacement = '''    #[error("administrator-controlled production path parent is unavailable")]
              AdministratorControlledParentUnavailable,
              #[error("administrator-controlled production path type does not match")]
              AdministratorControlledPathTypeMismatch,
              #[error("administrator-controlled production path owner was rejected")]
              AdministratorControlledOwnerRejected,
              #[error("administrator-controlled production path DACL is missing")]
              AdministratorControlledDaclMissing,
              #[error("administrator-controlled production path DACL is not protected")]
              AdministratorControlledDaclNotProtected,
              #[error("administrator-controlled production path contains an unsupported ACE")]
              AdministratorControlledAceUnsupported,
              #[error("administrator-controlled production path grants mutating access to a non-administrator")]
              AdministratorControlledWriteAccessRejected,
              #[error("administrator-controlled production path contains an invalid SID")]
              AdministratorControlledSidInvalid,
              #[error("production signer Windows security operation failed: {0}")]
              WindowsSecurity(#[source] std::io::Error),
              #[error("production signer service SCM operation failed: {0}")]
              WindowsService(#[source] std::io::Error),'''
          if "AdministratorControlledParentUnavailable" not in text:
              if marker not in text:
                  raise SystemExit("host error insertion marker missing")
              text = text.replace(marker, replacement, 1)
          lib.write_text(text)

          startup = Path("apps/desktop/src-tauri/src/production_startup.rs")
          text = startup.read_text()
          text = text.replace(
              "use ergaxiom_windows_production_signer_host_runtime::ProductionSignerPipeClient;",
              '''use ergaxiom_windows_production_signer_host_runtime::{
              ProductionSignerPipeClient, validate_administrator_controlled_directory,
              validate_administrator_controlled_file,
          };''',
              1,
          )
          text = text.replace(
              "    pub configuration_verified: bool;\n    pub pipe_clients_initialized: bool;",
              "    pub configuration_verified: bool;\n    pub configuration_acl_verified: bool;\n    pub pipe_clients_initialized: bool;",
              1,
          )
          marker = '''        let Ok(expected_manifest_digest) = read_stable_manifest_pin(&pin_path) else {'''
          replacement = '''        if validate_administrator_controlled_file(&manifest_path).is_err()
                  || validate_administrator_controlled_file(&pin_path).is_err()
              {
                  return Self::without_runtime(status_without_configuration(
                      ProductionSignerStartupPhase::Rejected,
                      "production_configuration_acl_rejected",
                  ));
              }
              let Ok(expected_manifest_digest) = read_stable_manifest_pin(&pin_path) else {'''
          if "production_configuration_acl_rejected" not in text:
              if marker not in text:
                  raise SystemExit("startup ACL marker missing")
              text = text.replace(marker, replacement, 1)
          marker = '''        let Ok(trusted_now_epoch_s) = current_epoch_s() else {'''
          replacement = '''        if validate_administrator_controlled_file(&current_executable).is_err() {
                  return Self::without_runtime(status_without_configuration(
                      ProductionSignerStartupPhase::Rejected,
                      "production_backend_acl_rejected",
                  ));
              }
              let Ok(trusted_now_epoch_s) = current_epoch_s() else {'''
          if "production_backend_acl_rejected" not in text:
              text = text.replace(marker, replacement, 1)
          marker = '''        let runtime = ProductionStartupRuntime::new(deployment);'''
          replacement = '''        if validate_loaded_configuration_acl(&deployment).is_err() {
                  return Self::without_runtime(status_without_configuration(
                      ProductionSignerStartupPhase::Rejected,
                      "production_signer_configuration_acl_rejected",
                  ));
              }

              let runtime = ProductionStartupRuntime::new(deployment);'''
          if "production_signer_configuration_acl_rejected" not in text:
              text = text.replace(marker, replacement, 1)
          text = text.replace(
              "        configuration_verified: true,\n        pipe_clients_initialized,",
              "        configuration_verified: true,\n        configuration_acl_verified: true,\n        pipe_clients_initialized,",
              1,
          )
          text = text.replace(
              "        configuration_verified: false,\n        pipe_clients_initialized: false,",
              "        configuration_verified: false,\n        configuration_acl_verified: false,\n        pipe_clients_initialized: false,",
              1,
          )
          marker = '''fn fixed_absolute_path(value: &str) -> Option<PathBuf> {'''
          helper = '''fn validate_loaded_configuration_acl(
              deployment: &LoadedBackendProductionDeployment,
          ) -> Result<(), ()> {
              let signer_manifest = &deployment.signer.manifest;
              for path in [
                  deployment.manifest.signer_service_manifest_path.as_str(),
                  signer_manifest.executable_path.as_str(),
                  signer_manifest.governance_policy_path.as_str(),
                  signer_manifest.caller_allowlist_path.as_str(),
                  signer_manifest.deployment_policy_path.as_str(),
              ] {
                  validate_administrator_controlled_file(Path::new(path)).map_err(|_| ())?;
              }
              validate_administrator_controlled_directory(Path::new(
                  &signer_manifest.trust_store_root,
              ))
              .map_err(|_| ())
          }

          fn fixed_absolute_path(value: &str) -> Option<PathBuf> {'''
          if "fn validate_loaded_configuration_acl" not in text:
              text = text.replace(marker, helper, 1)
          text = text.replace(
              "        assert!(status.configuration_verified);\n        assert!(status.pipe_clients_initialized);",
              "        assert!(status.configuration_verified);\n        assert!(status.configuration_acl_verified);\n        assert!(status.pipe_clients_initialized);",
              1,
          )
          text = text.replace(
              "        assert!(!status.configuration_verified);\n        assert!(!status.pipe_clients_initialized);",
              "        assert!(!status.configuration_verified);\n        assert!(!status.configuration_acl_verified);\n        assert!(!status.pipe_clients_initialized);",
              1,
          )
          startup.write_text(text)

          types = Path("apps/desktop/src/types.ts")
          text = types.read_text().replace(
              "  configuration_verified: boolean;\n  pipe_clients_initialized: boolean;",
              "  configuration_verified: boolean;\n  configuration_acl_verified: boolean;\n  pipe_clients_initialized: boolean;",
              1,
          )
          types.write_text(text)

          tests = Path("crates/windows-production-signer-host-runtime/src/tests.rs")
          text = tests.read_text().replace(
              '''    assert!(matches!(
                  uninstall_service(path),
                  Err(ProductionSignerHostError::UnsupportedPlatform)
              ));''',
              '''    assert!(matches!(
                  uninstall_service(path),
                  Err(ProductionSignerHostError::UnsupportedPlatform)
              ));
              assert!(matches!(
                  validate_administrator_controlled_file(path),
                  Err(ProductionSignerHostError::UnsupportedPlatform)
              ));
              assert!(matches!(
                  validate_administrator_controlled_directory(path),
                  Err(ProductionSignerHostError::UnsupportedPlatform)
              ));''',
              1,
          )
          tests.write_text(text)

          doc = Path("docs/architecture/48-tauri-production-acl-gate.md")
          doc.write_text('''# Tauri Production ACL Gate

          ## Status

          This gate extends the pinned Tauri production startup boundary with independent Windows owner and DACL verification. It does not enable production issuance.

          ## Protected inputs

          Before any production configuration is accepted, the backend verifies:

          - the backend deployment manifest and external digest pin;
          - the running desktop executable;
          - the signer service manifest and executable;
          - the governance policy, caller allowlist and deployment policy; and
          - the production trust-store root.

          Each file or directory and its immediate parent must be an absolute, existing, non-reparse path. The owner must be LocalSystem (`S-1-5-18`) or Builtin Administrators (`S-1-5-32-544`). The DACL must be protected from inheritance. Standard allow ACEs may grant read or execute access to other principals, but any write, append, child creation, deletion, DACL change, owner change, generic write, generic all or maximum-allowed grant is accepted only for LocalSystem or Builtin Administrators. Unknown ACE layouts fail closed.

          ## Renderer boundary

          The renderer receives only the boolean `configuration_acl_verified` and bounded public status codes. It receives no owner SID, ACE, filesystem path or security descriptor.

          ## Failure behavior

          A missing, malformed, reparse, user-owned, inheritance-enabled or user-writable path leaves `production_issuance_enabled` false and reports one of these bounded states:

          - `production_configuration_acl_rejected`;
          - `production_backend_acl_rejected`; or
          - `production_signer_configuration_acl_rejected`.

          ## Remaining gate

          ACL verification proves that the installed public configuration cannot be modified through an ordinary non-administrator file grant. It does not authenticate a live signer-service instance. The next slice must add a purpose-locked service identity proof that cannot be repurposed into arbitrary digest signing, then bind its trust-state and deployment identity to the already verified startup configuration.
          ''')

      - name: Refresh formatting and lockfiles
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate frontend boundary
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint ACL gate
        shell: pwsh
        run: |
          cargo clippy -p ergaxiom-windows-production-signer-host-runtime --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test ACL gate
        shell: pwsh
        run: |
          cargo test -p ergaxiom-windows-production-signer-host-runtime --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets production_startup::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated ACL gate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-host-runtime/src/lib.rs crates/windows-production-signer-host-runtime/src/protected_path.rs crates/windows-production-signer-host-runtime/src/tests.rs apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/production_startup.rs apps/desktop/src/types.ts docs/architecture/48-tauri-production-acl-gate.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Verify administrator-controlled production configuration paths"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/tauri-production-acl-gate-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
