name: Sync backend production manifest

on:
  push:
    branches:
      - agent/desktop-production-manifest-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-production-manifest-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Export deployment module and refresh lockfile
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/backend-issuance-runtime/src/lib.rs")
          text = path.read_text()
          if "mod deployment;" not in text:
              text = text.replace("mod production;\npub use production::*;", "mod deployment;\nmod production;\npub use deployment::*;\npub use production::*;", 1)
          path.write_text(text)
      - name: Check formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Lint backend production deployment
        run: cargo clippy -p ergaxiom-backend-issuance-runtime --all-targets --all-features -- -D warnings
      - name: Test backend production deployment
        run: cargo test -p ergaxiom-backend-issuance-runtime
      - name: Commit verified source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/backend-issuance-runtime/src/lib.rs crates/backend-issuance-runtime/src/deployment.rs crates/backend-issuance-runtime/Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Validate pinned backend production deployment"
          git push origin HEAD:agent/desktop-production-manifest-v1
