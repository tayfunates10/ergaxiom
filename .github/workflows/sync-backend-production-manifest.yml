name: Sync backend production manifest

on:
  push:
    branches:
      - agent/desktop-production-manifest-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-production-manifest-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair module integration and refresh lockfile
        shell: python
        run: |
          from pathlib import Path

          deployment_path = Path("crates/backend-issuance-runtime/src/deployment.rs")
          deployment = deployment_path.read_text()
          deployment = deployment.replace(
              "    PRODUCTION_KEY_TRUST_BINDING_SCHEMA, ProductionKeyGovernanceError,\n    ProductionKeyTrustBinding,\n",
              "    ProductionKeyGovernanceError, ProductionKeyTrustBinding,\n",
              1,
          )
          deployment = deployment.replace(
              "        signer.caller_allowlist.validate()?;\n        signer.deployment_policy.validate_seal()?;\n",
              "",
              1,
          )
          deployment = deployment.replace(
              "    file.by_ref().take(max_bytes + 1).read_to_end(&mut bytes)?;",
              "    Read::by_ref(&mut file)\n        .take(max_bytes + 1)\n        .read_to_end(&mut bytes)?;",
              1,
          )
          deployment = deployment.replace(
              "    use super::*;\n",
              "    use ergaxiom_windows_production_key_governance_runtime::PRODUCTION_KEY_TRUST_BINDING_SCHEMA;\n\n    use super::*;\n",
              1,
          )
          deployment_path.write_text(deployment)

          production_path = Path("crates/backend-issuance-runtime/src/production.rs")
          production = production_path.read_text()
          production = production.replace("use serde_json::Value;", "use serde_json::Value as JsonValue;", 1)
          production = production.replace("use thiserror::Error;", "use thiserror::Error as ThisError;", 1)
          production = production.replace("bundle_value: &Value,", "bundle_value: &JsonValue,", 1)
          production = production.replace("#[derive(Debug, Error)]\npub enum BackendProductionIssuanceError", "#[derive(Debug, ThisError)]\npub enum BackendProductionIssuanceError", 1)
          production_path.write_text(production)
      - name: Check formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Lint backend production deployment
        run: cargo clippy -p ergaxiom-backend-issuance-runtime --all-targets --all-features -- -D warnings
      - name: Test backend production deployment
        run: cargo test -p ergaxiom-backend-issuance-runtime
      - name: Commit verified source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/backend-issuance-runtime/src/deployment.rs crates/backend-issuance-runtime/src/production.rs crates/backend-issuance-runtime/Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Validate pinned backend production deployment"
          git push origin HEAD:agent/desktop-production-manifest-v1
