name: Sync persistent Capability Tauri lockfile

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "crates/backend-issuance-runtime/**"
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/sync-persistent-capability-tauri-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-production-capability-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh and validate Tauri lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets production_startup::tests -- --nocapture

      - name: Commit validated Tauri lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Tauri lockfile for persistent Capability authority"
          git push origin HEAD:agent/persistent-production-capability-v1
