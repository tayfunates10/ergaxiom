name: One-shot installation receipt fixture repair

on:
  push:
    branches:
      - agent/tpm-cng-signer-service-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'tayfunates10'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Make machine identity mutation real
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/windows-production-installation-evidence-runtime/src/tests.rs')
          source = path.read_text()
          old = '''fn receipt_machine_identity_mutation_without_review_fails_seal() {
              let mut receipt = valid_receipt();
              receipt.machine_identity_digest = DIGEST_E.to_owned();'''
          new = '''fn receipt_machine_identity_mutation_without_review_fails_seal() {
              let mut receipt = valid_receipt();
              receipt.machine_identity_digest = DIGEST_A.to_owned();'''
          if old not in source:
              raise SystemExit('expected no-op machine identity mutation fixture not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify corrected installation receipt fixture
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy \
            -p ergaxiom-windows-production-installation-evidence-runtime \
            --all-targets --all-features -- -D warnings
          cargo test \
            -p ergaxiom-windows-production-installation-evidence-runtime \
            --all-features -- --nocapture
      - name: Commit verified fixture repair and remove workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-fix-installation-receipt-mutation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-installation-evidence-runtime/src/tests.rs .github/workflows/temporary-fix-installation-receipt-mutation.yml
          git commit -m "Correct installation receipt mutation fixture"
          git push origin HEAD:agent/tpm-cng-signer-service-v1
