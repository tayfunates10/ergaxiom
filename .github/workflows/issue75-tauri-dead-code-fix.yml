name: Issue 75 Tauri Dead Code Fix

on:
  push:
    branches:
      - codex/issue-75
    paths:
      - .github/issue75_tauri_dead_code_fix.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Apply exact cleanup
        run: python3 .github/issue75_tauri_dead_code_fix.py
      - name: Format independent Tauri workspace
        run: cargo +1.85.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Strict Tauri clippy
        run: cargo +1.85.0 clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Tauri tests
        run: cargo +1.85.0 test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features
      - name: Commit verified source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/src/commands.rs apps/desktop/src-tauri/src/pipeline.rs
          git diff --cached --check
          git commit -m "issue75: remove obsolete synthetic desktop paths"
          git push origin HEAD:codex/issue-75
