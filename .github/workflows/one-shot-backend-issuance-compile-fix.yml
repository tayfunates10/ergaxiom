name: One-shot backend issuance compile fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/one-shot-backend-issuance-compile-fix.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-backend-issuance-compile-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/backend-authorized-issuance-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out backend issuance branch
        uses: actions/checkout@v4
        with:
          ref: agent/backend-authorized-issuance-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Map shell verification error and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/backend-issuance-runtime/src/lib.rs")
          source = path.read_text()
          old = "if !verify_desktop_shell_snapshot(snapshot)? {"
          new = "if !verify_desktop_shell_snapshot(snapshot).map_err(DesktopControlError::Shell)? {"
          if old not in source:
              raise SystemExit("expected snapshot verification expression not found")
          path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-backend-issuance-compile-fix.yml
          git add -A
          git commit -m "Fix backend snapshot error conversion"
          git push origin HEAD:agent/backend-authorized-issuance-v1
