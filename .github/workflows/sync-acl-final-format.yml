name: Sync ACL final format

on:
  push:
    branches:
      - agent/tauri-production-acl-gate-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tauri-production-acl-gate-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format ACL source
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit formatted source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-host-runtime/src/protected_path.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Format administrator-controlled ACL tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/tauri-production-acl-gate-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
