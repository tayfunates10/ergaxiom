name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-service/**"
      - "crates/windows-production-signer-host-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  diagnose-windows-service-host:
    name: Diagnose Windows production signer service host
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture Windows service host Clippy diagnostics
        shell: pwsh
        run: |
          cargo clippy `
            -p ergaxiom-windows-production-signer-host-runtime `
            -p ergaxiom-windows-production-signer-service `
            --all-targets --all-features -- -D warnings `
            *> windows-service-host-clippy.txt
          $code = $LASTEXITCODE
          Set-Content windows-service-host-clippy.exit $code
          exit 0

      - name: Upload Windows service host diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-host-clippy-diagnostics
          path: |
            windows-service-host-clippy.txt
            windows-service-host-clippy.exit

      - name: Fail on Windows service host lint mismatch
        shell: pwsh
        run: |
          if ((Get-Content windows-service-host-clippy.exit) -ne "0") { exit 1 }
