name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-provisioner/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-governed-issuance-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-provisioning-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  governed-generation-diagnostics:
    name: Diagnose governed P-256 generations
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture governed generation Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-governed-issuance-runtime \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            --all-targets --all-features -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/governed-generation-clippy.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/governed-generation-clippy.status"
          exit 0

      - name: Upload governed generation Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-generation-clippy-diagnostics
          path: ${{ runner.temp }}/governed-generation-clippy.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on governed generation lint mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/governed-generation-clippy.status")" = "0"

      - name: Capture governed generation tests
        if: success()
        shell: bash
        run: |
          set +e
          cargo test \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-governed-issuance-runtime \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            --all-features \
            2>&1 | tee "$RUNNER_TEMP/governed-generation-tests.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/governed-generation-tests.status"
          exit 0

      - name: Upload governed generation test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-generation-test-diagnostics
          path: ${{ runner.temp }}/governed-generation-tests.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail on governed generation test mismatch
        if: success()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/governed-generation-tests.status")" = "0"
