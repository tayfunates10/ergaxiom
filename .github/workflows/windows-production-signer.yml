name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  bind-production-trust-state:
    name: Bind hardware signatures to accepted production trust state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply signed trust-state request binding
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/trust-binding-patch.log"
          from pathlib import Path

          runtime_path = Path("crates/windows-production-signer-runtime/src/lib.rs")
          runtime = runtime_path.read_text()
          binding_start = runtime.index("pub struct SignerRequestBinding {")
          binding_end = runtime.index("\n}\n\nimpl SignerRequestBinding", binding_start)
          binding_struct = runtime[binding_start:binding_end]
          if "trust_state_binding_digest" not in binding_struct:
              field = "    pub key_policy_digest: String,"
              if field not in binding_struct:
                  raise RuntimeError("SignerRequestBinding key policy field missing")
              binding_struct = binding_struct.replace(
                  field,
                  field + "\n    #[serde(default, skip_serializing_if = \"Option::is_none\")]\n    pub trust_state_binding_digest: Option<String>,",
                  1,
              )
              runtime = runtime[:binding_start] + binding_struct + runtime[binding_end:]

          impl_start = runtime.index("impl SignerRequestBinding {")
          impl_end = runtime.index("\n}\n\n#[derive", impl_start)
          binding_impl = runtime[impl_start:impl_end]
          if "trust_state_binding_digest: None" not in binding_impl:
              field = "            key_policy_digest: policy.digest()?,"
              if field not in binding_impl:
                  raise RuntimeError("SignerRequestBinding constructor field missing")
              binding_impl = binding_impl.replace(
                  field,
                  field + "\n            trust_state_binding_digest: None,",
                  1,
              )
          if "pub fn build_with_trust_state(" not in binding_impl:
              validate_marker = binding_impl.index("\n    pub fn validate(&self)")
              method = '''

              pub fn build_with_trust_state(
                  request_digest: impl Into<String>,
                  caller: &AuthenticatedCallerIdentity,
                  service: &SignerServiceIdentity,
                  policy: &ProductionKeyPolicy,
                  trust_state_binding_digest: impl Into<String>,
              ) -> Result<Self, ProductionSignerError> {
                  let mut binding = Self::build(request_digest, caller, service, policy)?;
                  binding.trust_state_binding_digest = Some(trust_state_binding_digest.into());
                  binding.validate()?;
                  Ok(binding)
              }'''
              binding_impl = binding_impl[:validate_marker] + method + binding_impl[validate_marker:]
          if "if let Some(trust_state_binding_digest)" not in binding_impl:
              tail_start = binding_impl.index(
                  "        validate_sha256(&self.signer_service_identity_digest)?;"
              )
              tail_end = binding_impl.index("\n    }", tail_start)
              replacement = '''        validate_sha256(&self.signer_service_identity_digest)?;
              validate_sha256(&self.key_policy_digest)?;
              if let Some(trust_state_binding_digest) = &self.trust_state_binding_digest {
                  validate_sha256(trust_state_binding_digest)?;
              }
              Ok(())'''
              binding_impl = binding_impl[:tail_start] + replacement + binding_impl[tail_end:]
          runtime = runtime[:impl_start] + binding_impl + runtime[impl_end:]
          runtime_path.write_text(runtime)
          print("patched signer request binding")

          service_path = Path("crates/windows-production-signer-service-runtime/src/lib.rs")
          service = service_path.read_text()
          impl_start = service.index("impl<B> ProductionSignerService<B>")
          method_start = service.index("    pub fn handle_authenticated_generation(\n", impl_start)
          method_end = service.index("\n    pub fn validate_backend_generation", method_start)
          method_block = service[method_start:method_end]
          if "handle_authenticated_generation_with_trust_state" not in method_block:
              method_block = '''    pub fn handle_authenticated_generation(
                  &mut self,
                  request: &ProductionSignerRequest,
                  caller: &AuthenticatedCallerIdentity,
                  trusted_now_epoch_s: u64,
                  generation: u64,
              ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerServiceError> {
                  self.handle_authenticated_generation_with_trust_state(
                      request,
                      caller,
                      trusted_now_epoch_s,
                      generation,
                      None,
                  )
              }

              pub fn handle_authenticated_generation_with_trust_state(
                  &mut self,
                  request: &ProductionSignerRequest,
                  caller: &AuthenticatedCallerIdentity,
                  trusted_now_epoch_s: u64,
                  generation: u64,
                  trust_state_binding_digest: Option<&str>,
              ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerServiceError> {
                  if generation == 0 {
                      return Err(ProductionSignerServiceError::InvalidKeyGeneration);
                  }
                  let policy = policy_for_identity(&request.identity)?;
                  request.validate_for(&policy)?;
                  let request_digest = request.digest_for(&policy)?;

                  let caller_authorization = self.identity_authorizer.authorize(
                      caller,
                      &self.service_identity,
                      &self.allowlist,
                      &request_digest,
                      trusted_now_epoch_s,
                  )?;

                  let binding = if let Some(trust_state_binding_digest) = trust_state_binding_digest {
                      SignerRequestBinding::build_with_trust_state(
                          request_digest,
                          caller,
                          &self.service_identity,
                          &policy,
                          trust_state_binding_digest,
                      )?
                  } else {
                      SignerRequestBinding::build(
                          request_digest,
                          caller,
                          &self.service_identity,
                          &policy,
                      )?
                  };
                  let envelope = request.envelope(&policy, binding.clone())?;
                  let envelope_digest = envelope.digest_for(&policy)?;

                  let descriptor = self
                      .backend
                      .descriptor_for_generation(&policy, generation)?;
                  descriptor.validate_for(&policy)?;
                  let signature = self.backend.sign_sha256_digest_for_generation(
                      &policy,
                      generation,
                      &descriptor,
                      &binding,
                      &envelope_digest,
                  )?;
                  signature.validate_for(&descriptor, &binding)?;

                  let signer_response = ProductionSignerResponse::success(
                      request.request_id.clone(),
                      ProductionSignerSuccess {
                          descriptor,
                          envelope,
                          envelope_digest,
                          signature,
                      },
                  );
                  signer_response.verify_production_eligible(&policy)?;
                  let package = AuthorizedProductionSignerPackage {
                      caller_authorization,
                      signer_response,
                  };
                  package.verify(caller, &self.service_identity, &self.allowlist)?;
                  Ok(package)
              }
          '''
              service = service[:method_start] + method_block + service[method_end:]
          service_path.write_text(service)
          print("patched signer service")

          deployed_path = Path("crates/windows-production-trust-state-runtime/src/service.rs")
          deployed = deployed_path.read_text()
          if "SignedTrustStateBindingMismatch" not in deployed:
              verify_start = deployed.index("        let envelope = self.signer_package.verify_governed(")
              package_digest_marker = deployed.index(
                  "        if self.package_digest != self.expected_digest()?",
                  verify_start,
              )
              verification = '''        if envelope.binding.trust_state_binding_digest.as_deref()
                  != Some(accepted.binding().binding_digest.as_str())
              {
                  return Err(DeployedProductionSignerError::SignedTrustStateBindingMismatch);
              }
          '''
              deployed = deployed[:package_digest_marker] + verification + deployed[package_digest_marker:]

              call_start = deployed.index(
                  "        let signer_package = self.inner.handle_authenticated_generation("
              )
              call_end = deployed.index("        )?;", call_start) + len("        )?;")
              new_call = '''        let signer_package = self.inner.handle_authenticated_generation_with_trust_state(
                  request,
                  caller,
                  trusted_now_epoch_s,
                  record.generation,
                  Some(&self.accepted.binding().binding_digest),
              )?;'''
              deployed = deployed[:call_start] + new_call + deployed[call_end:]

              variant = "    KeyGenerationMismatch,"
              variant_index = deployed.index(variant) + len(variant)
              error = '''
              #[error("hardware-signed request does not bind the accepted production trust state")]
              SignedTrustStateBindingMismatch,'''
              deployed = deployed[:variant_index] + error + deployed[variant_index:]
          deployed_path.write_text(deployed)
          print("patched deployed trust-bound signer")
          PY
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/trust-binding-patch.status"
          exit 0

      - name: Upload trust-binding patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-binding-patch-diagnostics
          path: ${{ runner.temp }}/trust-binding-patch.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on trust-binding patch mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/trust-binding-patch.status")" = "0"

      - name: Materialize canonical formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit signed trust-state binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock \
            crates/windows-production-signer-runtime \
            crates/windows-production-signer-service-runtime \
            crates/windows-production-trust-state-runtime
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Bind production signatures to accepted trust state"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint signed trust-state boundary
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run signed trust-state attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-features -- --nocapture
