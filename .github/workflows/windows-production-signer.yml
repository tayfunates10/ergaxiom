name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  policy:
    name: Verify production signer policy, CNG and caller identity contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint platform-neutral production signer boundaries
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run platform-neutral production signer attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-features

  windows-cng:
    name: Compile CNG provider and derive signer caller identity
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint Windows production signer boundary
        shell: pwsh
        run: |
          cargo clippy `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-targets --all-features -- -D warnings

      - name: Run Windows production signer contract tests
        shell: pwsh
        run: |
          cargo test `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-features
