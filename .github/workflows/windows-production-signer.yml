name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-service/**"
      - "crates/windows-production-signer-host-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  fix-service-host:
    name: Fix platform-neutral production signer service host
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply exact Clippy diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/windows-production-signer-host-runtime/src/lib.rs")
          text = path.read_text()
          text = text.replace(
              "use ergaxiom_windows_production_signer_protocol_runtime::ProductionSignerRequest;\n",
              "",
              1,
          )
          text = text.replace(
              "    ProductionKeyPolicy, ProductionSignerError, SignerRequestBinding, SignerServiceIdentity,\n",
              "    ProductionKeyPolicy, ProductionSignerError, SignerRequestBinding,\n",
              1,
          )
          text = text.replace(
              "    HardwareSignerBackend, HardwareSignerBackendError, ProductionSignerService,\n",
              "    HardwareSignerBackend, HardwareSignerBackendError,\n",
              1,
          )
          old = "    file.take(max_bytes.saturating_add(1))\n        .read_to_end(&mut bytes)?;"
          new = "    (&mut file)\n        .take(max_bytes.saturating_add(1))\n        .read_to_end(&mut bytes)?;"
          if old not in text:
              raise SystemExit("bounded file read marker missing")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Materialize canonical formatting
        run: cargo fmt --all

      - name: Commit service host fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-host-runtime/src/lib.rs
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Fix production signer host bounded reads"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint platform-neutral service host
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-service \
            --all-targets --all-features -- -D warnings

      - name: Run platform-neutral service host tests
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-service \
            --all-features -- --nocapture
