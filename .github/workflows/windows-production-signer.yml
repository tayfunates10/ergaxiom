name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  governance-diagnostics:
    name: Diagnose P-256 governance boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture governance Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            --all-targets --all-features -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/governance-clippy.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/governance-clippy.status"
          exit 0

      - name: Upload governance Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-clippy-diagnostics
          path: ${{ runner.temp }}/governance-clippy.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on governance lint mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/governance-clippy.status")" = "0"

      - name: Capture governance attack tests
        if: success()
        shell: bash
        run: |
          set +e
          cargo test \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            --all-features \
            2>&1 | tee "$RUNNER_TEMP/governance-tests.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/governance-tests.status"
          exit 0

      - name: Upload governance test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-test-diagnostics
          path: ${{ runner.temp }}/governance-tests.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail on governance test mismatch
        if: success()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/governance-tests.status")" = "0"
