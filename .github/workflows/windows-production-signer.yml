name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  policy:
    name: Canonicalize and verify read-before-impersonation transport
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Materialize canonical transport formatting
        run: cargo fmt --all

      - name: Commit canonical transport source when needed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- crates/windows-production-signer-transport-runtime; then
            exit 0
          fi
          git config user.name "ergaxiom-ci"
          git config user.email "ergaxiom-ci@users.noreply.github.com"
          git add crates/windows-production-signer-transport-runtime
          git commit -m "Canonicalize read-before-impersonation transport"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint production signer and issuance boundary
        run: |
          cargo clippy \
            -p ergaxiom-attestation-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run platform-neutral production signer attacks
        run: |
          cargo test \
            -p ergaxiom-attestation-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-features

  windows-cng:
    name: Compile CNG signer and purpose-locked issuance boundary
    runs-on: windows-2025
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint Windows production signer boundary
        shell: pwsh
        run: |
          cargo clippy `
            -p ergaxiom-attestation-runtime `
            -p ergaxiom-attestation-issuance-runtime `
            -p ergaxiom-capability-runtime `
            -p ergaxiom-capability-issuance-runtime `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-production-signer-protocol-runtime `
            -p ergaxiom-windows-production-signer-service-runtime `
            -p ergaxiom-windows-production-signer-transport-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-targets --all-features -- -D warnings

      - name: Run Windows production signer contract tests
        shell: pwsh
        run: |
          cargo test `
            -p ergaxiom-attestation-runtime `
            -p ergaxiom-attestation-issuance-runtime `
            -p ergaxiom-capability-runtime `
            -p ergaxiom-capability-issuance-runtime `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-production-signer-protocol-runtime `
            -p ergaxiom-windows-production-signer-service-runtime `
            -p ergaxiom-windows-production-signer-transport-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-features
