name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  diagnose-deployed-trust-state-tests:
    name: Diagnose deployed trust-state attacks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint deployed trust-state boundary
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-targets --all-features -- -D warnings

      - name: Capture deployed signer attack diagnostics
        shell: bash
        run: |
          set +e
          cargo test \
            -p ergaxiom-windows-production-trust-state-runtime \
            --test deployed_service --all-features -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/deployed-signer-attacks.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/deployed-signer-attacks.status"
          exit 0

      - name: Upload deployed signer attack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-signer-attack-diagnostics
          path: ${{ runner.temp }}/deployed-signer-attacks.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on deployed signer attack mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/deployed-signer-attacks.status")" = "0"
