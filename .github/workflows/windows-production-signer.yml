name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - "docs/architecture/42-production-trust-registry-deployment.md"
      - "docs/architecture/43-windows-production-signer-service.md"
      - "docs/status.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  update-service-docs:
    name: Update hardened signer service documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Update documented service boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/42-production-trust-registry-deployment.md")
          text = path.read_text()
          text = text.replace(
              "This implementation is a runtime and filesystem security boundary. It does **not** claim that a production governance ceremony has occurred, that governance private keys have operational custody controls, that the signer has been installed through Windows Service Control Manager, or that a physical TPM has been independently proven.",
              "This implementation now includes the hardened Windows Service Control Manager host and installer contract. It does **not** claim that a production governance ceremony has occurred, that governance private keys have operational custody controls, that the fixed service has been installed on a controlled production machine, or that a physical TPM has been independently proven.",
          )
          text = text.replace(
              "This is an in-process startup authority and attack-tested deployment boundary. Installation, account configuration, service recovery settings and SCM hardening of a real Windows service remain open.",
              "The startup authority is now hosted by a fixed SCM own-process LocalSystem service runtime with delayed automatic start, restricted privileges, failure actions, preshutdown handling and an administrator/System-only service DACL. The executable and manifest paths are bound before the service reports `SERVICE_RUNNING`. A controlled-machine elevated installation record and operational recovery exercise remain open.",
          )
          text = text.replace(
              "- installation of the authenticated signer as a hardened Windows service,",
              "- elevated installation and validation of the fixed hardened service on controlled production hardware,",
          )
          path.write_text(text)

          path = Path("docs/architecture/41-tpm-cng-production-signer.md")
          text = path.read_text()
          insertion_anchor = "Existing fixed-snapshot artifacts remain backward compatible because the trust-state field is optional and omitted from the earlier path. New deployed issuance requires it.\n"
          insertion = "\n## Hardened Windows service host\n\n`ergaxiom-windows-production-signer-host-runtime` and the dedicated service executable bind a canonical manifest to the exact executable path/digest, trust store, governance policy, caller allowlist, deployment policy and named-pipe principal. The fixed SCM contract uses an own-process LocalSystem service, delayed automatic start, severe error control, unrestricted service SID, only `SeChangeNotifyPrivilege`, bounded restart actions, preshutdown handling and a protected administrator/System service DACL.\n\nBefore reporting `SERVICE_RUNNING`, the service reloads the accepted signed state, resolves every exact active generation, opens each generation-specific CNG key by expected public-key digest, verifies the full descriptor-to-registry binding, derives the current process identity and binds the protected first-instance pipe. Relative paths, command-line quote injection, copied executable paths and hardening-policy substitutions fail closed.\n"
          if "## Hardened Windows service host" not in text:
              if insertion_anchor not in text:
                  raise SystemExit("architecture 41 insertion anchor missing")
              text = text.replace(insertion_anchor, insertion_anchor + insertion, 1)
          text = text.replace(
              "- real Windows protected-DACL, atomic-pointer and named-pipe round trips.",
              "- real Windows protected-DACL, atomic-pointer and named-pipe round trips,\n- canonical SCM manifest and hardening mutation attacks,\n- exact service executable path/digest binding, and\n- Windows release-mode production service executable compilation.",
          )
          text = text.replace(
              "- deployment of the authenticated production signer as a hardened Windows service, and",
              "- an elevated controlled-machine installation record and service recovery exercise, and",
          )
          path.write_text(text)

          path = Path("docs/status.md")
          text = path.read_text()
          text = text.replace(
              "| Authenticated local production signer service | Implemented | A revisioned caller allowlist, PID creation-time guard, SID/session/path/image-digest binding, service-instance binding, replay-before-backend ordering, governed public trust snapshot and explicit local message-mode named-pipe ACL are implemented and Windows-tested. A trust-bound startup wrapper now requires the accepted registry, allowlist, executable, service policy and exact active CNG generation. Actual Windows Service Control Manager installation remains open. |",
              "| Authenticated local production signer service | Implemented | The revisioned allowlist, process identity, replay-before-backend and protected named-pipe boundary now run behind a fixed SCM own-process LocalSystem host. A canonical manifest binds the exact executable path/digest, accepted state, allowlist and deployment policy; delayed start, restricted privileges, failure actions, preshutdown handling and an administrator/System service DACL are Windows-compiled and attack-tested. A controlled production-machine installation record remains open. |",
          )
          text = text.replace(
              "The phase remains open because physical-TPM assurance is unproven, a controlled-hardware ceremony is not recorded, governance-key custody and signed-state distribution are not operationalized, hardened Windows-service installation, broader UI patterns, code signing and real-user deployment hardening are incomplete.",
              "The phase remains open because physical-TPM assurance is unproven, a controlled-hardware ceremony is not recorded, governance-key custody and signed-state distribution are not operationalized, the fixed service has not been elevated-installed and recovery-tested on controlled production hardware, and broader UI patterns, code signing and real-user deployment hardening are incomplete.",
          )
          text = text.replace(
              "Persistent user-selected jobs, real Evidence Bundle loading, installed internal CNG service orchestration, independently proven physical-TPM keys, operational governance-key custody/distribution, Authenticode, signed installer provenance and all four profession paths in one user-driven desktop flow remain open.",
              "Persistent user-selected jobs, real Evidence Bundle loading, complete desktop/backend routing through a controlled-machine installed CNG service, independently proven physical-TPM keys, operational governance-key custody/distribution, Authenticode, signed installer provenance and all four profession paths in one user-driven desktop flow remain open.",
          )
          gate_anchor = "20. Persistent threshold-signed production trust state with explicit offline bootstrap, exact monotonic revision chaining, protected immutable storage, atomic activation, sealed checkpoints, separately authorized recovery, active-generation startup matching and hardware-signed state binding."
          gate = "\n21. Hardened Windows production signer service host with a canonical fixed-policy manifest, exact executable path/digest binding, own-process LocalSystem SCM configuration, delayed start, restricted privilege list, failure actions, preshutdown handling, protected service DACL and accepted-state-bound CNG startup."
          if "21. Hardened Windows production signer service host" not in text:
              if gate_anchor not in text:
                  raise SystemExit("status gate anchor missing")
              text = text.replace(gate_anchor, gate_anchor + gate, 1)
          text = text.replace(
              "3. Deploy the authenticated signer as a hardened Windows service and load the accepted trust state during real service startup.",
              "3. Execute and retain an elevated controlled-machine installation/validation record, service recovery exercise and complete desktop/backend routing through the installed signer.",
          )
          path.write_text(text)
          PY

      - name: Commit service documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/41-tpm-cng-production-signer.md docs/architecture/42-production-trust-registry-deployment.md docs/status.md
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "Document hardened production signer service"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi
