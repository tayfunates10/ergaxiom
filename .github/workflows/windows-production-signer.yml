name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-provisioner/**"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-provisioning-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-provisioner/**"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-provisioning-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  policy:
    name: Canonicalize and verify administrator provisioning boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Materialize canonical formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit canonical provisioning source when needed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock apps/windows-production-signer-provisioner crates/windows-cng-key-provider-runtime crates/windows-production-signer-provisioning-runtime; then
            exit 0
          fi
          git config user.name "ergaxiom-ci"
          git config user.email "ergaxiom-ci@users.noreply.github.com"
          git add Cargo.lock apps/windows-production-signer-provisioner crates/windows-cng-key-provider-runtime crates/windows-production-signer-provisioning-runtime
          git commit -m "Canonicalize administrator provisioning boundary"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Prove normal CNG runtime has no provisioning feature
        run: |
          cargo check \
            -p ergaxiom-windows-cng-key-provider-runtime \
            --no-default-features

      - name: Lint production signer and provisioning boundary
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-attestation-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run production signer and provisioning attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-attestation-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-features

  windows-cng:
    name: Compile CNG signer, administrator provisioner and issuance boundary
    runs-on: windows-2025
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Prove normal Windows CNG runtime is open-only
        shell: pwsh
        run: |
          cargo check `
            -p ergaxiom-windows-cng-key-provider-runtime `
            --no-default-features

      - name: Lint Windows production signer and provisioner
        shell: pwsh
        run: |
          cargo clippy `
            -p ergaxiom-windows-production-signer-provisioner `
            -p ergaxiom-attestation-runtime `
            -p ergaxiom-attestation-issuance-runtime `
            -p ergaxiom-capability-runtime `
            -p ergaxiom-capability-issuance-runtime `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-production-signer-protocol-runtime `
            -p ergaxiom-windows-production-signer-provisioning-runtime `
            -p ergaxiom-windows-production-signer-service-runtime `
            -p ergaxiom-windows-production-signer-transport-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-targets --all-features -- -D warnings

      - name: Run Windows production signer and provisioning tests
        shell: pwsh
        run: |
          cargo test `
            -p ergaxiom-windows-production-signer-provisioner `
            -p ergaxiom-attestation-runtime `
            -p ergaxiom-attestation-issuance-runtime `
            -p ergaxiom-capability-runtime `
            -p ergaxiom-capability-issuance-runtime `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-production-signer-protocol-runtime `
            -p ergaxiom-windows-production-signer-provisioning-runtime `
            -p ergaxiom-windows-production-signer-service-runtime `
            -p ergaxiom-windows-production-signer-transport-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-features
