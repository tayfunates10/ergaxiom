name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  diagnose-windows-production-trust-state:
    name: Diagnose Windows production trust state
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture Windows trust-state Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-targets --all-features -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/windows-trust-state-clippy.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/windows-trust-state-clippy.status"
          exit 0

      - name: Upload Windows trust-state Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trust-state-clippy-diagnostics
          path: ${{ runner.temp }}/windows-trust-state-clippy.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on Windows trust-state lint mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/windows-trust-state-clippy.status")" = "0"

      - name: Capture Windows trust-state tests
        if: success()
        shell: bash
        run: |
          set +e
          cargo test \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-features -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/windows-trust-state-tests.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/windows-trust-state-tests.status"
          exit 0

      - name: Upload Windows trust-state test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trust-state-test-diagnostics
          path: ${{ runner.temp }}/windows-trust-state-tests.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail on Windows trust-state test mismatch
        if: success()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/windows-trust-state-tests.status")" = "0"
