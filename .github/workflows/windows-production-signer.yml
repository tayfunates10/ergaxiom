name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  diagnose-deployed-trust-state:
    name: Diagnose deployed production trust-state signer
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture deployed trust-state Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-targets --all-features -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/deployed-trust-state-clippy.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/deployed-trust-state-clippy.status"
          exit 0

      - name: Upload deployed trust-state Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-trust-state-clippy-diagnostics
          path: ${{ runner.temp }}/deployed-trust-state-clippy.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on deployed trust-state lint mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/deployed-trust-state-clippy.status")" = "0"

      - name: Capture deployed trust-state tests
        if: success()
        shell: bash
        run: |
          set +e
          cargo test \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-features -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/deployed-trust-state-tests.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/deployed-trust-state-tests.status"
          exit 0

      - name: Upload deployed trust-state test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-trust-state-test-diagnostics
          path: ${{ runner.temp }}/deployed-trust-state-tests.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail on deployed trust-state test mismatch
        if: success()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/deployed-trust-state-tests.status")" = "0"
