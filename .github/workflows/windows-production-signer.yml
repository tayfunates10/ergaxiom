name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  canonicalize-production-trust-state-fixes:
    name: Canonicalize production trust-state fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply exact Clippy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path("crates/windows-production-trust-state-runtime/src/model.rs")
          text = model.read_text()
          old = '''use ergaxiom_windows_production_signer_runtime::{
              ProductionKeyIdentity, ProductionSignerError, validate_identifier, validate_sha256,
          };'''
          new = '''use ergaxiom_windows_production_signer_runtime::{
              ProductionSignerError, validate_identifier, validate_sha256,
          };'''
          if text.count(old) != 1:
              raise SystemExit("expected one unused ProductionKeyIdentity import")
          model.write_text(text.replace(old, new, 1))

          store = Path("crates/windows-production-trust-state-runtime/src/store.rs")
          text = store.read_text()
          old = "    let mut file = File::open(path)?;"
          new = "    let file = File::open(path)?;"
          if text.count(old) != 1:
              raise SystemExit("expected one unnecessary mutable File")
          store.write_text(text.replace(old, new, 1))
          PY

      - name: Materialize canonical formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit exact trust-state fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/windows-production-trust-state-runtime
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Fix production trust-state lint diagnostics"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint production trust-state lifecycle
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run production trust-state attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-features -- --nocapture
