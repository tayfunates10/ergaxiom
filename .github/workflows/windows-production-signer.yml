name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-provisioner/**"
      - "apps/windows-production-signer-service/**"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-deployment-evidence-runtime/**"
      - "crates/windows-production-governed-issuance-runtime/**"
      - "crates/windows-production-installation-evidence-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-host-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-provisioning-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - "docs/architecture/42-production-trust-registry-deployment.md"
      - "docs/architecture/43-windows-production-signer-service.md"
      - "docs/architecture/44-controlled-machine-deployment-evidence.md"
      - "docs/status.md"
      - ".github/workflows/windows-production-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-provisioner/**"
      - "apps/windows-production-signer-service/**"
      - "crates/attestation-issuance-runtime/**"
      - "crates/attestation-runtime/**"
      - "crates/capability-issuance-runtime/**"
      - "crates/capability-runtime/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-deployment-evidence-runtime/**"
      - "crates/windows-production-governed-issuance-runtime/**"
      - "crates/windows-production-installation-evidence-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-host-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-provisioning-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - "docs/architecture/42-production-trust-registry-deployment.md"
      - "docs/architecture/43-windows-production-signer-service.md"
      - "docs/architecture/44-controlled-machine-deployment-evidence.md"
      - "docs/status.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  governed-production-service:
    name: Verify production signer service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Prove normal CNG runtime is open-only
        run: cargo check -p ergaxiom-windows-cng-key-provider-runtime --no-default-features

      - name: Lint production service and signer boundary
        shell: bash
        run: |
          cargo clippy \
            -p ergaxiom-attestation-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-windows-production-signer-service \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-production-deployment-evidence-runtime \
            -p ergaxiom-windows-production-governed-issuance-runtime \
            -p ergaxiom-windows-production-installation-evidence-runtime \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run production service and signer attacks
        shell: bash
        run: |
          cargo test \
            -p ergaxiom-attestation-runtime \
            -p ergaxiom-attestation-issuance-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-capability-issuance-runtime \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-windows-production-signer-service \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-production-deployment-evidence-runtime \
            -p ergaxiom-windows-production-governed-issuance-runtime \
            -p ergaxiom-windows-production-installation-evidence-runtime \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-features -- --nocapture

      - name: Compile production signer service executable
        run: cargo build -p ergaxiom-windows-production-signer-service --release
