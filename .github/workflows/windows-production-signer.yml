name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-trust-state-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  bind-production-trust-state:
    name: Bind hardware signatures to accepted production trust state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add signed trust-state request binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("crates/windows-production-signer-runtime/src/lib.rs")
          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              '''pub struct SignerRequestBinding {
              pub schema_version: String,
              pub request_digest: String,
              pub caller_identity_digest: String,
              pub signer_service_identity_digest: String,
              pub key_policy_digest: String,
          }''',
              '''pub struct SignerRequestBinding {
              pub schema_version: String,
              pub request_digest: String,
              pub caller_identity_digest: String,
              pub signer_service_identity_digest: String,
              pub key_policy_digest: String,
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub trust_state_binding_digest: Option<String>,
          }''',
              "binding field",
          )
          runtime = replace_once(
              runtime,
              '''            signer_service_identity_digest: service.digest()?,
              key_policy_digest: policy.digest()?,
          };''',
              '''            signer_service_identity_digest: service.digest()?,
              key_policy_digest: policy.digest()?,
              trust_state_binding_digest: None,
          };''',
              "default binding value",
          )
          runtime = replace_once(
              runtime,
              '''        binding.validate()?;
              Ok(binding)
          }

          pub fn validate(&self) -> Result<(), ProductionSignerError> {''',
              '''        binding.validate()?;
              Ok(binding)
          }

          pub fn build_with_trust_state(
              request_digest: impl Into<String>,
              caller: &AuthenticatedCallerIdentity,
              service: &SignerServiceIdentity,
              policy: &ProductionKeyPolicy,
              trust_state_binding_digest: impl Into<String>,
          ) -> Result<Self, ProductionSignerError> {
              let mut binding = Self::build(request_digest, caller, service, policy)?;
              binding.trust_state_binding_digest = Some(trust_state_binding_digest.into());
              binding.validate()?;
              Ok(binding)
          }

          pub fn validate(&self) -> Result<(), ProductionSignerError> {''',
              "trust-state builder",
          )
          runtime = replace_once(
              runtime,
              '''        validate_sha256(&self.signer_service_identity_digest)?;
              validate_sha256(&self.key_policy_digest)
          }''',
              '''        validate_sha256(&self.signer_service_identity_digest)?;
              validate_sha256(&self.key_policy_digest)?;
              if let Some(trust_state_binding_digest) = &self.trust_state_binding_digest {
                  validate_sha256(trust_state_binding_digest)?;
              }
              Ok(())
          }''',
              "binding validation",
          )
          runtime_path.write_text(runtime)

          service_path = Path("crates/windows-production-signer-service-runtime/src/lib.rs")
          service = service_path.read_text()
          service = replace_once(
              service,
              '''    pub fn handle_authenticated_generation(
              &mut self,
              request: &ProductionSignerRequest,
              caller: &AuthenticatedCallerIdentity,
              trusted_now_epoch_s: u64,
              generation: u64,
          ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerServiceError> {
              if generation == 0 {''',
              '''    pub fn handle_authenticated_generation(
              &mut self,
              request: &ProductionSignerRequest,
              caller: &AuthenticatedCallerIdentity,
              trusted_now_epoch_s: u64,
              generation: u64,
          ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerServiceError> {
              self.handle_authenticated_generation_with_trust_state(
                  request,
                  caller,
                  trusted_now_epoch_s,
                  generation,
                  None,
              )
          }

          pub fn handle_authenticated_generation_with_trust_state(
              &mut self,
              request: &ProductionSignerRequest,
              caller: &AuthenticatedCallerIdentity,
              trusted_now_epoch_s: u64,
              generation: u64,
              trust_state_binding_digest: Option<&str>,
          ) -> Result<AuthorizedProductionSignerPackage, ProductionSignerServiceError> {
              if generation == 0 {''',
              "trust-aware service method",
          )
          service = replace_once(
              service,
              '''        let binding =
              SignerRequestBinding::build(request_digest, caller, &self.service_identity, &policy)?;''',
              '''        let binding = if let Some(trust_state_binding_digest) = trust_state_binding_digest {
              SignerRequestBinding::build_with_trust_state(
                  request_digest,
                  caller,
                  &self.service_identity,
                  &policy,
                  trust_state_binding_digest,
              )?
          } else {
              SignerRequestBinding::build(request_digest, caller, &self.service_identity, &policy)?
          };''',
              "trust-aware binding construction",
          )
          service_path.write_text(service)

          deployed_path = Path("crates/windows-production-trust-state-runtime/src/service.rs")
          deployed = deployed_path.read_text()
          deployed = replace_once(
              deployed,
              '''        if envelope.request.identity != governed_trust.key.identity {
              return Err(DeployedProductionSignerError::KeyGenerationMismatch);
          }
          if self.package_digest != self.expected_digest()? {''',
              '''        if envelope.request.identity != governed_trust.key.identity {
              return Err(DeployedProductionSignerError::KeyGenerationMismatch);
          }
          if envelope.binding.trust_state_binding_digest.as_deref()
              != Some(accepted.binding().binding_digest.as_str())
          {
              return Err(DeployedProductionSignerError::SignedTrustStateBindingMismatch);
          }
          if self.package_digest != self.expected_digest()? {''',
              "signed binding verification",
          )
          deployed = replace_once(
              deployed,
              '''        let signer_package = self.inner.handle_authenticated_generation(
              request,
              caller,
              trusted_now_epoch_s,
              record.generation,
          )?;''',
              '''        let signer_package = self.inner.handle_authenticated_generation_with_trust_state(
              request,
              caller,
              trusted_now_epoch_s,
              record.generation,
              Some(&self.accepted.binding().binding_digest),
          )?;''',
              "trust-aware deployed signing",
          )
          deployed = replace_once(
              deployed,
              '''    #[error("production signer key generation does not match governed trust")]
              KeyGenerationMismatch,''',
              '''    #[error("production signer key generation does not match governed trust")]
              KeyGenerationMismatch,
              #[error("hardware-signed request does not bind the accepted production trust state")]
              SignedTrustStateBindingMismatch,''',
              "signed binding error",
          )
          deployed_path.write_text(deployed)
          PY

      - name: Materialize canonical formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit signed trust-state binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock \
            crates/windows-production-signer-runtime \
            crates/windows-production-signer-service-runtime \
            crates/windows-production-trust-state-runtime
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Bind production signatures to accepted trust state"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint signed trust-state boundary
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run signed trust-state attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-trust-state-runtime \
            --all-features -- --nocapture
