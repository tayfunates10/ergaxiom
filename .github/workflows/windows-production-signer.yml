name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-service/**"
      - "crates/windows-production-signer-host-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  finalize-service-host-attacks:
    name: Finalize production signer service host attacks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bind executable path and register tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path("crates/windows-production-signer-host-runtime/src/lib.rs")
          text = lib.read_text()
          if "#[cfg(test)]\nmod tests;" not in text:
              anchor = "#[cfg(windows)]\nmod windows;\n"
              if anchor not in text:
                  raise SystemExit("windows module anchor missing")
              text = text.replace(anchor, anchor + "\n#[cfg(test)]\nmod tests;\n", 1)
          old = "        let service_identity = windows::current_service_identity(\n            &loaded.deployment_policy.service_id,\n            &loaded.manifest.executable_sha256,\n            trusted_now_epoch_s,\n        )?;"
          new = "        let service_identity = windows::current_service_identity(\n            &loaded.deployment_policy.service_id,\n            Path::new(&loaded.manifest.executable_path),\n            &loaded.manifest.executable_sha256,\n            trusted_now_epoch_s,\n        )?;"
          if old not in text:
              raise SystemExit("current service identity call anchor missing")
          text = text.replace(old, new, 1)
          error_anchor = "    #[error(\"production signer executable digest does not match the manifest\")]\n    ExecutableDigestMismatch,"
          error_new = error_anchor + "\n    #[error(\"production signer executable path does not match the manifest\")]\n    ExecutablePathMismatch,"
          if "ExecutablePathMismatch" not in text:
              if error_anchor not in text:
                  raise SystemExit("executable digest error anchor missing")
              text = text.replace(error_anchor, error_new, 1)
          lib.write_text(text)

          win = Path("crates/windows-production-signer-host-runtime/src/windows.rs")
          text = win.read_text()
          old = "pub fn current_service_identity(\n    service_id: &str,\n    executable_sha256: &str,\n    started_at_epoch_s: u64,\n)"
          new = "pub fn current_service_identity(\n    service_id: &str,\n    expected_executable_path: &Path,\n    executable_sha256: &str,\n    started_at_epoch_s: u64,\n)"
          if old not in text:
              raise SystemExit("current service identity signature anchor missing")
          text = text.replace(old, new, 1)
          old = "    let current_executable = std::env::current_exe()?;\n    if hash_stable_file(&current_executable, PRODUCTION_SIGNER_MAX_EXECUTABLE_BYTES)?\n        != executable_sha256\n    {\n        return Err(ProductionSignerHostError::ExecutableDigestMismatch);\n    }"
          new = "    let current_executable = std::fs::canonicalize(std::env::current_exe()?)?;\n    let expected_executable = std::fs::canonicalize(expected_executable_path)?;\n    if current_executable != expected_executable {\n        return Err(ProductionSignerHostError::ExecutablePathMismatch);\n    }\n    if hash_stable_file(&current_executable, PRODUCTION_SIGNER_MAX_EXECUTABLE_BYTES)?\n        != executable_sha256\n    {\n        return Err(ProductionSignerHostError::ExecutableDigestMismatch);\n    }"
          if old not in text:
              raise SystemExit("current executable digest anchor missing")
          text = text.replace(old, new, 1)
          win.write_text(text)

          tests = Path("crates/windows-production-signer-host-runtime/src/tests.rs")
          text = tests.read_text()
          text = text.replace("use std::path::{Path, PathBuf};", "use std::path::PathBuf;")
          text = text.replace(
              '    let mutations: Vec<Box<dyn Fn(&mut ProductionSignerServiceManifest)>> = vec![',
              '    let mutations: [fn(&mut ProductionSignerServiceManifest); 10] = [',
          )
          text = text.replace("        Box::new(|value| value.service_name = \"ErgaxiomSignerDev\".to_owned()),", "        |value| value.service_name = \"ErgaxiomSignerDev\".to_owned(),")
          text = text.replace("        Box::new(|value| value.service_account = \"LocalService\".to_owned()),", "        |value| value.service_account = \"LocalService\".to_owned(),")
          text = text.replace("        Box::new(|value| value.service_type = \"SHARED_PROCESS\".to_owned()),", "        |value| value.service_type = \"SHARED_PROCESS\".to_owned(),")
          text = text.replace("        Box::new(|value| value.start_mode = \"DEMAND\".to_owned()),", "        |value| value.start_mode = \"DEMAND\".to_owned(),")
          text = text.replace("        Box::new(|value| value.error_control = \"IGNORE\".to_owned()),", "        |value| value.error_control = \"IGNORE\".to_owned(),")
          text = text.replace("        Box::new(|value| value.service_sid_type = \"NONE\".to_owned()),", "        |value| value.service_sid_type = \"NONE\".to_owned(),")
          text = text.replace("        Box::new(|value| value.required_privileges.push(\"SeDebugPrivilege\".to_owned())),", "        |value| value.required_privileges.push(\"SeDebugPrivilege\".to_owned()),")
          text = text.replace("        Box::new(|value| value.failure_restart_delays_ms = vec![0, 0]),", "        |value| value.failure_restart_delays_ms = vec![0, 0],")
          text = text.replace("        Box::new(|value| value.preshutdown_timeout_ms = 0),", "        |value| value.preshutdown_timeout_ms = 0,")
          text = text.replace("        Box::new(|value| value.max_config_file_bytes = 0),", "        |value| value.max_config_file_bytes = 0,")
          text = text.replace("    let path = Path::new(\"/tmp/ergaxiom-production-service.json\");", "    let path = std::path::Path::new(\"/tmp/ergaxiom-production-service.json\");")
          old = "    let identity = crate::windows::current_service_identity(\n        \"ergaxiom-production-signer\",\n        &digest,\n        trusted_test_time()?,\n    )?;"
          new = "    let identity = crate::windows::current_service_identity(\n        \"ergaxiom-production-signer\",\n        &current,\n        &digest,\n        trusted_test_time()?,\n    )?;"
          if old not in text:
              raise SystemExit("Windows identity test anchor missing")
          text = text.replace(old, new, 1)
          tests.write_text(text)
          PY

      - name: Materialize canonical formatting
        run: cargo fmt --all

      - name: Commit service host attack boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-host-runtime/src
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Bind production signer service executable path"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint service host attacks
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-service \
            --all-targets --all-features -- -D warnings

      - name: Run service host attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-service \
            --all-features -- --nocapture
