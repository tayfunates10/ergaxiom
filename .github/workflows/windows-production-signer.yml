name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-provisioner/**"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-governed-issuance-runtime/**"
      - "crates/windows-production-key-governance-runtime/**"
      - "crates/windows-production-signer-provisioning-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: write

jobs:
  canonicalize-governed-generation-fixes:
    name: Canonicalize governed generation fixes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/tpm-cng-signer-service-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Remove stale test import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/windows-production-governed-issuance-runtime/tests/capability.rs")
          text = path.read_text()
          old = "    ProductionKeyPolicy, SEC1_UNCOMPRESSED_P256, SIGNER_SERVICE_IDENTITY_SCHEMA,\n"
          new = "    ProductionKeyPolicy, SIGNER_SERVICE_IDENTITY_SCHEMA,\n"
          if text.count(old) != 1:
              raise SystemExit("expected one stale import")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Materialize canonical formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit governed generation fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/windows-production-governed-issuance-runtime
          if git diff --cached --quiet; then
            echo "No canonical source changes"
          else
            git commit -m "Fix governed issuance test dependencies"
            git push origin HEAD:agent/tpm-cng-signer-service-v1
          fi

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint governed generation boundary
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-governed-issuance-runtime \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run governed generation tests
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-provisioner \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-production-signer-provisioning-runtime \
            -p ergaxiom-windows-production-governed-issuance-runtime \
            -p ergaxiom-windows-production-key-governance-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            --all-features
