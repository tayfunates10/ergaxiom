name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-cng-key-provider-runtime/**"
      - "crates/windows-production-signer-protocol-runtime/**"
      - "crates/windows-production-signer-runtime/**"
      - "crates/windows-production-signer-service-runtime/**"
      - "crates/windows-production-signer-transport-runtime/**"
      - "crates/windows-signer-service-identity-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  policy:
    name: Verify production signer policy, protocol, service, transport and identity contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture Linux production signer Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-targets --all-features -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/production-signer-clippy-linux.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/production-signer-clippy-linux.status"
          exit 0

      - name: Upload Linux production signer Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-signer-clippy-linux-diagnostics
          path: ${{ runner.temp }}/production-signer-clippy-linux.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on Linux production signer lint mismatch
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/production-signer-clippy-linux.status")" = "0"

      - name: Run platform-neutral production signer attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-runtime \
            -p ergaxiom-windows-production-signer-protocol-runtime \
            -p ergaxiom-windows-production-signer-service-runtime \
            -p ergaxiom-windows-production-signer-transport-runtime \
            -p ergaxiom-windows-cng-key-provider-runtime \
            -p ergaxiom-windows-signer-service-identity-runtime \
            --all-features

  windows-cng:
    name: Compile CNG provider, protocol, service, transport and caller identity
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture Windows production signer Clippy diagnostics
        shell: pwsh
        run: |
          cargo clippy `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-production-signer-protocol-runtime `
            -p ergaxiom-windows-production-signer-service-runtime `
            -p ergaxiom-windows-production-signer-transport-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-targets --all-features -- -D warnings `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\production-signer-clippy-windows.log"
          "$LASTEXITCODE" | Set-Content "$env:RUNNER_TEMP\production-signer-clippy-windows.status"
          exit 0

      - name: Upload Windows production signer Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-signer-clippy-windows-diagnostics
          path: ${{ runner.temp }}/production-signer-clippy-windows.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on Windows production signer lint mismatch
        shell: pwsh
        run: |
          $status = (Get-Content "$env:RUNNER_TEMP\production-signer-clippy-windows.status").Trim()
          if ($status -ne "0") { exit [int]$status }

      - name: Capture Windows production signer contract tests
        shell: pwsh
        run: |
          cargo test `
            -p ergaxiom-windows-production-signer-runtime `
            -p ergaxiom-windows-production-signer-protocol-runtime `
            -p ergaxiom-windows-production-signer-service-runtime `
            -p ergaxiom-windows-production-signer-transport-runtime `
            -p ergaxiom-windows-cng-key-provider-runtime `
            -p ergaxiom-windows-signer-service-identity-runtime `
            --all-features -- --nocapture `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\production-signer-tests-windows.log"
          "$LASTEXITCODE" | Set-Content "$env:RUNNER_TEMP\production-signer-tests-windows.status"
          exit 0

      - name: Upload Windows production signer test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-signer-tests-windows-diagnostics
          path: ${{ runner.temp }}/production-signer-tests-windows.*
          if-no-files-found: error
          retention-days: 3

      - name: Fail on Windows production signer test mismatch
        shell: pwsh
        run: |
          $status = (Get-Content "$env:RUNNER_TEMP\production-signer-tests-windows.status").Trim()
          if ($status -ne "0") { exit [int]$status }
