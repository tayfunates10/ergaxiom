name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/windows-production-signer-service/**"
      - "crates/windows-production-signer-host-runtime/**"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  diagnose-service-host:
    name: Diagnose production signer service host
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Capture service host Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy \
            -p ergaxiom-windows-production-signer-host-runtime \
            -p ergaxiom-windows-production-signer-service \
            --all-targets --all-features -- -D warnings \
            > service-host-clippy.txt 2>&1
          echo $? > service-host-clippy.exit
          exit 0

      - name: Upload service host diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: service-host-clippy-diagnostics
          path: |
            service-host-clippy.txt
            service-host-clippy.exit

      - name: Fail on service host lint mismatch
        shell: bash
        run: test "$(cat service-host-clippy.exit)" = "0"
