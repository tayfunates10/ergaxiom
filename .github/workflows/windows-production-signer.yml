name: Windows production signer foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-signer-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/windows-production-signer-runtime/**"
      - "docs/architecture/41-tpm-cng-production-signer.md"
      - ".github/workflows/windows-production-signer.yml"

permissions:
  contents: read

jobs:
  policy:
    name: Verify production signer policy and identity bindings
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Materialize canonical formatting and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Upload canonical source material
        uses: actions/upload-artifact@v4
        with:
          name: production-signer-canonical-source
          path: |
            Cargo.lock
            crates/windows-production-signer-runtime/src/lib.rs
            crates/windows-production-signer-runtime/tests/policy.rs
          if-no-files-found: error
          retention-days: 3

      - name: Lint production signer foundation
        run: |
          cargo clippy \
            -p ergaxiom-windows-production-signer-runtime \
            --all-targets --all-features -- -D warnings

      - name: Run production signer policy attacks
        run: |
          cargo test \
            -p ergaxiom-windows-production-signer-runtime \
            --all-features
