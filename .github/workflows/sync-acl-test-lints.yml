name: Sync ACL test lints

on:
  push:
    branches:
      - agent/tauri-production-acl-gate-v1
  pull_request:
    paths:
      - "crates/windows-production-signer-host-runtime/**"
      - ".github/workflows/sync-acl-test-lints.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tauri-production-acl-gate-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Remove denied expect calls
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/windows-production-signer-host-runtime/src/protected_path.rs")
          text = path.read_text()
          text = text.replace(
              '''            validate_sddl("O:BAD:P(A;;FA;;;SY)(A;;FA;;;BA)(A;;FR;;;BU)")
                  .expect("protected administrator descriptor must pass");''',
              '''            assert!(
                  validate_sddl("O:BAD:P(A;;FA;;;SY)(A;;FA;;;BA)(A;;FR;;;BU)").is_ok(),
                  "protected administrator descriptor must pass"
              );''',
              1,
          )
          text = text.replace(
              '''            validate_sddl("O:BAD:P(D;;FW;;;BU)(A;;FA;;;SY)(A;;FA;;;BA)(A;;FR;;;BU)")
                  .expect("deny ACE must not weaken the administrator boundary");''',
              '''            assert!(
                  validate_sddl(
                      "O:BAD:P(D;;FW;;;BU)(A;;FA;;;SY)(A;;FA;;;BA)(A;;FR;;;BU)"
                  )
                  .is_ok(),
                  "deny ACE must not weaken the administrator boundary"
              );''',
              1,
          )
          path.write_text(text)

      - name: Validate ACL tests
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p ergaxiom-windows-production-signer-host-runtime --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ergaxiom-windows-production-signer-host-runtime --all-targets -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated tests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-host-runtime/src/protected_path.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Satisfy ACL test lint policy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/tauri-production-acl-gate-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
