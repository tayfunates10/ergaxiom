name: One-shot DPAPI signer format and lock

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-dpapi-signer-format-lock.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-dpapi-signer-format-lock
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact signer branch
        uses: actions/checkout@v4
        with:
          ref: agent/dpapi-isolated-windows-signer-v1
          fetch-depth: 0

      - name: Format workspace and update lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-dpapi-signer-format-lock.yml
          git add Cargo.lock Cargo.toml apps/windows-signer crates/windows-signer-client-runtime crates/windows-signer-protocol-runtime
          git commit -m "Format DPAPI signer and update lockfile"
          git push origin HEAD:agent/dpapi-isolated-windows-signer-v1
