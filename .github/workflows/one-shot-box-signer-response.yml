name: One-shot allow bounded signer response

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-box-signer-response.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-allow-bounded-signer-response
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out signer branch
        uses: actions/checkout@v4
        with:
          ref: agent/dpapi-isolated-windows-signer-v1
          fetch-depth: 0

      - name: Document bounded one-response enum and format tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/windows-signer-protocol-runtime/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          needle = '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "status", rename_all = "SCREAMING_SNAKE_CASE")]
          pub enum SignerResponse {'''
          replacement = '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[allow(clippy::large_enum_variant)]
          #[serde(tag = "status", rename_all = "SCREAMING_SNAKE_CASE")]
          pub enum SignerResponse {'''
          if needle not in text:
              raise SystemExit("signer response enum pattern not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8", newline="\n")
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-box-signer-response.yml
          git add crates/windows-signer-protocol-runtime
          git commit -m "Document bounded signer response enum"
          git push origin HEAD:agent/dpapi-isolated-windows-signer-v1
