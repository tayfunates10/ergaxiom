name: One-shot key governance push runner

on:
  push:
    branches:
      - agent/key-governance-release-evidence-v1
    paths:
      - ".github/workflows/one-shot-key-governance-push-runner.yml"

permissions:
  contents: write

jobs:
  run-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/key-governance-release-evidence-v1
          fetch-depth: 0

      - name: Execute embedded integration body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-shot-key-governance-integration.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          start = next(index for index, line in enumerate(lines) if line == marker) + 1
          body = []
          for line in lines[start:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          if not body:
              raise SystemExit('embedded integration body not found')
          Path('/tmp/key-governance-integration.sh').write_text(
              '\n'.join(body) + '\n', encoding='utf-8'
          )
          PY
          bash /tmp/key-governance-integration.sh
