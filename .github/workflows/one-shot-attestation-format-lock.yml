name: One-shot attestation compatibility and lock refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/one-shot-attestation-format-lock.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-attestation-format-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/purpose-locked-attestation-issuance-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out attestation issuance branch
        uses: actions/checkout@v4
        with:
          ref: agent/purpose-locked-attestation-issuance-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore legacy verification order format refresh lockfile and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/attestation-runtime/src/verifier.rs")
          source = path.read_text(encoding="utf-8")
          old = '''pub fn verify_attestation(
              package: &AttestationPackage,
              trusted_keys: &AttestationKeyRegistry,
          ) -> Result<VerifiedAttestation, AttestationVerifyError> {
              let payload = &package.certificate.payload;
              let replay_manifest_digest = validate_document(&package.replay_manifest, payload)?;
              let key = trusted_key(trusted_keys, payload)?;
              let payload_value =
                  serde_json::to_value(payload).map_err(AttestationVerifyError::Serialization)?;
              let signature_bytes = URL_SAFE_NO_PAD
                  .decode(&package.certificate.signature.value)
                  .map_err(|_| AttestationVerifyError::InvalidSignatureEncoding)?;
              let signature = Signature::from_slice(&signature_bytes)
                  .map_err(|_| AttestationVerifyError::InvalidSignatureLength)?;
              key.verify_strict(&canonical_json_bytes(&payload_value)?, &signature)
                  .map_err(|_| AttestationVerifyError::SignatureVerificationFailed)?;
              verified_result(payload, &package.certificate, replay_manifest_digest)
          }
          '''
          new = '''pub fn verify_attestation(
              package: &AttestationPackage,
              trusted_keys: &AttestationKeyRegistry,
          ) -> Result<VerifiedAttestation, AttestationVerifyError> {
              let payload = &package.certificate.payload;
              let key = trusted_key(trusted_keys, payload)?;
              let payload_value =
                  serde_json::to_value(payload).map_err(AttestationVerifyError::Serialization)?;
              let signature_bytes = URL_SAFE_NO_PAD
                  .decode(&package.certificate.signature.value)
                  .map_err(|_| AttestationVerifyError::InvalidSignatureEncoding)?;
              let signature = Signature::from_slice(&signature_bytes)
                  .map_err(|_| AttestationVerifyError::InvalidSignatureLength)?;
              key.verify_strict(&canonical_json_bytes(&payload_value)?, &signature)
                  .map_err(|_| AttestationVerifyError::SignatureVerificationFailed)?;
              let replay_manifest_digest = validate_document(&package.replay_manifest, payload)?;
              verified_result(payload, &package.certificate, replay_manifest_digest)
          }
          '''
          if old not in source:
              raise SystemExit("legacy verification function did not match expected source")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-attestation-format-lock.yml
          git add -A
          git commit -m "Restore attestation verification compatibility"
          git push origin HEAD:agent/purpose-locked-attestation-issuance-v1
