name: Issue 75 Deterministic Repair

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Repair and commit when explicitly triggered
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "issue75: run deterministic repair" ]; then
            echo "No repair requested for this commit."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/production-execution-runtime/src/lib.rs')
          text = path.read_text()
          old = '    DesktopControlError, DesktopControlStatus, DesktopShellSnapshot, control_status_from_snapshot,\n'
          new = '    DesktopControlError, DesktopControlStatus, DesktopShellError, DesktopShellSnapshot,\n    control_status_from_snapshot,\n'
          if old not in text:
              raise SystemExit('desktop-shell import anchor not found')
          text = text.replace(old, new, 1)
          old = '    #[error(transparent)]\n    Desktop(#[from] DesktopControlError),\n'
          new = '    #[error(transparent)]\n    Desktop(#[from] DesktopControlError),\n    #[error(transparent)]\n    Shell(#[from] DesktopShellError),\n'
          if old not in text:
              raise SystemExit('store-error anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo +1.85.0 fmt --all
          git config user.name "Tayfun"
          git config user.email "tayfuna766@gmail.com"
          git add crates/production-execution-runtime/src/lib.rs
          git diff --cached --check
          git commit -m "issue75: fix runtime error conversion and formatting"
          git push origin HEAD:codex/issue-75
