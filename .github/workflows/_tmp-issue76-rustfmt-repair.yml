name: One-shot Issue 76 rustfmt repair

on:
  push:
    branches:
      - codex/ai3-issue76-persistent-user-jobs
    paths:
      - .github/workflows/_tmp-issue76-rustfmt-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/ai3-issue76-persistent-user-jobs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Format Tauri package
        run: cargo +1.85.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Enforce Issue 76 formatting scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "apps/desktop/src-tauri/src/product_jobs.rs"
          git diff --check
      - name: Commit rustfmt repair
        shell: bash
        run: |
          git config user.name "ergaxiom-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/product_jobs.rs
          git commit -m "fix(issue76): apply Rust 1.85 formatting to product jobs"
          git push origin HEAD:codex/ai3-issue76-persistent-user-jobs
