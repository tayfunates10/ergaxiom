name: Issue 75 Compile Diagnostics

on:
  push:
    branches:
      - codex/issue-75
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Format working copy for compile diagnostics
        run: cargo fmt --all
      - name: Quiet runtime check
        shell: bash
        run: |
          set +e
          output="$(cargo check --quiet -p ergaxiom-production-execution-runtime --all-targets 2>&1)"
          status=$?
          if [ "$status" -ne 0 ]; then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=runtime cargo check failed::$escaped"
            exit "$status"
          fi
