name: One-shot governance API finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-governance-api-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-governance-api-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      BRANCH_NAME: agent/key-governance-release-evidence-v1
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Format, verify and commit atomically through Git Database API
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo test \
            -p ergaxiom-key-governance-runtime \
            -p ergaxiom-governed-verification-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-attestation-runtime
          cargo clippy \
            -p ergaxiom-key-governance-runtime \
            -p ergaxiom-governed-verification-runtime \
            -p ergaxiom-capability-runtime \
            -p ergaxiom-attestation-runtime \
            --all-targets --all-features -- -D warnings
          python -m unittest tools/release/test_generate_release_evidence.py
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH_NAME"]
          expected_head = os.environ["EXPECTED_HEAD"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}"

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ergaxiom-governance-finalizer",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  raise SystemExit(error.read().decode("utf-8", errors="replace")) from error
              return json.loads(body) if body else {}

          ref = request("GET", f"/git/ref/heads/{branch}")
          actual_head = ref["object"]["sha"]
          if actual_head != expected_head:
              raise SystemExit(
                  f"branch moved during finalization: expected {expected_head}, actual {actual_head}"
              )

          commit = request("GET", f"/git/commits/{actual_head}")
          base_tree = commit["tree"]["sha"]
          files = [
              "Cargo.lock",
              "crates/key-governance-runtime/src/lib.rs",
              "crates/key-governance-runtime/tests/governance.rs",
              "crates/governed-verification-runtime/src/lib.rs",
              "crates/governed-verification-runtime/tests/governed.rs",
          ]
          entries = []
          for file_name in files:
              encoded = base64.b64encode(Path(file_name).read_bytes()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": encoded, "encoding": "base64"})
              entries.append(
                  {"path": file_name, "mode": "100644", "type": "blob", "sha": blob["sha"]}
              )

          for workflow in [
              ".github/workflows/one-shot-governance-api-finalizer.yml",
              ".github/workflows/one-shot-governance-format-lock.yml",
          ]:
              entries.append(
                  {"path": workflow, "mode": "100644", "type": "blob", "sha": None}
              )

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          new_commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Finalize governed verification and release evidence",
                  "tree": tree["sha"],
                  "parents": [actual_head],
              },
          )
          request(
              "PATCH",
              f"/git/refs/heads/{branch}",
              {"sha": new_commit["sha"], "force": False},
          )
          print(new_commit["sha"])
          PY
