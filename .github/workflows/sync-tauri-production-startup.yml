name: Sync Tauri production startup

on:
  push:
    branches:
      - agent/tauri-production-startup-v1
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/backend-issuance-runtime/**"
      - "crates/windows-production-signer-host-runtime/**"
      - "docs/architecture/47-tauri-production-startup-boundary.md"
      - ".github/workflows/sync-tauri-production-startup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tauri-production-startup-v1
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Repair pin validator expression
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/desktop/src-tauri/src/production_startup.rs")
          text = path.read_text()
          text = text.replace(
              "byte.is_ascii_digit() || matches!(byte, b'a'..=b'f')",
              "byte.is_ascii_digit() || matches!(*byte, b'a'..=b'f')",
          )
          path.write_text(text)

      - name: Refresh lockfile and formatting
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck and test renderer boundary
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint Tauri startup boundary
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Tauri startup boundary
        shell: pwsh
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified source and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/lib.rs apps/desktop/src-tauri/src/production_startup.rs apps/desktop/src-tauri/capabilities/desktop-readonly.json apps/desktop/src-tauri/permissions/desktop-shell.toml apps/desktop/src/api.ts apps/desktop/src/types.ts docs/architecture/47-tauri-production-startup-boundary.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Load pinned production configuration at Tauri startup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/tauri-production-startup-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
