name: Sync ACL SDDL tests

on:
  pull_request:
    paths:
      - "crates/windows-production-signer-host-runtime/**"
      - ".github/workflows/sync-acl-sddl-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tauri-production-acl-gate-v1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add SDDL contract tests
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/windows-production-signer-host-runtime/src/protected_path.rs")
          text = path.read_text()
          text = text.replace(
              "ConvertSidToStringSidW, GetNamedSecurityInfoW, SE_FILE_OBJECT,",
              "ConvertSidToStringSidW, ConvertStringSecurityDescriptorToSecurityDescriptorW,\n        GetNamedSecurityInfoW, SE_FILE_OBJECT,",
              1,
          )
          text = text.replace(
              "DACL_SECURITY_INFORMATION, GetAce, GetAclInformation, GetSecurityDescriptorControl,\n        IsValidSid, OWNER_SECURITY_INFORMATION, SE_DACL_PROTECTED, SECURITY_DESCRIPTOR_CONTROL,",
              "DACL_SECURITY_INFORMATION, GetAce, GetAclInformation, GetSecurityDescriptorControl,\n        GetSecurityDescriptorDacl, GetSecurityDescriptorOwner, IsValidSid,\n        OWNER_SECURITY_INFORMATION, SE_DACL_PROTECTED, SECURITY_DESCRIPTOR_CONTROL,",
              1,
          )
          if "accepts_protected_administrator_descriptor" not in text:
              insertion = r'''

    #[cfg(test)]
    mod tests {
        use super::*;

        const SDDL_REVISION_1: u32 = 1;

        fn validate_sddl(sddl: &str) -> Result<(), ProductionSignerHostError> {
            let encoded: Vec<u16> = sddl.encode_utf16().chain(std::iter::once(0)).collect();
            let mut raw = null_mut();
            // SAFETY: encoded is NUL-terminated and raw points to writable descriptor storage.
            if unsafe {
                ConvertStringSecurityDescriptorToSecurityDescriptorW(
                    encoded.as_ptr(),
                    SDDL_REVISION_1,
                    &mut raw,
                    null_mut(),
                )
            } == 0
            {
                return Err(last_security_error());
            }
            let descriptor = SecurityDescriptor::owned(raw)?;
            let mut owner = null_mut();
            let mut owner_defaulted = 0;
            // SAFETY: descriptor is a live self-relative security descriptor.
            if unsafe {
                GetSecurityDescriptorOwner(
                    descriptor.raw,
                    &mut owner,
                    &mut owner_defaulted,
                )
            } == 0
            {
                return Err(last_security_error());
            }
            let mut dacl_present = 0;
            let mut dacl = null_mut();
            let mut dacl_defaulted = 0;
            // SAFETY: descriptor is live and all output pointers refer to writable storage.
            if unsafe {
                GetSecurityDescriptorDacl(
                    descriptor.raw,
                    &mut dacl_present,
                    &mut dacl,
                    &mut dacl_defaulted,
                )
            } == 0
            {
                return Err(last_security_error());
            }
            if dacl_present == 0 {
                return Err(ProductionSignerHostError::AdministratorControlledDaclMissing);
            }
            validate_descriptor(descriptor.raw, owner, dacl)
        }

        #[test]
        fn accepts_protected_administrator_descriptor() {
            validate_sddl("O:BAD:P(A;;FA;;;SY)(A;;FA;;;BA)(A;;FR;;;BU)")
                .expect("protected administrator descriptor must pass");
        }

        #[test]
        fn accepts_non_administrator_deny_ace() {
            validate_sddl("O:BAD:P(D;;FW;;;BU)(A;;FA;;;SY)(A;;FA;;;BA)(A;;FR;;;BU)")
                .expect("deny ACE must not weaken the administrator boundary");
        }

        #[test]
        fn rejects_non_administrator_owner() {
            assert!(matches!(
                validate_sddl("O:BUD:P(A;;FA;;;SY)(A;;FA;;;BA)"),
                Err(ProductionSignerHostError::AdministratorControlledOwnerRejected)
            ));
        }

        #[test]
        fn rejects_unprotected_dacl() {
            assert!(matches!(
                validate_sddl("O:BAD:(A;;FA;;;SY)(A;;FA;;;BA)"),
                Err(ProductionSignerHostError::AdministratorControlledDaclNotProtected)
            ));
        }

        #[test]
        fn rejects_non_administrator_write_ace() {
            assert!(matches!(
                validate_sddl("O:BAD:P(A;;FA;;;SY)(A;;FA;;;BA)(A;;FW;;;BU)"),
                Err(ProductionSignerHostError::AdministratorControlledWriteAccessRejected)
            ));
        }
    }
'''
              index = text.rfind("\n}")
              if index < 0:
                  raise SystemExit("windows module closing brace missing")
              text = text[:index] + insertion + text[index:]
          path.write_text(text)

      - name: Validate SDDL contract
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p ergaxiom-windows-production-signer-host-runtime --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ergaxiom-windows-production-signer-host-runtime --all-targets -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated SDDL tests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/windows-production-signer-host-runtime/src/protected_path.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Test administrator-controlled ACL descriptors"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/tauri-production-acl-gate-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
