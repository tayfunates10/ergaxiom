name: Sync PR 63 with main

on:
  pull_request:
    paths:
      - ".github/workflows/sync-pr63-main.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Merge current main into the stacked branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main
      - name: Verify canonical workspace
        run: cargo fmt --all -- --check
      - name: Lint backend production issuance
        run: >-
          cargo clippy
          -p ergaxiom-backend-issuance-runtime
          --all-targets
          --all-features
          --
          -D warnings
      - name: Run backend production issuance tests
        run: cargo test -p ergaxiom-backend-issuance-runtime --all-features
      - name: Push synchronized branch
        shell: bash
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
