name: Issue 75 Windows Compile Fix

on:
  push:
    branches:
      - codex/issue-75

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'issue75-run-windows-compile-fix'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-75
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Apply deterministic source fixes
        run: python .github/scripts/issue75_windows_compile_fix.py
      - name: Format workspace
        run: cargo +1.85.0 fmt --all
      - name: Verify desktop production boundary
        run: cargo +1.85.0 check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - name: Commit verified source files
        shell: pwsh
        run: |
          git config user.name Tayfun
          git config user.email tayfuna766@gmail.com
          git add apps/desktop/src-tauri/src/pipeline.rs apps/desktop/src-tauri/src/production_pipeline.rs apps/desktop/src-tauri/src/commands.rs
          git diff --cached --check
          git commit -m "issue75: fix Windows production desktop compile"
          git push origin HEAD:codex/issue-75
