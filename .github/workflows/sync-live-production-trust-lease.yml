        }
        match generation {
            1 => Ok(&self.generation_one),
            2 if !self.substitute_generation_two => Ok(&self.generation_two),
            2 => Ok(&self.generation_one),
            _ => Err(HardwareSignerBackendError::new(
                "KEY_GENERATION_UNSUPPORTED",
            )),
        }'''
          if old_key not in test:
