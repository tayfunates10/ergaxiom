name: Production Execution Chain

on:
  push:
    branches:
      - codex/issue-75
  pull_request:
    paths:
      - "crates/production-execution-runtime/**"
      - "crates/backend-issuance-runtime/**"
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/production-execution-chain.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-execution-runtime:
    name: production-execution-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p ergaxiom-production-execution-runtime --all-targets -- -D warnings
      - name: Runtime tests
        run: cargo test -p ergaxiom-production-execution-runtime
      - name: Backend persistent issuance regression
        run: cargo test -p ergaxiom-backend-issuance-runtime --test persistent_production_capability

  desktop-boundary:
    name: desktop-boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy
      - name: Desktop production boundary compile
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
