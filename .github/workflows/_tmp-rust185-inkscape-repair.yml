name: One-shot Rust 1.85 Inkscape repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_tmp-rust185-inkscape-repair.yml
  push:
    branches:
      - fix/rust-1-85-inkscape-let-chains
    paths:
      - .github/workflows/_tmp-rust185-inkscape-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rust-1-85-inkscape-let-chains
      - name: Rewrite only unsupported let chains
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/inkscape-adapter-runtime/src/operators.rs')
          text = path.read_text()

          start_old = '''                if let Some(expected_parent) = parent_id
                    && element_id(&start, reader.decoder())?.as_deref() == Some(expected_parent)
                {
                    target_count += 1;
                    if target_count > 1 {
                        return Err(InkscapeAdapterError::DuplicateElementId(
                            expected_parent.to_owned(),
                        )
                        .into());
                    }
                    target_depth = Some(current_depth);
                }
'''
          start_new = '''                if let Some(expected_parent) = parent_id {
                    if element_id(&start, reader.decoder())?.as_deref() == Some(expected_parent) {
                        target_count += 1;
                        if target_count > 1 {
                            return Err(InkscapeAdapterError::DuplicateElementId(
                                expected_parent.to_owned(),
                            )
                            .into());
                        }
                        target_depth = Some(current_depth);
                    }
                }
'''

          empty_old = '''                if let Some(expected_parent) = parent_id
                    && element_id(&empty, reader.decoder())?.as_deref() == Some(expected_parent)
                {
                    return Err(ProofBoundOperatorError::InvalidLayer(
                        expected_parent.to_owned(),
                    ));
                }
'''
          empty_new = '''                if let Some(expected_parent) = parent_id {
                    if element_id(&empty, reader.decoder())?.as_deref() == Some(expected_parent) {
                        return Err(ProofBoundOperatorError::InvalidLayer(
                            expected_parent.to_owned(),
                        ));
                    }
                }
'''

          attrs_old = '''                if let Some(id) = id
                    && let Some(attribute_changes) = changes.get(&id)
                {
'''
          attrs_new = '''                let matched_change = id.as_ref().and_then(|id| {
                    changes
                        .get(id)
                        .map(|attribute_changes| (id, attribute_changes))
                });
                if let Some((id, attribute_changes)) = matched_change {
'''

          checks = [(start_old, 1), (empty_old, 1), (attrs_old, 2)]
          for old, expected in checks:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'expected {expected} exact matches, found {actual}')

          text = text.replace(start_old, start_new, 1)
          text = text.replace(empty_old, empty_new, 1)
          text = text.replace(attrs_old, attrs_new)

          if '&& let Some(attribute_changes)' in text:
              raise SystemExit('unsupported attribute let-chain still present')
          if 'if let Some(expected_parent) = parent_id\n                    &&' in text:
              raise SystemExit('unsupported parent let-chain still present')

          path.write_text(text)
          PY
      - name: Enforce one-file scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = "crates/inkscape-adapter-runtime/src/operators.rs"
          git diff --check
      - name: Commit syntax repair
        shell: bash
        run: |
          git config user.name "ergaxiom-ci-repair"
          git config user.email "actions@users.noreply.github.com"
          git add crates/inkscape-adapter-runtime/src/operators.rs
          git commit -m "fix: keep Inkscape operators compatible with Rust 1.85"
          git push origin HEAD:fix/rust-1-85-inkscape-let-chains
