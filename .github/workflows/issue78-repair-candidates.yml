name: Issue 78 repair candidates

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "crates/desktop-user-job-runtime/**"
      - "crates/production-execution-runtime/**"
      - ".github/workflows/issue78-repair-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: issue78-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Reject source substitution
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - name: Generate exact candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidates"
          cargo generate-lockfile
          cp Cargo.lock "$RUNNER_TEMP/candidates/Cargo.lock"
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cp apps/desktop/src-tauri/Cargo.lock "$RUNNER_TEMP/candidates/tauri-Cargo.lock"
          cargo fmt --all
          cp crates/desktop-user-job-runtime/src/lib.rs "$RUNNER_TEMP/candidates/desktop-user-job-lib.rs"
          cp crates/production-execution-runtime/src/bin/verify_production_release_chain.rs "$RUNNER_TEMP/candidates/verify-production-release-chain.rs"
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: issue78-exact-repair-candidates
          path: ${{ runner.temp }}/candidates/*
          if-no-files-found: error
          retention-days: 7
