name: Temporary lopdf Rust 1.85 lock repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-lopdf-rust185-lock-repair.yml"

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rust-1-85-lopdf-compat

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Repair Rust 1.85 test lint without suppression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/print-ready-poster-preflight-certified-path-runtime/tests/path.rs")
          source = path.read_text(encoding="utf-8")
          old_import = "use std::error::Error;"
          new_import = "use std::{error::Error, fmt::Write as _};"
          old_fn = '''fn sha256(bytes: &[u8]) -> String {
              Sha256::digest(bytes)
                  .iter()
                  .map(|byte| format!("{byte:02x}"))
                  .collect()
          }'''
          new_fn = '''fn sha256(bytes: &[u8]) -> String {
              let digest = Sha256::digest(bytes);
              let mut encoded = String::with_capacity(digest.len() * 2);
              for byte in digest {
                  write!(&mut encoded, "{byte:02x}").expect("writing to a String cannot fail");
              }
              encoded
          }'''
          if old_import not in source:
              raise SystemExit("expected std::error::Error import not found")
          if old_fn not in source:
              raise SystemExit("expected test sha256 helper not found")
          source = source.replace(old_import, new_import, 1).replace(old_fn, new_fn, 1)
          path.write_text(source, encoding="utf-8")
          PY
          cargo +1.85.0 fmt --all -- --check

      - name: Resolve Rust 1.85-compatible PDF dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 update -p lopdf --precise 0.40.0
          cargo +1.85.0 update -p time --precise 0.3.45

      - name: Verify locked print PDF graph on Rust 1.85
        run: cargo +1.85.0 check --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime --all-targets

      - name: Lint print PDF graph on Rust 1.85
        run: cargo +1.85.0 clippy --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime --all-targets --all-features -- -D warnings

      - name: Run print PDF deterministic tests on Rust 1.85
        run: cargo +1.85.0 test --locked -p ergaxiom-print-ready-poster-preflight-certified-path-runtime

      - name: Commit generated compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/print-ready-poster-preflight-certified-path-runtime/tests/path.rs
          git diff --cached --check
          git diff --cached --quiet && { echo "compatibility repair did not change files"; exit 1; }
          git commit -m "fix: lock Rust 1.85-compatible print PDF graph"
          git push origin HEAD:fix/rust-1-85-lopdf-compat
